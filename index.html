<style>
  :root{
    --paper:#F3F1FB;
    --surface:#FFFFFF;
    --ink:#211C4E;
    --ink-soft:#5A5480;
    --border:#DDD7F2;
    --math:#F0A202;
    --math-soft:#FCEACB;
    --science:#1B998B;
    --science-soft:#D6EFEA;
    --english:#E4572E;
    --english-soft:#FBE1D9;
    --accent:var(--ink);
    --accent-soft:#E7E3F8;
    --good:#1B998B;
    --bad:#E4572E;
    --radius:18px;
    --shadow:0 12px 30px -14px rgba(33,28,78,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%),
      radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%),
      var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
    transition:background 0.6s ease;
  }
  .wrap{ width:100%; max-width:560px; }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:10px; }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:clamp(22px,5.5vw,28px); font-weight:700; letter-spacing:-0.02em; margin:0; line-height:1.05; }
  .brand h1 span{ color:var(--accent); }
  .brand .tag{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.04em; text-align:right; line-height:1.4; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; }

  .navbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .navbar .who{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .navbar .who b{ color:var(--ink); }
  .nav-actions{ display:flex; gap:8px; }
  .pill-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;

  .pill-btn.outline{ background:transparent; border:1.5px solid var(--border); }

  .subject-strip{ display:flex; gap:8px; margin-bottom:20px; }
  .subject-chip{ flex:1; padding:10px 8px; border-radius:12px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.03em; }
  .subject-chip.math{ background:var(--math-soft); color:#7A5300; }
  .subject-chip.science{ background:var(--science-soft); color:#0E5C52; }
  .subject-chip.english{ background:var(--english-soft); color:#8E2E15; }

  .field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:0 0 8px 2px; }

    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
    outline:none; margin-bottom:16px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea{ min-height:90px; resize:vertical; font-family:'IBM Plex Sans', sans-serif; }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .radio-group{ display:flex; gap:10px; margin-bottom:16px; }
  .radio-opt{
    flex:1; border:1.5px solid var(--border); border-radius:12px; padding:12px; text-align:center;
    font-size:14px; font-weight:600; cursor:pointer; background:var(--paper);
  }
  .radio-opt.active{ border-color:var(--accent); background:var(--accent-soft); }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .mode-btn{ cursor:pointer; border:1.5px solid var(--border); background:var(--paper); border-radius:14px; padding:16px 10px; text-align:left; transition:all .15s ease; }
  .mode-btn:hover{ border-color:var(--accent); }
  .mode-btn.active{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft); }
  .mode-btn .mtitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; display:block; margin-bottom:4px; }
  .mode-btn .msub{ font-size:11.5px; color:var(--ink-soft); line-height:1.35; display:block; }
  .mode-btn:disabled, .mode-btn.locked{ opacity:0.45; cursor:not-allowed; }

  .primary-btn{
    width:100%; border:none; cursor:pointer; background:var(--ink); color:#fff;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.01em;
    padding:15px 18px; border-radius:14px; transition:transform .12s ease, opacity .15s ease;
  }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }
  .primary-btn.danger{ background:var(--bad); }

  .fine-print{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.5; }
  .link-btn{ background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .error-note{ font-size:12.5px; color:var(--bad); margin:-8px 0 14px; }

  .hero{ text-align:center; padding:10px 4px 24px; }
  .hero .kicker{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:10px; }
  .hero h2{ font-family:'Space Grotesk', sans-serif; font-size:24px; font-weight:700; line-height:1.25; margin:0 0 12px; }
  .hero p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 22px; }

  .feature-item{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-soft); }

  .qcount{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }

  .qtext{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:600; line-height:1.35; margin:4px 0 20px; min-height:52px; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{ display:flex; align-items:center; gap:12px; text-align:left; padding:13px 14px; border-radius:13px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; font-size:14.5px; color:var(--ink); transition:all .12s ease; }
  .choice:hover{ border-color:var(--accent); }
  .choice .klabel{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px; width:22px; height:22px; border-radius:7px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .choice.correct{ background:#E4F5F1; border-color:var(--good); color:#0E5C52; }
  .choice.correct .klabel{ background:var(--good); border-color:var(--good); color:#fff; }
  .choice.wrong{ background:#FCE7E1; border-color:var(--bad); color:#8E2E15; }
  .choice.wrong .klabel{ background:var(--bad); border-color:var(--bad); color:#fff; }

  .result-hero .msg{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600; margin-top:10px; }
  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  table.results-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.results-table th, table.results-table td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); }
  table.results-table th{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); }
  .tag-pre{ background:var(--math-soft); color:#7A5300; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }
  .tag-post{ background:var(--science-soft); color:#0E5C52; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }

  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .reviewer-box{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; white-space:pre-wrap; font-size:14px; line-height:1.6; }

  .float-pt{ position:fixed; pointer-events:none; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; animation:floatUp .8s ease forwards; z-index:50; }
  @keyframes floatUp{ 0%{ opacity:1; transform:translateY(0);} 100%{ opacity:0; transform:translateY(-38px);} }
  .fade-in{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  footer.credit{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:18px; font-family:'IBM Plex Mono', monospace; }
</style>
</head>

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function genJoinCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function buildQuizQueue(subject, testType, numQuestions){
  const pool = BANK[testType][subject];
  const picked = shuffle(pool).slice(0, Math.min(numQuestions, pool.length));
  return picked.map(item => {
    const correctText = item.c[item.a];
    const shuffledChoices = shuffle(item.c);
    const newA = shuffledChoices.indexOf(correctText);
    return {subject, q:item.q, c:shuffledChoices, a:newA};
  });
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

   ============================================================ */
auth.onAuthStateChanged(async (user) => {
  if(user){
    try{
      const doc = await db.collection("users").doc(user.uid).get();
      if(doc.exists){
        state.authUser = {uid:user.uid, email:user.email, ...doc.data()};
        state.screen = state.authUser.role === "teacher" ? "teacherHome" : "studentHome";
        route();
      } else {
        state.screen = "signup";
        route();
      }
    }catch(e){
      console.error(e);
      state.screen = "landing";
      route();
    }
  } else {
    state.authUser = null;
    if(["teacherHome","classEditor","teacherResults","studentHome","studentClass","review","quiz","results"].includes(state.screen)){
      state.screen = "landing";
    }
    route();
  }
});

function route(){
  clearInterval(state.timerId);
  if(state.screen === "landing") return renderLanding();
  if(state.screen === "login") return renderAuth("login");
  if(state.screen === "signup") return renderAuth("signup");
  if(state.screen === "teacherHome") return renderTeacherHome();
  if(state.screen === "classEditor") return renderClassEditor();
  if(state.screen === "teacherResults") return renderTeacherResults();
  if(state.screen === "studentHome") return renderStudentHome();
  if(state.screen === "studentClass") return renderStudentClass();
  if(state.screen === "review") return renderReview();
  if(state.screen === "quiz") return renderQuestion();
  if(state.screen === "results") return renderResults();
}

function renderAuth(mode){
  document.body.style.background = `radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;
  const isSignup = mode === "signup";
  app.innerHTML = `
    <div class="fade-in">
      <p class="field-label">${isSignup ? "Create Account" : "Log In"}</p>
      ${isSignup ? `
        <p class="field-label">I am a</p>
        <div class="radio-group">
          <div class="radio-opt ${state.pendingRole==='teacher'?'active':''}" data-role="teacher">Teacher</div>
          <div class="radio-opt ${state.pendingRole==='student'?'active':''}" data-role="student">Student</div>
        </div>
        <input type="text" id="nameInput" placeholder="Full name">
      ` : ``}
      <input type="email" id="emailInput" placeholder="Email address">
      <input type="password" id="passInput" placeholder="Password">
      ${state.authError ? `<p class="error-note">${escapeHtml(state.authError)}</p>` : ``}
      <button class="primary-btn" id="submitAuth">${isSignup ? "Create Account" : "Log In"}</button>
      <p class="fine-print">
        ${isSignup ? `Already have an account? <button class="link-btn" id="switchMode">Log in</button>`
                   : `New here? <button class="link-btn" id="switchMode">Create an account</button>`}
        <br><button class="link-btn" id="backHome">Back to home</button>
      </p>
    </div>
  `;

  if(isSignup){
    document.querySelectorAll(".radio-opt").forEach(el=>{
      el.addEventListener("click", ()=>{ state.pendingRole = el.dataset.role; renderAuth("signup"); });
    });
  }

  document.getElementById("switchMode").addEventListener("click", ()=>{
    state.screen = isSignup ? "login" : "signup";
    state.authError = "";
    route();
  });
  document.getElementById("backHome").addEventListener("click", ()=>{ state.screen="landing"; route(); });

  document.getElementById("submitAuth").addEventListener("click", async ()=>{
    const email = document.getElementById("emailInput").value.trim();
    const pass = document.getElementById("passInput").value;
    const btn = document.getElementById("submitAuth");
    state.authError = "";
    if(!email || !pass){ state.authError = "Please fill in all fields."; renderAuth(mode); return; }
    btn.disabled = true;
    btn.textContent = "Please wait...";
    try{
      if(isSignup){
        const name = document.getElementById("nameInput").value.trim();
        if(!name){ state.authError = "Please enter your name."; renderAuth("signup"); return; }
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection("users").doc(cred.user.uid).set({
          role: state.pendingRole, name, email, createdAt: Date.now()
        });
      } else {
        await auth.signInWithEmailAndPassword(email, pass);
      }
    }catch(err){
      state.authError = err.message.replace("Firebase: ", "");
      renderAuth(mode);
    }
  });
}

  document.getElementById("logoutBtn").addEventListener("click", ()=> auth.signOut());
  document.getElementById("createClassBtn").addEventListener("click", ()=>{
    state.activeClassId = null;
    state.activeClass = null;
    state.classError = "";
    state.screen = "classEditor";
    route();
  });
  document.querySelectorAll(".class-card").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.activeClassId = el.dataset.id;
      state.activeClass = classes.find(c=>c.id === el.dataset.id);
      state.classError = "";
      state.screen = "classEditor";
      route();
    });
  });
}

/* ============================================================
   TEACHER: CLASS EDITOR
   ============================================================ */
function renderClassEditor(){
  document.body.style.background = `radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;
  const c = state.activeClass || {};
  const isNew = !state.activeClassId;

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${isNew ? "New Class" : "Edit Class"}</div>
      </div>
      ${!isNew ? `<div class="code-display">${c.joinCode}</div><p class="fine-print" style="margin-top:-10px;">Share this join code with your students.</p>` : ``}

      <p class="field-label">Class name</p>
      <input type="text" id="classNameInput" placeholder="e.g. 11 - Vanguard" value="${escapeHtml(c.className||"")}">

      <p class="field-label">Subject</p>
      <select id="subjectSelect">
        ${ORDER.map(s=>`<option value="${s}" ${c.subject===s?'selected':''}>${SUBJECT_META[s].label}</option>`).join("")}
      </select>

      <p class="field-label">Number of questions per test (max ${MAX_PICKABLE}, pool of ${POOL_SIZE})</p>
      <input type="number" id="numQInput" min="1" max="${MAX_PICKABLE}" value="${c.numQuestions||10}">

      <p class="field-label">Timer per question (seconds)</p>
      <select id="timerSelect">
        ${[15,20,30,45,60].map(t=>`<option value="${t}" ${c.timerSeconds===t?'selected':''}>${t} seconds</option>`).join("")}
      </select>

      <p class="field-label">Schedule (optional, leave blank for always open)</p>
      <input type="datetime-local" id="startInput" value="${c.scheduleStart||""}">
      <input type="datetime-local" id="endInput" value="${c.scheduleEnd||""}">

      <p class="field-label">Reviewer notes (optional)</p>
      <textarea id="reviewerTextInput" placeholder="Type reviewer notes for your students...">${escapeHtml(c.reviewerText||"")}</textarea>

      <p class="field-label">Reviewer link (optional)</p>
      <input type="url" id="reviewerLinkInput" placeholder="https://docs.google.com/..." value="${escapeHtml(c.reviewerLink||"")}">

      ${state.classError ? `<p class="error-note">${escapeHtml(state.classError)}</p>` : ``}

      <button class="primary-btn" id="saveClassBtn">${isNew ? "Create Class" : "Save Changes"}</button>
      ${!isNew ? `
        <div class="btn-row">
          <button class="primary-btn ghost" id="viewResultsBtn">View Results</button>
          <button class="primary-btn danger" id="deleteClassBtn">Delete Class</button>
        </div>
      ` : ``}
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="teacherHome"; route(); });

  document.getElementById("saveClassBtn").addEventListener("click", async ()=>{
    const className = document.getElementById("classNameInput").value.trim();
    const subject = document.getElementById("subjectSelect").value;
    let numQuestions = parseInt(document.getElementById("numQInput").value, 10);
    const timerSeconds = parseInt(document.getElementById("timerSelect").value, 10);
    const scheduleStart = document.getElementById("startInput").value;
    const scheduleEnd = document.getElementById("endInput").value;
    const reviewerText = document.getElementById("reviewerTextInput").value.trim();
    const reviewerLink = document.getElementById("reviewerLinkInput").value.trim();

    if(!className){ state.classError = "Please enter a class name."; renderClassEditor(); return; }
    if(!numQuestions || numQuestions < 1) numQuestions = 1;
    if(numQuestions > MAX_PICKABLE) numQuestions = MAX_PICKABLE;
    state.classError = "";

    const btn = document.getElementById("saveClassBtn");
    btn.disabled = true; btn.textContent = "Saving...";

    try{
      const payload = { teacherUid: state.authUser.uid, teacherName: state.authUser.name,
        className, subject, numQuestions, timerSeconds, scheduleStart, scheduleEnd, reviewerText, reviewerLink };
      if(isNew){
        payload.joinCode = genJoinCode();
        payload.createdAt = Date.now();
        await db.collection("classes").add(payload);
      } else {
        await db.collection("classes").doc(state.activeClassId).update(payload);
      }
      state.screen = "teacherHome";
      route();
    }catch(err){
      state.classError = err.message;
      renderClassEditor();
    }
  });

  if(!isNew){
    document.getElementById("viewResultsBtn").addEventListener("click", ()=>{ state.screen="teacherResults"; route(); });
    document.getElementById("deleteClassBtn").addEventListener("click", async ()=>{
      if(!confirm("Delete this class? This cannot be undone.")) return;
      try{
        await db.collection("classes").doc(state.activeClassId).delete();
        state.screen = "teacherHome";
        route();
      }catch(err){ alert("Couldn't delete: " + err.message); }
    });
  }
}

/* ============================================================
   TEACHER: CLASS RESULTS
   ============================================================ */
async function renderTeacherResults(){
  document.body.style.background = `radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading results...</p></div>`;

  let rows = [];
  try{
    const snap = await db.collection("attempts").where("classId","==",state.activeClassId).get();
    snap.forEach(doc => rows.push(doc.data()));
    rows.sort((a,b)=> b.timestamp - a.timestamp);
  }catch(e){ console.error(e); }

  const tableRows = rows.map(r=>{
    const tag = r.testType === "pretest" ? `<span class="tag-pre">PRE</span>` : `<span class="tag-post">POST</span>`;
    return `<tr>
      <td>${escapeHtml(r.studentName)}</td>
      <td>${tag}</td>
      <td>${r.correct}/${r.total}</td>
      <td>${r.pct}%</td>
      <td>${fmtDate(r.timestamp)}</td>
    </tr>`;
  }).join("");

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(state.activeClass.className)}</div>
      </div>
      ${rows.length === 0 ? `<p class="empty-note">No attempts saved yet for this class.</p>` : `
        <div style="overflow-x:auto;">
          <table class="results-table">
            <thead><tr><th>Name</th><th>Test</th><th>Score</th><th>%</th><th>Date</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      `}
      <button class="primary-btn ghost" id="refreshBtn" style="margin-top:16px;">Refresh</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="classEditor"; route(); });
  document.getElementById("refreshBtn").addEventListener("click", renderTeacherResults);
}

/* ============================================================
   STUDENT: HOME
   ============================================================ */
async function renderStudentHome(){
  document.body.style.background = `radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading your classes...</p></div>`;

  let classes = [];
  try{
    const enrollSnap = await db.collection("enrollments").where("studentUid","==",state.authUser.uid).get();
    const classIds = [];
    enrollSnap.forEach(doc => classIds.push(doc.data().classId));
    for(const cid of classIds){
      const cdoc = await db.collection("classes").doc(cid).get();
      if(cdoc.exists) classes.push({id:cdoc.id, ...cdoc.data()});
    }
  }catch(e){ console.error(e); }
  state.classes = classes;

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <div class="who">Student &middot; <b>${escapeHtml(state.authUser.name)}</b></div>
        <div class="nav-actions"><button class="pill-btn outline" id="logoutBtn">Log out</button></div>
      </div>
      <p class="field-label">Your Classes</p>
      ${classes.length === 0 ? `<p class="empty-note">You haven't joined a class yet.</p>` : classes.map(c=>`
        <div class="class-card" data-id="${c.id}">
          <div class="ctitle">${escapeHtml(c.className)}</div>
          <div class="cmeta">${SUBJECT_META[c.subject].label.toUpperCase()} &middot; ${escapeHtml(c.teacherName||"")}</div>
        </div>
      `).join("")}
      <p class="field-label" style="margin-top:14px;">Join a class</p>
      <input type="text" id="joinCodeInput" placeholder="Enter class code">
      ${state.joinError ? `<p class="error-note">${escapeHtml(state.joinError)}</p>` : ``}
      <button class="primary-btn" id="joinBtn">Join Class</button>
    </div>
  `;

  document.getElementById("logoutBtn").addEventListener("click", ()=> auth.signOut());
  document.querySelectorAll(".class-card").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.activeClassId = el.dataset.id;
      state.activeClass = classes.find(c=>c.id === el.dataset.id);
      state.screen = "studentClass";
      route();
    });
  });
  document.getElementById("joinBtn").addEventListener("click", async ()=>{
    const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
    state.joinError = "";
    if(!code){ state.joinError = "Please enter a class code."; renderStudentHome(); return; }
    const btn = document.getElementById("joinBtn");
    btn.disabled = true; btn.textContent = "Joining...";
    try{
      const snap = await db.collection("classes").where("joinCode","==",code).limit(1).get();
      if(snap.empty){ state.joinError = "No class found with that code."; renderStudentHome(); return; }
      const classDoc = snap.docs[0];
      const already = classes.find(c => c.id === classDoc.id);
      if(already){ state.joinError = "You're already in this class."; renderStudentHome(); return; }
      await db.collection("enrollments").add({
        studentUid: state.authUser.uid, studentName: state.authUser.name,
        classId: classDoc.id, joinedAt: Date.now()
      });
      renderStudentHome();
    }catch(err){
      state.joinError = err.message;
      renderStudentHome();
    }
  });
}

/* ============================================================
   STUDENT: CLASS VIEW
   ============================================================ */
async function renderStudentClass(){
  document.body.style.background = `radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading...</p></div>`;

  const c = state.activeClass;
  const meta = SUBJECT_META[c.subject];

  let pretestCount = 0;
  try{
    const snap = await db.collection("attempts")
      .where("classId","==",state.activeClassId)
      .where("studentUid","==",state.authUser.uid)
      .where("testType","==","pretest").get();
    pretestCount = snap.size;
  }catch(e){ console.error(e); }
  state.pretestAttempts = pretestCount;

  const now = new Date();
  let scheduleNote = "Open anytime";
  let scheduleLocked = false;
  if(c.scheduleStart){
    const start = new Date(c.scheduleStart);
    if(now < start){ scheduleNote = "Opens " + start.toLocaleString(); scheduleLocked = true; }
  }
  if(!scheduleLocked && c.scheduleEnd){
    const end = new Date(c.scheduleEnd);
    if(now > end){ scheduleNote = "Closed since " + end.toLocaleString(); scheduleLocked = true; }
  }

  const pretestLocked = scheduleLocked || pretestCount >= PRETEST_ATTEMPT_LIMIT;

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(c.teacherName||"")}</div>
      </div>
      <div class="subject-strip"><div class="subject-chip ${c.subject}">${meta.label.toUpperCase()}</div></div>
      <p class="field-label">${escapeHtml(c.className)}</p>
      <p class="fine-print" style="margin-top:-6px;">${scheduleNote}</p>

      <div class="mode-grid">
        <div class="mode-btn ${pretestLocked?'locked':''}" id="pretestBtn">
          <span class="mtitle">Pre-Test</span>
          <span class="msub">${pretestCount}/${PRETEST_ATTEMPT_LIMIT} attempts used</span>
        </div>
        <div class="mode-btn ${scheduleLocked?'locked':''}" id="posttestBtn">
          <span class="mtitle">Post-Test</span>
          <span class="msub">Unlimited attempts</span>
        </div>
      </div>

      <button class="primary-btn ghost" id="reviewBtn">Review Materials</button>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="studentHome"; route(); });
  document.getElementById("reviewBtn").addEventListener("click", ()=>{ state.screen="review"; route(); });

  document.getElementById("pretestBtn").addEventListener("click", ()=>{
    if(pretestLocked) return;
    startQuiz("pretest");
  });
  document.getElementById("posttestBtn").addEventListener("click", ()=>{
    if(scheduleLocked) return;
    startQuiz("posttest");
  });
}

/* ============================================================
   REVIEW SCREEN
   ============================================================ */
function renderReview(){
  document.body.style.background = `radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;
  const c = state.activeClass;
  const hasTeacherContent = (c.reviewerText && c.reviewerText.trim()) || (c.reviewerLink && c.reviewerLink.trim());

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Review &middot; ${SUBJECT_META[c.subject].label}</div>
      </div>
      ${hasTeacherContent ? `
        ${c.reviewerText ? `<div class="reviewer-box">${escapeHtml(c.reviewerText)}</div>` : ``}
        ${c.reviewerLink ? `<a href="${escapeHtml(c.reviewerLink)}" target="_blank" rel="noopener"><button class="primary-btn ghost" style="margin-bottom:10px;">Open Teacher's Reviewer Link</button></a>` : ``}
      ` : `
        <p class="fine-print" style="margin-bottom:10px;">Your teacher hasn't added a reviewer yet, here's a general study guide for this subject.</p>
        <div class="reviewer-box">${escapeHtml(DEFAULT_REVIEWER[c.subject])}</div>
      `}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{
    state.screen = (state.testType ? "results" : "studentClass");
    route();

/* ============================================================
   QUIZ ENGINE
   ============================================================ */
function startQuiz(testType){
  const c = state.activeClass;
  state.testType = testType;
  state.quizQueue = buildQuizQueue(c.subject, testType, c.numQuestions);
  state.qIndex = 0;
  state.answers = [];
  state.saved = false;
  state.screen = "quiz";
  route();
}

function renderQuestion(){
  clearInterval(state.timerId);
  state.locked = false;
  const c = state.activeClass;
  state.timeLeft = c.timerSeconds || 20;

  const item = state.quizQueue[state.qIndex];
  const meta = SUBJECT_META[item.subject];
  document.body.style.background = `radial-gradient(circle at 12% -10%, ${meta.soft} 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;

  const score = state.answers.filter(a=>a.correct).length;

  app.innerHTML = `
    <div class="fade-in">
      <div class="quiz-top">
        <div class="subj-pill" style="background:${meta.color}">${state.testType.toUpperCase()}</div>
        <div class="score-chip">SCORE ${String(score).padStart(2,'0')}</div>
      </div>
      <div class="track"><div class="track-seg"><i style="width:${(state.qIndex/state.quizQueue.length*100)}%;background:${meta.color}"></i></div></div>
      <div class="qhead">
        <span class="qcount">Q${state.qIndex+1} / ${state.quizQueue.length}</span>
        <div class="timer-ring">
          <svg width="40" height="40">
            <circle cx="20" cy="20" r="16" stroke="var(--border)" stroke-width="4" fill="none"/>
            <circle id="ringProgress" cx="20" cy="20" r="16" stroke="${meta.color}" stroke-width="4" fill="none"
              stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"/>
          </svg>
          <div class="tnum" id="tnum">${state.timeLeft}</div>
        </div>
      </div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <div class="choices" id="choices">
        ${item.c.map((choice,i)=>`
          <button class="choice" data-i="${i}">
            <span class="klabel">${String.fromCharCode(65+i)}</span>
            <span>${escapeHtml(choice)}</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=> lockAnswer(parseInt(btn.dataset.i)));
  });

  runTimer();
}

function runTimer(){
  const ring = document.getElementById("ringProgress");
  const tnum = document.getElementById("tnum");
  const totalTime = state.activeClass.timerSeconds || 20;
  const circumference = 100.5;
  state.timerId = setInterval(()=>{
    state.timeLeft -= 0.25;
    if(tnum) tnum.textContent = Math.max(0, Math.ceil(state.timeLeft));
    if(ring) ring.style.strokeDashoffset = circumference * (1 - state.timeLeft/totalTime);
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      if(!state.locked) lockAnswer(-1);
    }
  }, 250);
}

function lockAnswer(choiceIndex){
  if(state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);

  const item = state.quizQueue[state.qIndex];
  const isCorrect = choiceIndex === item.a;
  state.answers.push({subject:item.subject, correct:isCorrect});

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach((btn,i)=>{
    btn.classList.add("disabled");
    if(i === item.a) btn.classList.add("correct");
    if(i === choiceIndex && !isCorrect) btn.classList.add("wrong");
    if(i !== item.a && i !== choiceIndex) btn.classList.add("dim");
  });

  if(isCorrect){
    spawnFloatingPoint("+1", "var(--good)");
  } else if(choiceIndex >= 0){
    document.querySelector(".qtext").parentElement.classList.add("shake");
  }

  setTimeout(()=>{
    if(state.qIndex < state.quizQueue.length - 1){
      state.qIndex++;
      renderQuestion();
    } else {
      state.screen = "results";
      route();
    }
  }, 850);
}

function spawnFloatingPoint(text, color){
  const el = document.createElement("div");
  el.className = "float-pt";
  el.textContent = text;
  el.style.color = color;
  const rect = app.getBoundingClientRect();
  el.style.left = (rect.right - 70) + "px";
  el.style.top = (rect.top + 20) + "px";
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 800);
}

/* ============================================================
   RESULTS SCREEN
   ============================================================ */
function renderResults(){
  clearInterval(state.timerId);
  document.body.style.background = `radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper)`;

  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.correct).length;
  const pct = Math.round((correct/total)*100);

  let msg = "Keep going!";
  if(pct >= 85) msg = "Outstanding work!";
  else if(pct >= 70) msg = "Great job!";
  else if(pct >= 50) msg = "Good effort!";

  app.innerHTML = `
    <div class="fade-in">
      <div class="result-hero">
        <div class="pct">${pct}%</div>
        <div class="frac">${correct} OUT OF ${total} CORRECT &middot; ${state.testType.toUpperCase()}</div>
        <div class="msg">${msg}</div>
      </div>
      <p class="fine-print" id="saveNote">Saving your result...</p>
      <div class="btn-row">
        <button class="primary-btn ghost" id="reviewBtn">Review Materials</button>
        <button class="primary-btn ghost" id="backBtn">Back to Class</button>
      </div>
    </div>
  `;

  autoSaveResult({testType: state.testType, correct, total, pct});

  document.getElementById("reviewBtn").addEventListener("click", ()=>{ state.screen="review"; route(); });
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.testType=null; state.screen="studentClass"; route(); });
}

async function autoSaveResult({testType, correct, total, pct}){
  const note = document.getElementById("saveNote");
  if(state.saved){
    if(note) note.textContent = "Result saved, visible to your teacher.";
    return;
  }
  try{
    await db.collection("attempts").add({
      studentUid: state.authUser.uid,
      studentName: state.authUser.name,
      classId: state.activeClassId,
      testType, correct, total, pct,
      timestamp: Date.now()
    });
    state.saved = true;
    if(note) note.textContent = "Result saved, visible to your teacher.";
  }catch(err){
    if(note) note.textContent = "Couldn't save automatically, check your connection.";
    console.error(err);
  }
}

/* ============================================================
   INIT
   ============================================================ */
route();
</script>
