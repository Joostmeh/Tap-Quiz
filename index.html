<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F3F1FB; --surface:#FFFFFF; --ink:#211C4E; --ink-soft:#5A5480; --border:#DDD7F2;
    --math:#F0A202; --math-soft:#FCEACB; --science:#1B998B; --science-soft:#D6EFEA;
    --english:#E4572E; --english-soft:#FBE1D9; --accent:var(--ink); --accent-soft:#E7E3F8;
    --good:#1B998B; --bad:#E4572E; --radius:18px; --shadow:0 12px 30px -14px rgba(33,28,78,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper);
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:28px 16px 60px; transition:background 0.6s ease;
  }
  .wrap{ width:100%; max-width:560px; }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:10px; }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:clamp(22px,5.5vw,28px); font-weight:700; letter-spacing:-0.02em; margin:0; line-height:1.05; }
  .brand h1 span{ color:var(--accent); }
  .brand .tag{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.04em; text-align:right; line-height:1.4; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; }

  .navbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .navbar .who{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .navbar .who b{ color:var(--ink); }
  .nav-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--ink); border:none; border-radius:100px; padding:8px 12px; cursor:pointer; }
  .pill-btn.outline{ background:transparent; border:1.5px solid var(--border); }

  .subject-strip{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .subject-chip{ flex:1; min-width:90px; padding:10px 8px; border-radius:12px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.03em; }
  .subject-chip.math{ background:var(--math-soft); color:#7A5300; }
  .subject-chip.science{ background:var(--science-soft); color:#0E5C52; }
  .subject-chip.english{ background:var(--english-soft); color:#8E2E15; }

  .field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:0 0 8px 2px; }

  input[type="text"], input[type="email"], input[type="number"], input[type="url"], input[type="datetime-local"], select, textarea{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
    outline:none; margin-bottom:16px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea{ min-height:90px; resize:vertical; font-family:'IBM Plex Sans', sans-serif; }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .checkbox-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .checkbox-item{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--paper); }
  .checkbox-item.checked{ border-color:var(--accent); background:var(--accent-soft); }
  .checkbox-item input{ width:auto; margin:0; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .mode-btn{ cursor:pointer; border:1.5px solid var(--border); background:var(--paper); border-radius:14px; padding:16px 10px; text-align:left; transition:all .15s ease; }
  .mode-btn:hover{ border-color:var(--accent); }
  .mode-btn .mtitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; display:block; margin-bottom:4px; }
  .mode-btn .msub{ font-size:11.5px; color:var(--ink-soft); line-height:1.35; display:block; }
  .mode-btn.locked{ opacity:0.45; cursor:not-allowed; }

  .primary-btn{ width:100%; border:none; cursor:pointer; background:var(--ink); color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.01em; padding:15px 18px; border-radius:14px; transition:transform .12s ease, opacity .15s ease; margin-bottom:0; }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }
  .primary-btn.danger{ background:var(--bad); }
  .primary-btn.blitz{ background:linear-gradient(135deg, var(--math), var(--english)); }

  .fine-print{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.5; }
  .link-btn{ background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .error-note{ font-size:12.5px; color:var(--bad); margin:-8px 0 14px; }
  .success-note{ font-size:13px; color:var(--good); margin:-8px 0 14px; text-align:center; }

  .hero{ text-align:center; padding:10px 4px 24px; }
  .hero .kicker{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:10px; }
  .hero h2{ font-family:'Space Grotesk', sans-serif; font-size:24px; font-weight:700; line-height:1.25; margin:0 0 12px; }
  .hero p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 22px; }
  .feature-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:24px; text-align:left; }
  .feature-item{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-soft); }
  .feature-item b{ color:var(--ink); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }

  .portal-grid{ display:flex; flex-direction:column; gap:12px; margin-bottom:8px; }
  .portal-card{ border:1.5px solid var(--border); border-radius:16px; padding:20px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; }
  .portal-card:hover{ border-color:var(--accent); }
  .portal-card .ptitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; margin-bottom:4px; }
  .portal-card .psub{ font-size:12.5px; color:var(--ink-soft); }

  .class-card{ border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; }
  .class-card:hover{ border-color:var(--accent); }
  .class-card .ctitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .class-card .cmeta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }

  .code-display{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; letter-spacing:0.15em; background:var(--accent-soft); border-radius:12px; padding:14px; text-align:center; margin-bottom:16px; }

  .quiz-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .subj-pill{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.04em; padding:7px 12px; border-radius:100px; color:#fff; }
  .score-chip{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.03em; background:var(--ink); color:#fff; padding:7px 12px; border-radius:100px; }
  .track{ display:flex; gap:4px; margin-bottom:20px; }
  .track-seg{ flex:1; height:6px; border-radius:4px; background:var(--border); overflow:hidden; }
  .track-seg i{ display:block; height:100%; border-radius:4px; }
  .qhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .qcount{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .timer-ring{ position:relative; width:40px; height:40px; }
  .timer-ring svg{ transform:rotate(-90deg); }
  .timer-ring .tnum{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; }
  .qtext{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:600; line-height:1.35; margin:4px 0 20px; min-height:52px; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{ display:flex; align-items:center; gap:12px; text-align:left; padding:13px 14px; border-radius:13px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; font-size:14.5px; color:var(--ink); transition:all .12s ease; }
  .choice:hover{ border-color:var(--accent); }
  .choice .klabel{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px; width:22px; height:22px; border-radius:7px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .choice.correct{ background:#E4F5F1; border-color:var(--good); color:#0E5C52; }
  .choice.correct .klabel{ background:var(--good); border-color:var(--good); color:#fff; }
  .choice.wrong{ background:#FCE7E1; border-color:var(--bad); color:#8E2E15; }
  .choice.wrong .klabel{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .choice.disabled{ pointer-events:none; }
  .choice.dim{ opacity:0.45; }

  .result-hero{ text-align:center; padding:6px 0 22px; }
  .result-hero .pct{ font-family:'Space Grotesk', sans-serif; font-size:56px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .result-hero .frac{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); margin-top:8px; }
  .result-hero .msg{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600; margin-top:10px; }
  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  table.results-table{ width:100%; border-collapse:collapse; font-size:12px; }
  table.results-table th, table.results-table td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  table.results-table th{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); }
  .tag-pre{ background:var(--math-soft); color:#7A5300; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }
  .tag-post{ background:var(--science-soft); color:#0E5C52; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }
  .tag-blitz{ background:var(--english-soft); color:#8E2E15; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }

  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .reviewer-box{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; white-space:pre-wrap; font-size:14px; line-height:1.6; }

  .tab-row{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn{ flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; padding:8px 12px; border-radius:100px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink-soft); }
  .tab-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }

  .qbank-item{ border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:13px; }
  .qbank-item .qb-q{ font-weight:600; margin-bottom:6px; }
  .qbank-item .qb-c{ color:var(--ink-soft); font-size:12px; margin-bottom:2px; }
  .qbank-item .qb-c.correct{ color:var(--good); font-weight:600; }
  .qbank-item .qb-del{ margin-top:8px; }

  .review-item{ border:1.5px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  .review-item .ri-q{ font-weight:600; font-size:14px; margin-bottom:10px; }
  .review-item .ri-c{ padding:9px 12px; border-radius:10px; font-size:13px; margin-bottom:6px; background:var(--paper); }
  .review-item .ri-c.correct{ background:#E4F5F1; color:#0E5C52; font-weight:600; }
  .review-item .ri-c.wrong{ background:#FCE7E1; color:#8E2E15; font-weight:600; }

  .float-pt{ position:fixed; pointer-events:none; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; animation:floatUp .8s ease forwards; z-index:50; }
  @keyframes floatUp{ 0%{ opacity:1; transform:translateY(0);} 100%{ opacity:0; transform:translateY(-38px);} }
  .fade-in{ animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  footer.credit{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:18px; font-family:'IBM Plex Mono', monospace; }
</style>
</head>

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function genJoinCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function distributeCount(total, n){
  const base = Math.floor(total / n);
  let rem = total - base * n;
  const arr = [];
  for(let i = 0; i < n; i++) arr.push(base + (i < rem ? 1 : 0));
  return shuffle(arr);
}
function subjectLabels(subjArr){
  return (subjArr||[]).map(s=>SUBJECT_META[s] ? SUBJECT_META[s].label : s).join(", ");
}

/* Build a shuffled quiz queue across one or more subjects.
   ctx = {subjects:[...], testType:'pretest'|'posttest'|'blitz', numQuestions, classId (nullable), customPools (map subject->array or null)} */
async function buildQuizQueue(ctx){
  const subjects = ctx.subjects;
  const counts = distributeCount(ctx.numQuestions, subjects.length);
  let queue = [];
  for(let i = 0; i < subjects.length; i++){
    const subj = subjects[i];
    const count = counts[i];
    let pool;
    if(ctx.classId){
      let custom = [];
      try{
        const snap = await db.collection("customQuestions").where("classId","==",ctx.classId).where("subject","==",subj).get();
        snap.forEach(d => custom.push(d.data()));
      }catch(e){ console.error(e); }
      pool = custom.length > 0 ? custom : BANK[ctx.testType][subj];
    } else {
      // Blitz Round: combine pretest + posttest banks for a bigger pool
      pool = BANK.pretest[subj].concat(BANK.posttest[subj]);
    }
    const picked = shuffle(pool).slice(0, Math.min(count, pool.length));
    picked.forEach(item=>{
      const correctText = item.c[item.a];
      const shuffledChoices = shuffle(item.c);
      const newA = shuffledChoices.indexOf(correctText);
      queue.push({subject:subj, q:item.q, c:shuffledChoices, a:newA});
    });
  }
  return shuffle(queue);
}

auth.onAuthStateChanged(async (user) => {
  if(user){
    try{
      const doc = await db.collection("users").doc(user.uid).get();
      if(doc.exists){
        state.authUser = {uid:user.uid, email:user.email, ...doc.data()};
        state.screen = state.authUser.role === "teacher" ? "teacherHome" : "studentHome";
        route();
      }
    }catch(e){ console.error(e); }
  } else {
    state.authUser = null;
    const protectedScreens = ["teacherHome","classEditor","teacherResults","teacherActivity","manageQuestions",
      "studentHome","studentClass","review","blitzSetup","quiz","results","answerReview","myProgress"];
    if(protectedScreens.includes(state.screen)) state.screen = "landing";
    route();
  }
});

function route(){
  clearInterval(state.timerId);
  const r = {
    landing: renderLanding, portalAuth: renderPortalAuth,
    teacherHome: renderTeacherHome, classEditor: renderClassEditor, teacherResults: renderTeacherResults,
    teacherActivity: renderTeacherActivity, manageQuestions: renderManageQuestions,

    blitzSetup: renderBlitzSetup, quiz: renderQuestion, results: renderResults, answerReview: renderAnswerReview,
    myProgress: renderMyProgress
  };
  (r[state.screen] || renderLanding)();
}

/* ============================================================
   STUDENT: CLASS VIEW
   ============================================================ */
async function renderStudentClass(){
  bg();
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading...</p></div>`;
  const c = state.activeClass;

  db.collection("classViews").add({
    studentUid: state.authUser.uid, studentName: state.authUser.name,
    classId: state.activeClassId, timestamp: Date.now()
  }).catch(e=>console.error(e));

  const preLimit = c.pretestAttemptLimit || DEFAULT_ATTEMPT_LIMIT;
  const postLimit = c.posttestAttemptLimit || DEFAULT_ATTEMPT_LIMIT;

  let preCount = 0, postCount = 0;
  try{
    const preSnap = await db.collection("attempts").where("classId","==",state.activeClassId).where("studentUid","==",state.authUser.uid).where("testType","==","pretest").get();
    preCount = preSnap.size;
    const postSnap = await db.collection("attempts").where("classId","==",state.activeClassId).where("studentUid","==",state.authUser.uid).where("testType","==","posttest").get();
    postCount = postSnap.size;
  }catch(e){ console.error(e); }

  const now = new Date();
  let scheduleNote = "Open anytime";
  let scheduleLocked = false;
  if(c.scheduleStart){
    const start = new Date(c.scheduleStart);
    if(now < start){ scheduleNote = "Opens " + start.toLocaleString(); scheduleLocked = true; }
  }
  if(!scheduleLocked && c.scheduleEnd){
    const end = new Date(c.scheduleEnd);
    if(now > end){ scheduleNote = "Closed since " + end.toLocaleString(); scheduleLocked = true; }
  }
  const preLocked = scheduleLocked || preCount >= preLimit;
  const postLocked = scheduleLocked || postCount >= postLimit;
  const hasTeacherReviewer = (c.reviewerText && c.reviewerText.trim()) || (c.reviewerLink && c.reviewerLink.trim());

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(c.teacherName||"")}</div>
      </div>
      <div class="subject-strip">${c.subjects.map(s=>`<div class="subject-chip ${s}">${SUBJECT_META[s].label.toUpperCase()}</div>`).join("")}</div>
      <p class="field-label">${escapeHtml(c.className)}</p>
      <p class="fine-print" style="margin-top:-6px;">${scheduleNote}</p>

      <div class="mode-grid">
        <div class="mode-btn ${preLocked?'locked':''}" id="pretestBtn">
          <span class="mtitle">Pre-Test</span>
          <span class="msub">${preCount}/${preLimit} attempts used</span>
        </div>
        <div class="mode-btn ${postLocked?'locked':''}" id="posttestBtn">
          <span class="mtitle">Post-Test</span>
          <span class="msub">${postCount}/${postLimit} attempts used</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="primary-btn ghost" id="ourReviewBtn">📖 Our Reviewer</button>
        <button class="primary-btn ghost" id="teacherReviewBtn" ${!hasTeacherReviewer?'disabled':''}>🧑‍🏫 Teacher's Reviewer${!hasTeacherReviewer?' (not added yet)':''}</button>
      </div>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="studentHome"; route(); });
  document.getElementById("ourReviewBtn").addEventListener("click", ()=>{ openReviewer("default"); });
  document.getElementById("teacherReviewBtn").addEventListener("click", ()=>{ if(hasTeacherReviewer) openReviewer("teacher"); });
  document.getElementById("pretestBtn").addEventListener("click", ()=>{ if(!preLocked) startClassQuiz("pretest"); });
  document.getElementById("posttestBtn").addEventListener("click", ()=>{ if(!postLocked) startClassQuiz("posttest"); });
}

function openReviewer(type){
  state.reviewerType = type;
  db.collection("reviewerViews").add({
    studentUid: state.authUser.uid, studentName: state.authUser.name,
    classId: state.activeClassId, reviewerType: type, timestamp: Date.now()
  }).catch(e=>console.error(e));
  state.screen = "review"; route();
}

/* ============================================================
   REVIEW SCREEN
   ============================================================ */
function renderReview(){
  bg();
  const c = state.activeClass;
  const type = state.reviewerType;

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${type==='teacher' ? "Teacher's Reviewer" : "Our Reviewer"}</div>
      </div>
      ${type === "teacher" ? `
        ${c.reviewerText ? `<div class="reviewer-box">${escapeHtml(c.reviewerText)}</div>` : ``}
        ${c.reviewerLink ? `<a href="${escapeHtml(c.reviewerLink)}" target="_blank" rel="noopener"><button class="primary-btn ghost" style="margin-bottom:10px;">Open Teacher's Reviewer Link</button></a>` : ``}
      ` : `
        <div class="tab-row">
          ${c.subjects.map(s=>`<span class="subject-chip ${s}">${SUBJECT_META[s].label.toUpperCase()}</span>`).join("")}
        </div>
        ${c.subjects.map(s=>`<div class="reviewer-box">${escapeHtml(DEFAULT_REVIEWER[s])}</div>`).join("")}
      `}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{
    state.screen = (state.testType ? "results" : "studentClass");
    route();
  });
}

/* ============================================================
   STUDENT: BLITZ ROUND SETUP
   ============================================================ */
function renderBlitzSetup(){
  bg();
  const sel = state.blitzSubjects;
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">⚡ Blitz Round</div>
      </div>
      <p class="fine-print" style="margin-top:0; margin-bottom:14px;">A quick ${BLITZ_QUESTIONS}-question practice round, ${BLITZ_TIMER} seconds per question. Pick your subject(s):</p>
      <div class="checkbox-row" id="blitzChecks">
        ${ORDER.map(s=>`
          <label class="checkbox-item ${sel.includes(s)?'checked':''}" data-subj="${s}">
            <input type="checkbox" value="${s}" ${sel.includes(s)?'checked':''}>
            <span>${SUBJECT_META[s].label}</span>
          </label>
        `).join("")}
      </div>
      ${state.blitzError ? `<p class="error-note">${escapeHtml(state.blitzError)}</p>` : ``}
      <button class="primary-btn blitz" id="startBlitzBtn">Start Blitz Round</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="studentHome"; route(); });
  document.querySelectorAll("#blitzChecks .checkbox-item").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      const v = el.dataset.subj;
      const idx = state.blitzSubjects.indexOf(v);
      if(idx >= 0) state.blitzSubjects.splice(idx,1); else state.blitzSubjects.push(v);
      renderBlitzSetup();
    });
  });
  document.getElementById("startBlitzBtn").addEventListener("click", ()=>{
    if(state.blitzSubjects.length === 0){ state.blitzError = "Pick at least one subject."; renderBlitzSetup(); return; }
    state.blitzError = "";
    startBlitzQuiz();
  });
}

/* ============================================================
   QUIZ ENGINE (shared by class tests + Blitz Round)
   ============================================================ */
async function startClassQuiz(testType){
  const c = state.activeClass;
  state.testType = testType;
  state.timerSecondsForQuiz = c.timerSeconds || 20;
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Preparing your test...</p></div>`;
  state.quizQueue = await buildQuizQueue({subjects:c.subjects, testType, numQuestions:c.numQuestions, classId:state.activeClassId});
  state.qIndex = 0; state.answers = []; state.saved = false;
  state.screen = "quiz"; route();
}
async function startBlitzQuiz(){
  state.testType = "blitz";
  state.timerSecondsForQuiz = BLITZ_TIMER;
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Shuffling questions...</p></div>`;
  state.quizQueue = await buildQuizQueue({subjects:state.blitzSubjects, testType:"blitz", numQuestions:BLITZ_QUESTIONS, classId:null});
  state.qIndex = 0; state.answers = []; state.saved = false;
  state.screen = "quiz"; route();
}

function renderQuestion(){
  clearInterval(state.timerId);
  state.locked = false;
  state.timeLeft = state.timerSecondsForQuiz;

  const item = state.quizQueue[state.qIndex];
  const meta = SUBJECT_META[item.subject];
  bg(meta.soft);

  const score = state.answers.filter(a=>a.correct).length;

  app.innerHTML = `
    <div class="fade-in">
      <div class="quiz-top">
        <div class="subj-pill" style="background:${meta.color}">${state.testType.toUpperCase()}</div>
        <div class="score-chip">SCORE ${String(score).padStart(2,'0')}</div>
      </div>
      <div class="track"><div class="track-seg"><i style="width:${(state.qIndex/state.quizQueue.length*100)}%;background:${meta.color}"></i></div></div>
      <div class="qhead">
        <span class="qcount">Q${state.qIndex+1} / ${state.quizQueue.length} &middot; ${meta.label}</span>
        <div class="timer-ring">
          <svg width="40" height="40">
            <circle cx="20" cy="20" r="16" stroke="var(--border)" stroke-width="4" fill="none"/>
            <circle id="ringProgress" cx="20" cy="20" r="16" stroke="${meta.color}" stroke-width="4" fill="none"
              stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"/>
          </svg>
          <div class="tnum" id="tnum">${state.timeLeft}</div>
        </div>
      </div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <div class="choices" id="choices">
        ${item.c.map((choice,i)=>`
          <button class="choice" data-i="${i}">
            <span class="klabel">${String.fromCharCode(65+i)}</span>
            <span>${escapeHtml(choice)}</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=> lockAnswer(parseInt(btn.dataset.i)));
  });
  runTimer();
}

function runTimer(){
  const ring = document.getElementById("ringProgress");
  const tnum = document.getElementById("tnum");
  const totalTime = state.timerSecondsForQuiz;
  const circumference = 100.5;
  state.timerId = setInterval(()=>{
    state.timeLeft -= 0.25;
    if(tnum) tnum.textContent = Math.max(0, Math.ceil(state.timeLeft));
    if(ring) ring.style.strokeDashoffset = circumference * (1 - state.timeLeft/totalTime);
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      if(!state.locked) lockAnswer(-1);
    }
  }, 250);
}

function lockAnswer(choiceIndex){
  if(state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);

  const item = state.quizQueue[state.qIndex];
  const isCorrect = choiceIndex === item.a;
  state.answers.push({
    subject:item.subject, q:item.q, choices:item.c,
    correctIndex:item.a, selectedIndex:choiceIndex, correct:isCorrect
  });

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach((btn,i)=>{
    btn.classList.add("disabled");
    if(i === item.a) btn.classList.add("correct");
    if(i === choiceIndex && !isCorrect) btn.classList.add("wrong");
    if(i !== item.a && i !== choiceIndex) btn.classList.add("dim");
  });

  if(isCorrect){ spawnFloatingPoint("+1", "var(--good)"); }
  else if(choiceIndex >= 0){ document.querySelector(".qtext").parentElement.classList.add("shake"); }

  setTimeout(()=>{
    if(state.qIndex < state.quizQueue.length - 1){
      state.qIndex++; renderQuestion();
    } else {
      state.screen = "results"; route();
    }
  }, 850);
}

function spawnFloatingPoint(text, color){
  const el = document.createElement("div");
  el.className = "float-pt"; el.textContent = text; el.style.color = color;
  const rect = app.getBoundingClientRect();
  el.style.left = (rect.right - 70) + "px"; el.style.top = (rect.top + 20) + "px";
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 800);
}

/* ============================================================
   RESULTS SCREEN
   ============================================================ */
function renderResults(){
  clearInterval(state.timerId);
  bg();
  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.correct).length;
  const pct = Math.round((correct/total)*100);
  const isClassTest = state.testType === "pretest" || state.testType === "posttest";
  const hasTeacherReviewer = isClassTest && state.activeClass && ((state.activeClass.reviewerText && state.activeClass.reviewerText.trim()) || (state.activeClass.reviewerLink && state.activeClass.reviewerLink.trim()));

  let msg = "Keep going!";
  if(pct >= 85) msg = "Outstanding work!";
  else if(pct >= 70) msg = "Great job!";
  else if(pct >= 50) msg = "Good effort!";

  app.innerHTML = `
    <div class="fade-in">
      <div class="result-hero">
        <div class="pct">${pct}%</div>
        <div class="frac">${correct} OUT OF ${total} CORRECT &middot; ${state.testType.toUpperCase()}</div>
        <div class="msg">${msg}</div>
      </div>
      <p class="fine-print" id="saveNote">Saving your result...</p>
      <div class="btn-row">
        <button class="primary-btn ghost" id="answersBtn">📝 View My Answers</button>
        ${isClassTest ? `<button class="primary-btn ghost" id="ourReviewBtn">📖 Our Reviewer</button>` : ``}
        ${isClassTest ? `<button class="primary-btn ghost" id="teacherReviewBtn" ${!hasTeacherReviewer?'disabled':''}>🧑‍🏫 Teacher's Reviewer${!hasTeacherReviewer?' (not added yet)':''}</button>` : ``}
        <button class="primary-btn ghost" id="backBtn">${isClassTest ? "Back to Class" : "Back to Home"}</button>
      </div>
    </div>
  `;

  autoSaveResult({testType: state.testType, correct, total, pct});

  document.getElementById("answersBtn").addEventListener("click", ()=>{ state.screen="answerReview"; route(); });
  if(isClassTest){
    document.getElementById("ourReviewBtn").addEventListener("click", ()=>{ openReviewer("default"); });
    document.getElementById("teacherReviewBtn").addEventListener("click", ()=>{ if(hasTeacherReviewer) openReviewer("teacher"); });
  }
  document.getElementById("backBtn").addEventListener("click", ()=>{
    if(isClassTest){ state.testType=null; state.screen="studentClass"; }
    else { state.testType=null; state.blitzSubjects=[]; state.screen="studentHome"; }
    route();
  });
}

async function autoSaveResult({testType, correct, total, pct}){
  const note = document.getElementById("saveNote");
  if(state.saved){ if(note) note.textContent = "Result saved."; return; }
  try{
    const subjectsCovered = [...new Set(state.answers.map(a=>a.subject))];
    const subjectBreakdown = subjectsCovered.map(s=>({
      subject:s,
      correct: state.answers.filter(a=>a.subject===s && a.correct).length,
      total: state.answers.filter(a=>a.subject===s).length
    }));
    await db.collection("attempts").add({
      studentUid: state.authUser.uid, studentName: state.authUser.name,
      classId: state.activeClassId || null,
      testType, subjects: subjectsCovered, subjectBreakdown,
      correct, total, pct, timestamp: Date.now()
    });
    state.saved = true;
    if(note) note.textContent = testType==="pretest"||testType==="posttest" ? "Result saved, visible to your teacher." : "Result saved to your progress history.";
  }catch(err){
    if(note) note.textContent = "Couldn't save automatically, check your connection.";
    console.error(err);
  }
}

/* ============================================================
   ANSWER REVIEW (after taking a test)
   ============================================================ */
function renderAnswerReview(){
  bg();
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Your Answers</div>
      </div>
      ${state.answers.map((a,i)=>`
        <div class="review-item">
          <div class="ri-q">Q${i+1}. ${escapeHtml(a.q)}</div>
          ${a.choices.map((ch,ci)=>{
            let cls = "";
            if(ci === a.correctIndex) cls = "correct";
            else if(ci === a.selectedIndex) cls = "wrong";
            return `<div class="ri-c ${cls}">${String.fromCharCode(65+ci)}. ${escapeHtml(ch)}${ci===a.correctIndex?' ✓':''}${ci===a.selectedIndex && ci!==a.correctIndex?' ✗ (your answer)':''}</div>`;
          }).join("")}
        </div>
      `).join("")}
      <button class="primary-btn ghost" id="backBtn2" style="margin-top:6px;">Back to Results</button>
    </div>
  `;
  const goBack = ()=>{ state.screen="results"; route(); };
  document.getElementById("backBtn").addEventListener("click", goBack);
  document.getElementById("backBtn2").addEventListener("click", goBack);
}

/* ============================================================
   STUDENT: MY PROGRESS
   ============================================================ */
async function renderMyProgress(){
  bg();
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading your history...</p></div>`;
  let rows = [];
  try{
    const snap = await db.collection("attempts").where("studentUid","==",state.authUser.uid).get();
    snap.forEach(d => rows.push(d.data()));
    rows.sort((a,b)=> b.timestamp - a.timestamp);
  }catch(e){ console.error(e); }

  const tableRows = rows.map(r=>{
    const tag = r.testType==="pretest" ? `<span class="tag-pre">PRE</span>` : r.testType==="posttest" ? `<span class="tag-post">POST</span>` : `<span class="tag-blitz">BLITZ</span>`;
    return `<tr><td>${tag}</td><td>${subjectLabels(r.subjects)}</td><td>${r.correct}/${r.total}</td><td>${r.pct}%</td><td>${fmtDate(r.timestamp)}</td></tr>`;
  }).join("");

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">My Progress</div>
      </div>
      ${rows.length === 0 ? `<p class="empty-note">No attempts yet, take a test or try Blitz Round.</p>` : `
        <div style="overflow-x:auto;">
          <table class="results-table">
            <thead><tr><th>Test</th><th>Subject(s)</th><th>Score</th><th>%</th><th>Date</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      `}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="studentHome"; route(); });
}

/* ============================================================
   INIT
   ============================================================ */
route();
</script>
