<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap-Quiz for Teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F3F1FB; --surface:#FFFFFF; --ink:#211C4E; --ink-soft:#5A5480; --border:#DDD7F2;
    --math:#F0A202; --math-soft:#FCEACB; --science:#1B998B; --science-soft:#D6EFEA;
    --english:#E4572E; --english-soft:#FBE1D9; --accent:var(--ink); --accent-soft:#E7E3F8;
    --good:#1B998B; --bad:#E4572E; --radius:18px; --shadow:0 12px 30px -14px rgba(33,28,78,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper);
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:28px 16px 60px;
  }
  .wrap{ width:100%; max-width:560px; }
  .brand{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .brand .logo-row{ display:flex; align-items:center; gap:10px; }
  .brand .logo{ width:46px; height:46px; border-radius:12px; box-shadow:var(--shadow); flex-shrink:0; object-fit:cover; }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:clamp(19px,5vw,24px); font-weight:700; letter-spacing:-0.02em; margin:0; line-height:1.05; }
  .brand h1 span{ color:var(--english); }
  .brand .tag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:0.03em; text-align:right; line-height:1.4; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; min-height:120px; }

  .navbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .navbar .who{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .navbar .who b{ color:var(--ink); }
  .pill-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--ink); border:none; border-radius:100px; padding:8px 12px; cursor:pointer; }
  .pill-btn.outline{ background:transparent; border:1.5px solid var(--border); }

  .field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:0 0 8px 2px; }

  input[type="text"], input[type="email"], input[type="number"], input[type="datetime-local"], textarea, select{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
    outline:none; margin-bottom:16px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  textarea{ min-height:110px; resize:vertical; font-family:'IBM Plex Mono', monospace; font-size:12.5px; line-height:1.5; }

  .checkbox-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .checkbox-item, .radio-item{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--paper); }
  .checkbox-item.checked, .radio-item.checked{ border-color:var(--accent); background:var(--accent-soft); }
  .checkbox-item input, .radio-item input{ width:auto; margin:0; }
  .radio-item.disabled{ opacity:0.6; cursor:not-allowed; }

  .primary-btn{ width:100%; border:none; cursor:pointer; background:var(--ink); color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.01em; padding:15px 18px; border-radius:14px; transition:transform .12s ease, opacity .15s ease; }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .primary-btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }

  .fine-print{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.5; }
  .error-note{ font-size:12.5px; color:var(--bad); margin:-8px 0 14px; }
  .save-note{ font-size:12.5px; color:var(--good); margin:-8px 0 14px; }

  .hero{ text-align:center; padding:6px 4px 20px; }
  .hero .kicker{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:10px; }
  .hero h2{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; line-height:1.25; margin:0 0 12px; }
  .hero p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 20px; }
  .feature-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; text-align:left; }
  .feature-item{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-soft); }
  .feature-item b{ color:var(--ink); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }

  .home-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .home-card{ border:1.5px solid var(--border); border-radius:16px; padding:18px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; display:flex; align-items:center; gap:14px; }
  .home-card:hover{ border-color:var(--accent); }
  .home-card .hicon{ font-size:22px; }
  .home-card .htitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:2px; }
  .home-card .hsub{ font-size:12px; color:var(--ink-soft); }

  .subject-chip{ display:inline-block; padding:4px 10px; border-radius:100px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; margin:0 6px 6px 0; }
  .subject-chip.math{ background:var(--math-soft); color:#7A5300; }
  .subject-chip.science{ background:var(--science-soft); color:#0E5C52; }
  .subject-chip.english{ background:var(--english-soft); color:#8E2E15; }

  .class-card{ border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; }
  .class-card:hover{ border-color:var(--accent); }
  .class-card .ctitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:6px; }
  .class-card .cmeta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin-top:6px; }

  .code-box{ text-align:center; padding:22px 10px; border-radius:16px; background:var(--accent-soft); margin-bottom:18px; }
  .code-box .clabel{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:8px; }
  .code-box .ccode{ font-family:'Space Grotesk', sans-serif; font-size:34px; font-weight:700; letter-spacing:0.08em; }

  table.roster-table{ width:100%; border-collapse:collapse; font-size:12px; }
  table.roster-table th, table.roster-table td{ text-align:left; padding:9px 6px; border-bottom:1px solid var(--border); }
  table.roster-table th{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); }

  .tab-row{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn{ flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; padding:8px 12px; border-radius:100px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink-soft); }
  .tab-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }

  .qb-item{ border:1.5px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--paper); }
  .qb-item .qbi-text{ font-weight:600; font-size:13px; margin-bottom:6px; }
  .qb-item .qbi-c{ font-size:12px; color:var(--ink-soft); margin-bottom:2px; }
  .qb-item .qbi-c.correct{ color:var(--good); font-weight:600; }
  .small-del{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; background:transparent; border:1.5px solid var(--bad); color:var(--bad); border-radius:8px; padding:5px 9px; cursor:pointer; margin-top:8px; }

  .activity-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 6px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .activity-row .a-name{ font-weight:600; }
  .activity-row .a-time{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }

  .skeleton{ border-radius:10px; background:linear-gradient(90deg, var(--border) 25%, var(--paper) 50%, var(--border) 75%); background-size:200% 100%; animation:shimmer 1.3s infinite; }
  @keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .skeleton-row{ height:38px; margin-bottom:8px; }

  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .fade-in{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  footer.credit{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:18px; font-family:'IBM Plex Mono', monospace; }
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBfU_gAw9MF-Aba-Brabcd9zYX8I9YdAuo",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const SUBJECT_META = {
  math:    {label:"General Mathematics",      color:"var(--math)",    soft:"var(--math-soft)",    cls:"math"},
  science: {label:"General Science",          color:"var(--science)", soft:"var(--science-soft)", cls:"science"},
  english: {label:"Effective Communication",  color:"var(--english)", soft:"var(--english-soft)", cls:"english"}
};
const ORDER = ["math","science","english"];
const MAX_QUESTIONS = 20;

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function genJoinCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function toEpoch(dtLocalStr){
  if(!dtLocalStr) return null;
  const t = new Date(dtLocalStr).getTime();
  return isNaN(t) ? null : t;
}
function fromEpoch(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function getTeacher(){
  try{
    const raw = window.localStorage.getItem("tq_teacher");
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setTeacher(t){ window.localStorage.setItem("tq_teacher", JSON.stringify(t)); }

function defaultAssignmentDraft(classSubjects){
  const subs = (classSubjects && classSubjects.length) ? classSubjects.slice() : ["math"];
  return {
    subjects: subs,
    numQuestions: 20,
    timerSeconds: 20,
    maxAttempts: 1,
    scheduleStart: "",
    scheduleEnd: "",
    questionSource: "preset",
    customQuestions: {
      pretest:  {math:[], science:[], english:[]},
      posttest: {math:[], science:[], english:[]}
    },
    customReviewer: {math:"", science:"", english:""},
    qbTestType: "pretest",
    qbForm: {subject: subs[0], q:"", c0:"", c1:"", c2:"", c3:"", correct:0, scenario:false}
  };
}

let state = {
  screen: "intro",
  teacher: getTeacher(),
  myClasses: null,
  classCache: {},
  activityCache: {},
  activeClassId: null,
  newClassName: "",
  newClassSubjects: [],
  createError: "",
  getStartedError: "",
  assignmentDraft: null,
  assignmentLoaded: false,
  assignmentSaveNote: "",
  activityTab: "attempts"
};

const app = document.getElementById("app");

function route(){
  const r = {
    intro: renderIntro, getStarted: renderGetStarted, home: renderHome,
    createClass: renderCreateClass, myClasses: renderMyClasses,
    classDetail: renderClassDetail, manageTest: renderManageTest,
    classActivity: renderClassActivity
  };
  (r[state.screen] || renderIntro)();
}

function renderIntro(){
  app.innerHTML = `
    <div class="fade-in">
      <div class="hero">
        <div class="kicker">STRENGTHENED SHS CURRICULUM &middot; GRADE 11</div>
        <h2>Welcome to Tap-Quiz for Teachers.</h2>
        <p>A quick tour before you dive in — here's what you can do:</p>
      </div>
      <div class="feature-list">
        <div class="feature-item"><span class="dot"></span><span><b>Create a class:</b> pick a name and one subject, and get a join code students can enter from their own app.</span></div>
        <div class="feature-item"><span class="dot"></span><span><b>Configure the test:</b> set how many questions, the timer, attempt limits, an optional schedule window, and whether to use the preset bank or your own questions.</span></div>
        <div class="feature-item"><span class="dot"></span><span><b>Track activity:</b> see who joined, who opened the class, who opened the reviewer, and every attempt broken down by subject.</span></div>
      </div>
      <button class="primary-btn" id="continueBtn">Continue</button>
    </div>
  `;
  document.getElementById("continueBtn").addEventListener("click", ()=>{
    state.screen = state.teacher ? "home" : "getStarted";
    route();
  });
}

function renderGetStarted(){
  app.innerHTML = `
    <div class="fade-in">
      <p class="field-label">Let's get you set up</p>
      <input type="text" id="nameInput" placeholder="Full name">
      <input type="email" id="emailInput" placeholder="Email address">
      ${state.getStartedError ? `<p class="error-note">${escapeHtml(state.getStartedError)}</p>` : ``}
      <button class="primary-btn" id="goBtn">Start Using Tap-Quiz</button>
      <p class="fine-print">Just your name and email, no password, no confirmation link. This is how your classes are labeled and saved.</p>
    </div>
  `;
  document.getElementById("goBtn").addEventListener("click", ()=>{
    const name = document.getElementById("nameInput").value.trim();
    const email = document.getElementById("emailInput").value.trim();
    if(!name || !email || !email.includes("@")){
      state.getStartedError = "Please enter your name and a valid email.";
      renderGetStarted();
      return;
    }
    state.getStartedError = "";
    const teacher = {name, email: email.toLowerCase()};
    setTeacher(teacher);
    state.teacher = teacher;
    state.screen = "home";
    route();
  });
}

function renderHome(){
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <div class="who">Hi, <b>${escapeHtml(state.teacher.name.split(" ")[0])}</b></div>
        <button class="pill-btn outline" id="switchBtn">Switch account</button>
      </div>
      <div class="home-grid">
        <div class="home-card" id="createCard">
          <div class="hicon">➕</div>
          <div><div class="htitle">Create a Class</div><div class="hsub">Pick a name and one subject, get a join code</div></div>
        </div>
        <div class="home-card" id="classesCard">
          <div class="hicon">🏫</div>
          <div><div class="htitle">My Classes</div><div class="hsub">Manage tests, rosters, and activity</div></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("switchBtn").addEventListener("click", ()=>{
    window.localStorage.removeItem("tq_teacher");
    state.teacher = null; state.myClasses = null; state.classCache = {};
    state.screen = "getStarted"; route();
  });
  document.getElementById("createCard").addEventListener("click", ()=>{
    state.newClassName=""; state.newClassSubjects=[]; state.createError="";
    state.screen="createClass"; route();
  });
  document.getElementById("classesCard").addEventListener("click", ()=>{ state.screen="myClasses"; route(); });
}

  app.innerHTML = `

      </div>

        `).join("")}
      </div>
      ${state.createError ? `<p class="error-note">${escapeHtml(state.createError)}</p>` : ``}
      <button class="primary-btn" id="createBtn">Create Class</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
  document.querySelectorAll("#subjChecks .checkbox-item").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      const v = el.dataset.subj;
      const idx = state.newClassSubjects.indexOf(v);
      if(idx >= 0) state.newClassSubjects.splice(idx,1); else state.newClassSubjects.push(v);
      state.newClassName = document.getElementById("classNameInput").value;
      renderCreateClass();
    });
  });
  document.getElementById("createBtn").addEventListener("click", async ()=>{
    const className = document.getElementById("classNameInput").value.trim();
    if(!className){ state.createError = "Please name your class."; renderCreateClass(); return; }
    if(state.newClassSubjects.length === 0){ state.createError = "Pick at least one subject."; renderCreateClass(); return; }
    state.createError = "";
    const btn = document.getElementById("createBtn");
    btn.disabled = true; btn.textContent = "Creating...";
    try{
      const joinCode = genJoinCode();
      const docRef = await db.collection("classes").add({
        className, subjects: state.newClassSubjects,
        joinCode, teacherName: state.teacher.name, teacherEmail: state.teacher.email,
        createdAt: Date.now()
      });
      state.myClasses = null;
      state.activeClassId = docRef.id;
      state.classCache[docRef.id] = {
        classDoc: {id: docRef.id, className, subjects: state.newClassSubjects, joinCode, teacherName: state.teacher.name, teacherEmail: state.teacher.email},
        roster: null
      };
      state.screen = "classDetail";
      route();
    }catch(err){
      state.createError = "Couldn't create the class, check your connection.";
      console.error(err);
      renderCreateClass();
    }
  });
}

        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>

      if(!state.classCache[id]) state.classCache[id] = {classDoc: c, roster: null};

async function renderClassDetail(){
  const id = state.activeClassId;
  const cached = state.classCache[id];
  const c = cached.classDoc;

  if(cached.roster === null){
    app.innerHTML = `
      <div class="fade-in">
        <div class="navbar"><button class="pill-btn outline" id="backBtn">Back</button><div class="who">${escapeHtml(c.className)}</div></div>
        <div class="code-box">
          <div class="clabel">JOIN CODE</div>
          <div class="ccode">${escapeHtml(c.joinCode)}</div>
        </div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="myClasses"; route(); });
    try{
      const [enrollSnap, attemptSnap] = await Promise.all([
        db.collection("enrollments").where("classId","==",id).get(),
        db.collection("attempts").where("classId","==",id).get()
      ]);
      const students = new Map();
      enrollSnap.forEach(d=>{
        const v = d.data();
        if(!students.has(v.studentEmail)) students.set(v.studentEmail, {name:v.studentName, email:v.studentEmail, pre:0, post:0, scores:[]});
      });
      attemptSnap.forEach(d=>{
        const v = d.data();
        if(!students.has(v.studentEmail)) students.set(v.studentEmail, {name:v.studentName, email:v.studentEmail, pre:0, post:0, scores:[]});
        const s = students.get(v.studentEmail);
        if(v.testType === "pretest") s.pre++; else if(v.testType === "posttest") s.post++;
        if(typeof v.pct === "number") s.scores.push(v.pct);
      });
      cached.roster = Array.from(students.values()).sort((a,b)=> a.name.localeCompare(b.name));
    }catch(e){
      console.error(e);
      cached.roster = [];
    }
  }

  const roster = cached.roster;
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(c.className)}</div>
      </div>
      <div class="code-box">
        <div class="clabel">JOIN CODE &middot; SHARE WITH STUDENTS</div>
        <div class="ccode">${escapeHtml(c.joinCode)}</div>
      </div>
      <div style="margin-bottom:14px;">${(c.subjects||[]).map(s=>`<span class="subject-chip ${SUBJECT_META[s].cls}">${SUBJECT_META[s].label.toUpperCase()}</span>`).join("")}</div>
      ${roster.length === 0 ? `<p class="empty-note">No students yet. Share the join code above — once someone joins, they'll show up here.</p>` : `
        <div style="overflow-x:auto;">
          <table class="roster-table">
            <thead><tr><th>Student</th><th>Pre</th><th>Post</th><th>Avg %</th></tr></thead>
            <tbody>
              ${roster.map(s=>{
                const avg = s.scores.length ? Math.round(s.scores.reduce((a,b)=>a+b,0)/s.scores.length) : "—";
                return `<tr><td>${escapeHtml(s.name)}</td><td>${s.pre}</td><td>${s.post}</td><td>${avg}${s.scores.length?'%':''}</td></tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      `}
      <button class="primary-btn ghost" id="manageTestBtn" style="margin-top:14px;">🛠️ Manage Test Settings</button>
      <button class="primary-btn ghost" id="activityBtn" style="margin-top:10px;">👀 Class Activity</button>
      <button class="pill-btn outline" id="refreshBtn" style="margin-top:10px;">Refresh roster</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="myClasses"; route(); });
  document.getElementById("refreshBtn").addEventListener("click", ()=>{
    cached.roster = null;
    renderClassDetail();
  });
  document.getElementById("manageTestBtn").addEventListener("click", ()=>{
    state.assignmentLoaded = false; state.assignmentSaveNote = "";
    state.screen = "manageTest"; route();
  });
  document.getElementById("activityBtn").addEventListener("click", ()=>{
    state.activityTab = "attempts";
    state.screen = "classActivity"; route();
  });
}

async function renderManageTest(){
  const id = state.activeClassId;
  const c = state.classCache[id].classDoc;
  const classSubjects = (c.subjects && c.subjects.length) ? c.subjects : ["math"];
  const primarySubject = classSubjects[0];

  if(!state.assignmentLoaded){
    app.innerHTML = `
      <div class="fade-in">
        <div class="navbar"><button class="pill-btn outline" id="backBtn">Back</button><div class="who">Manage Test</div></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="classDetail"; route(); });
    try{
      const doc = await db.collection("assignments").doc(id).get();
      if(doc.exists){
        const d = doc.data();
        state.assignmentDraft = {
          subjects: d.subjects || classSubjects.slice(),
          numQuestions: d.numQuestions || 20,
          timerSeconds: d.timerSeconds || 20,
          maxAttempts: d.maxAttempts || 1,
          scheduleStart: fromEpoch(d.scheduleStart),
          scheduleEnd: fromEpoch(d.scheduleEnd),
          questionSource: d.questionSource || "preset",
          customQuestions: d.customQuestions || {pretest:{math:[],science:[],english:[]}, posttest:{math:[],science:[],english:[]}},
          customReviewer: d.customReviewer || {math:"",science:"",english:""},
          qbTestType: "pretest",
          qbForm: {subject: primarySubject, q:"", c0:"", c1:"", c2:"", c3:"", correct:0, scenario:false}
        };
      } else {
        state.assignmentDraft = defaultAssignmentDraft(classSubjects);
      }
    }catch(e){
      console.error(e);
      state.assignmentDraft = defaultAssignmentDraft(classSubjects);
    }
    state.assignmentLoaded = true;
  }

  const draft = state.assignmentDraft;
  const otherSubjects = ORDER.filter(s => !classSubjects.includes(s));

  const qList = (draft.customQuestions[draft.qbTestType] && draft.customQuestions[draft.qbTestType][draft.qbForm.subject]) || [];

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Manage Test &middot; ${escapeHtml(c.className)}</div>
      </div>

      <p class="field-label">Subjects covered by this test</p>
      <div class="checkbox-row">
        ${classSubjects.map(s=>`
          <label class="radio-item checked disabled">
            <input type="checkbox" checked disabled>
            <span>${SUBJECT_META[s].label} (class subject)</span>
          </label>
        `).join("")}
        ${otherSubjects.map(s=>`
          <label class="checkbox-item ${draft.subjects.includes(s)?'checked':''}" data-subj="${s}">
            <input type="checkbox" ${draft.subjects.includes(s)?'checked':''}>
            <span>Also include ${SUBJECT_META[s].label}</span>
          </label>
        `).join("")}
      </div>

      <p class="field-label">Number of questions (max ${MAX_QUESTIONS})</p>
      <input type="number" id="numQInput" min="1" max="${MAX_QUESTIONS}" value="${draft.numQuestions}">

      <p class="field-label">Timer per question (seconds)</p>
      <input type="number" id="timerInput" min="5" max="120" value="${draft.timerSeconds}">

      <p class="field-label">Max attempts per test (pre-test and post-test each)</p>
      <input type="number" id="attemptsInput" min="1" max="20" value="${draft.maxAttempts}">

      <p class="field-label">Schedule (optional — leave blank to keep it always open)</p>
      <input type="datetime-local" id="startInput" value="${draft.scheduleStart}">
      <input type="datetime-local" id="endInput" value="${draft.scheduleEnd}">

      <p class="field-label">Question source</p>
      <div class="checkbox-row">
        <label class="radio-item ${draft.questionSource==='preset'?'checked':''}" data-src="preset">
          <input type="radio" name="qsrc" ${draft.questionSource==='preset'?'checked':''}>
          <span>Use the preset question bank</span>
        </label>
        <label class="radio-item ${draft.questionSource==='custom'?'checked':''}" data-src="custom">
          <input type="radio" name="qsrc" ${draft.questionSource==='custom'?'checked':''}>
          <span>Write my own questions</span>
        </label>
      </div>

      ${draft.questionSource === 'custom' ? `
        <div class="tab-row">
          <button class="tab-btn ${draft.qbTestType==='pretest'?'active':''}" data-tt="pretest">Pre-Test</button>
          <button class="tab-btn ${draft.qbTestType==='posttest'?'active':''}" data-tt="posttest">Post-Test</button>
        </div>
        <p class="field-label">Subject for new question</p>
        <select id="qbSubjectSel">
          ${draft.subjects.map(s=>`<option value="${s}" ${draft.qbForm.subject===s?'selected':''}>${SUBJECT_META[s].label}</option>`).join("")}
        </select>
        <p class="field-label">Question text</p>
        <textarea id="qbText" placeholder="Type the question, or start with SCENARIO: for a scenario-type item">${escapeHtml(draft.qbForm.q)}</textarea>
        <p class="field-label">Choices (mark the correct one)</p>
        ${[0,1,2,3].map(i=>`
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
            <input type="radio" name="qbCorrect" data-ci="${i}" ${draft.qbForm.correct===i?'checked':''}>
            <input type="text" id="qbC${i}" placeholder="Choice ${i+1}" value="${escapeHtml(draft.qbForm['c'+i])}" style="margin-bottom:0;">
          </div>
        `).join("")}
        <button class="pill-btn outline" id="addQBtn" style="margin-bottom:16px;">➕ Add Question (${qList.length}/${MAX_QUESTIONS} for this subject)</button>
        ${qList.length === 0 ? `<p class="empty-note">No custom questions yet for ${SUBJECT_META[draft.qbForm.subject].label} in ${draft.qbTestType === 'pretest' ? 'Pre-Test' : 'Post-Test'}.</p>` : qList.map((q,i)=>`
          <div class="qb-item">
            <div class="qbi-text">${escapeHtml(q.q)}</div>
            ${q.c.map((ch,ci)=>`<div class="qbi-c ${ci===q.a?'correct':''}">${String.fromCharCode(65+ci)}. ${escapeHtml(ch)}${ci===q.a?' ✓':''}</div>`).join("")}
            <button class="small-del" data-del="${i}">Delete</button>
          </div>
        `).join("")}
      ` : ``}

      <p class="field-label">Custom reviewer content (optional — blank keeps the built-in reviewer)</p>
      ${draft.subjects.map(s=>`
        <p class="fine-print" style="text-align:left; margin:0 0 6px 2px;">${SUBJECT_META[s].label}</p>
        <textarea id="reviewer_${s}" placeholder="Leave blank to use the default reviewer">${escapeHtml(draft.customReviewer[s]||"")}</textarea>
      `).join("")}

      ${state.assignmentSaveNote ? `<p class="save-note">${escapeHtml(state.assignmentSaveNote)}</p>` : ``}
      <button class="primary-btn" id="saveAssignmentBtn">Save Test Settings</button>
    </div>
  `;

  function syncFormFieldsIntoDraft(){
    draft.numQuestions = Math.min(MAX_QUESTIONS, Math.max(1, parseInt(document.getElementById("numQInput").value) || 20));
    draft.timerSeconds = Math.max(5, parseInt(document.getElementById("timerInput").value) || 20);
    draft.maxAttempts = Math.max(1, parseInt(document.getElementById("attemptsInput").value) || 1);
    draft.scheduleStart = document.getElementById("startInput").value;
    draft.scheduleEnd = document.getElementById("endInput").value;
    draft.subjects = [...classSubjects, ...otherSubjects.filter(s=>draft.subjects.includes(s))];
    draft.subjects.forEach(s=>{
      const ta = document.getElementById("reviewer_"+s);
      if(ta) draft.customReviewer[s] = ta.value;
    });
  }

  document.getElementById("backBtn").addEventListener("click", ()=>{ syncFormFieldsIntoDraft(); state.screen="classDetail"; route(); });

  document.querySelectorAll(".checkbox-row .checkbox-item[data-subj]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      syncFormFieldsIntoDraft();
      const s = el.dataset.subj;
      const idx = draft.subjects.indexOf(s);
      if(idx >= 0) draft.subjects.splice(idx,1); else draft.subjects.push(s);
      if(!draft.subjects.includes(draft.qbForm.subject)) draft.qbForm.subject = primarySubject;
      renderManageTest();
    });
  });

  document.querySelectorAll(".radio-item[data-src]").forEach(el=>{
    el.addEventListener("click", ()=>{
      syncFormFieldsIntoDraft();
      draft.questionSource = el.dataset.src;
      renderManageTest();
    });
  });

  const tabBtns = document.querySelectorAll(".tab-btn[data-tt]");
  tabBtns.forEach(el=>{
    el.addEventListener("click", ()=>{
      syncFormFieldsIntoDraft();
      draft.qbTestType = el.dataset.tt;
      renderManageTest();
    });
  });

  const qbSubjectSel = document.getElementById("qbSubjectSel");
  if(qbSubjectSel){
    qbSubjectSel.addEventListener("change", ()=>{
      syncFormFieldsIntoDraft();
      draft.qbForm.subject = qbSubjectSel.value;
      renderManageTest();
    });
  }

  const addQBtn = document.getElementById("addQBtn");
  if(addQBtn){
    addQBtn.addEventListener("click", ()=>{
      const qText = document.getElementById("qbText").value.trim();
      const choices = [0,1,2,3].map(i=>document.getElementById("qbC"+i).value.trim());
      const correctRadio = document.querySelector('input[name="qbCorrect"]:checked');
      const correct = correctRadio ? parseInt(correctRadio.dataset.ci) : 0;
      if(!qText || choices.some(c=>!c)){
        state.assignmentSaveNote = "";
        alert("Fill in the question text and all four choices before adding.");
        return;
      }
      syncFormFieldsIntoDraft();
      const subj = qbSubjectSel.value;
      const tt = draft.qbTestType;
      if(!draft.customQuestions[tt][subj]) draft.customQuestions[tt][subj] = [];
      if(draft.customQuestions[tt][subj].length >= MAX_QUESTIONS){
        alert(`You've reached the ${MAX_QUESTIONS}-question limit for this subject.`);
        return;
      }
      draft.customQuestions[tt][subj].push({q:qText, c:choices, a:correct});
      draft.qbForm = {subject: subj, q:"", c0:"", c1:"", c2:"", c3:"", correct:0, scenario:false};
      renderManageTest();
    });
  }

  document.querySelectorAll(".small-del[data-del]").forEach(el=>{
    el.addEventListener("click", ()=>{
      syncFormFieldsIntoDraft();
      const idx = parseInt(el.dataset.del);
      draft.customQuestions[draft.qbTestType][draft.qbForm.subject].splice(idx,1);
      renderManageTest();
    });
  });

  document.getElementById("saveAssignmentBtn").addEventListener("click", async ()=>{
    syncFormFieldsIntoDraft();
    const btn = document.getElementById("saveAssignmentBtn");
    btn.disabled = true; btn.textContent = "Saving...";
    try{
      await db.collection("assignments").doc(id).set({
        classId: id,
        teacherEmail: state.teacher.email,
        subjects: draft.subjects,
        numQuestions: draft.numQuestions,
        timerSeconds: draft.timerSeconds,
        maxAttempts: draft.maxAttempts,
        scheduleStart: toEpoch(draft.scheduleStart),
        scheduleEnd: toEpoch(draft.scheduleEnd),
        questionSource: draft.questionSource,
        customQuestions: draft.customQuestions,
        customReviewer: draft.customReviewer,
        updatedAt: Date.now()
      });
      state.assignmentSaveNote = "Saved. Students in this class will see the updated test next time they open it.";
    }catch(e){
      console.error(e);
      state.assignmentSaveNote = "";
      alert("Couldn't save — check your connection and try again.");
    }
    renderManageTest();
  });
}

async function renderClassActivity(){
  const id = state.activeClassId;
  const c = state.classCache[id].classDoc;

  if(!state.activityCache[id]){
    app.innerHTML = `
      <div class="fade-in">
        <div class="navbar"><button class="pill-btn outline" id="backBtn">Back</button><div class="who">Class Activity</div></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="classDetail"; route(); });
    try{
      const [attemptSnap, viewSnap, reviewerSnap] = await Promise.all([
        db.collection("attempts").where("classId","==",id).get(),
        db.collection("classViews").where("classId","==",id).get(),
        db.collection("reviewerViews").where("classId","==",id).get()
      ]);
      const attempts = []; attemptSnap.forEach(d=>attempts.push(d.data()));
      const views = []; viewSnap.forEach(d=>views.push(d.data()));
      const reviewerViews = []; reviewerSnap.forEach(d=>reviewerViews.push(d.data()));
      attempts.sort((a,b)=>b.timestamp-a.timestamp);
      views.sort((a,b)=>b.timestamp-a.timestamp);
      reviewerViews.sort((a,b)=>b.timestamp-a.timestamp);
      state.activityCache[id] = {attempts, views, reviewerViews};
    }catch(e){
      console.error(e);
      state.activityCache[id] = {attempts:[], views:[], reviewerViews:[]};
    }
  }

  const data = state.activityCache[id];
  const tab = state.activityTab;

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(c.className)} &middot; Activity</div>
      </div>
      <div class="tab-row">
        <button class="tab-btn ${tab==='attempts'?'active':''}" data-tab="attempts">Attempts (${data.attempts.length})</button>
        <button class="tab-btn ${tab==='views'?'active':''}" data-tab="views">Class Opens (${data.views.length})</button>
        <button class="tab-btn ${tab==='reviewer'?'active':''}" data-tab="reviewer">Reviewer Opens (${data.reviewerViews.length})</button>
      </div>
      ${tab === 'attempts' ? (
        data.attempts.length === 0 ? `<p class="empty-note">No attempts yet.</p>` :
        `<div style="overflow-x:auto;"><table class="roster-table">
          <thead><tr><th>Student</th><th>Test</th><th>Subject(s)</th><th>Score</th><th>Date</th></tr></thead>
          <tbody>${data.attempts.map(a=>`
            <tr>
              <td>${escapeHtml(a.studentName||"")}</td>
              <td>${a.testType==='pretest'?'PRE':'POST'}</td>
              <td>${(a.subjects||[]).map(s=>SUBJECT_META[s]?SUBJECT_META[s].label:s).join(", ")}</td>
              <td>${a.correct}/${a.total} (${a.pct}%)</td>
              <td>${fmtDate(a.timestamp)}</td>
            </tr>
          `).join("")}</tbody>
        </table></div>`
      ) : tab === 'views' ? (
        data.views.length === 0 ? `<p class="empty-note">No one has opened this class yet.</p>` :
        data.views.map(v=>`
          <div class="activity-row"><span class="a-name">${escapeHtml(v.studentName||"")}</span><span class="a-time">${fmtDate(v.timestamp)}</span></div>
        `).join("")
      ) : (
        data.reviewerViews.length === 0 ? `<p class="empty-note">No one has opened the reviewer from this class yet.</p>` :
        data.reviewerViews.map(v=>`
          <div class="activity-row"><span class="a-name">${escapeHtml(v.studentName||"")} — ${SUBJECT_META[v.subject]?SUBJECT_META[v.subject].label:escapeHtml(v.subject||"")}</span><span class="a-time">${fmtDate(v.timestamp)}</span></div>
        `).join("")
      )}
      <button class="pill-btn outline" id="refreshActivityBtn" style="margin-top:14px;">Refresh</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="classDetail"; route(); });
  document.querySelectorAll(".tab-btn[data-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.activityTab = el.dataset.tab; renderClassActivity(); });
  });
  document.getElementById("refreshActivityBtn").addEventListener("click", ()=>{
    delete state.activityCache[id];
    renderClassActivity();
  });
}
