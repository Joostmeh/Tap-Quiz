<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap-Quiz for Students · Effective Communication</title>
<meta name="description" content="Effective Communication Grade 11 quiz and review app for Second Term (Week 1: Audience, Purpose, and Context; Week 2: Shaping Content, Structure, and Language).">
<meta property="og:title" content="Tap-Quiz for Students · Effective Communication">
<meta property="og:description" content="Effective Communication Grade 11 quiz and review app for Second Term (Week 1: Audience, Purpose, and Context; Week 2: Shaping Content, Structure, and Language).">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  try{
    if(window.localStorage.getItem("tq_theme") === "dark"){
      document.documentElement.dataset.theme = "dark";
    }
  }catch(e){}
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F3F1FB; --surface:#FFFFFF; --ink:#211C4E; --ink-soft:#5A5480; --border:#DDD7F2;
    --english:#E4572E; --english-soft:#FBE1D9; --accent:var(--ink); --accent-soft:#E7E3F8;
    --good:#1B998B; --bad:#E4572E; --glow-2:#ECE3FB; --button-bg:#211C4E; --button-ink:#FFFFFF;
    --radius:18px; --shadow:0 12px 30px -14px rgba(33,28,78,0.35);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#11131F; --surface:#1B1E2B; --ink:#F5F2FF; --ink-soft:#B6AFD0; --border:#3B3658;
    --accent:var(--ink); --accent-soft:#2A2644; --glow-2:#2A2441;
    --english-soft:#45221D; --button-bg:#EEEAFE; --button-ink:#17142B;
    --shadow:0 12px 30px -14px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, var(--glow-2) 0%, transparent 40%), var(--paper);
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:28px 16px 60px; transition:background 0.5s ease;
  }
  .wrap{ width:100%; max-width:560px; }
  .brand{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .brand .logo-row{ display:flex; align-items:center; gap:10px; }
  .brand img.logo{ width:46px; height:46px; border-radius:12px; object-fit:cover; object-position:center; box-shadow:var(--shadow); flex-shrink:0; display:block; background:#39B5FD; }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:clamp(19px,5vw,24px); font-weight:700; letter-spacing:-0.02em; margin:0; line-height:1.05; }
  .brand h1 span{ color:var(--english); }
  .brand .tag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:0.03em; text-align:right; line-height:1.4; }
  .brand-actions{ display:flex; align-items:center; gap:10px; }
  .theme-toggle{ border:1.5px solid var(--border); background:var(--surface); color:var(--ink); border-radius:100px; padding:8px 10px; cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .theme-toggle:hover{ border-color:var(--accent); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; min-height:120px; }

  .navbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .navbar .who{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .navbar .who b{ color:var(--ink); }
  .pill-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--ink); border:none; border-radius:100px; padding:8px 12px; cursor:pointer; }
  .pill-btn.outline{ background:transparent; border:1.5px solid var(--border); }

  .subject-strip{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .subject-chip{ flex:1; min-width:90px; padding:10px 8px; border-radius:12px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.03em; cursor:pointer; border:1.5px solid transparent; }
  .subject-chip.english{ background:var(--english-soft); color:#8E2E15; }
  .subject-chip.selected{ border-color:currentColor; }

  .field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:0 0 8px 2px; }

  input[type="text"], input[type="email"]{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
    outline:none; margin-bottom:16px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .checkbox-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .checkbox-item{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--paper); }
  .checkbox-item.checked{ border-color:var(--accent); background:var(--accent-soft); }
  .checkbox-item input{ width:auto; margin:0; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .mode-btn{ cursor:pointer; border:1.5px solid var(--border); background:var(--paper); border-radius:14px; padding:16px 10px; text-align:left; transition:all .15s ease; }
  .mode-btn:hover{ border-color:var(--accent); }
  .mode-btn .mtitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; display:block; margin-bottom:4px; }
  .mode-btn .msub{ font-size:11.5px; color:var(--ink-soft); line-height:1.35; display:block; }
  .mode-btn.locked{ opacity:0.45; cursor:not-allowed; }

  .primary-btn{ width:100%; border:none; cursor:pointer; background:var(--button-bg); color:var(--button-ink); font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.01em; padding:15px 18px; border-radius:14px; transition:transform .12s ease, opacity .15s ease; margin-bottom:0; }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }

  .fine-print{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.5; }
  .link-btn{ background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .error-note{ font-size:12.5px; color:var(--bad); margin:-8px 0 14px; }

  .hero{ text-align:center; padding:6px 4px 20px; }
  .hero .kicker{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:10px; }
  .hero h2{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; line-height:1.25; margin:0 0 12px; }
  .hero p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 20px; }
  .feature-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; text-align:left; }
  .feature-item{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-soft); }
  .feature-item b{ color:var(--ink); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }

  .home-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .home-card{ border:1.5px solid var(--border); border-radius:16px; padding:18px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; display:flex; align-items:center; gap:14px; }
  .home-card:hover{ border-color:var(--accent); }
  .home-card .hicon{ font-size:22px; }
  .home-card .htitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:2px; }
  .home-card .hsub{ font-size:12px; color:var(--ink-soft); }

  .class-card{ border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; }
  .class-card:hover{ border-color:var(--accent); }
  .class-card .ctitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .class-card .cmeta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }

  .quiz-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .subj-pill{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.04em; padding:7px 12px; border-radius:100px; color:#fff; }
  .score-chip{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.03em; background:var(--button-bg); color:var(--button-ink); padding:7px 12px; border-radius:100px; }
  .track{ display:flex; gap:4px; margin-bottom:20px; }
  .track-seg{ flex:1; height:6px; border-radius:4px; background:var(--border); overflow:hidden; }
  .track-seg i{ display:block; height:100%; border-radius:4px; }
  .qhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .qcount{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .qtag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600; letter-spacing:0.03em; padding:3px 8px; border-radius:100px; background:var(--accent-soft); color:var(--ink); margin-left:8px; vertical-align:middle; }
  .timer-ring{ position:relative; width:40px; height:40px; }
  .timer-ring svg{ transform:rotate(-90deg); }
  .timer-ring .tnum{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; }
  .qtext{ font-family:'Space Grotesk', sans-serif; font-size:17px; font-weight:600; line-height:1.4; margin:4px 0 20px; min-height:52px; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{ display:flex; align-items:center; gap:12px; text-align:left; padding:13px 14px; border-radius:13px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; font-size:14.5px; color:var(--ink); transition:all .12s ease; }
  .choice:hover{ border-color:var(--accent); }
  .choice .klabel{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px; width:22px; height:22px; border-radius:7px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .choice.correct{ background:#E4F5F1; border-color:var(--good); color:#0E5C52; }
  .choice.correct .klabel{ background:var(--good); border-color:var(--good); color:#fff; }
  .choice.wrong{ background:#FCE7E1; border-color:var(--bad); color:#8E2E15; }
  .choice.wrong .klabel{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .choice.disabled{ pointer-events:none; }
  .choice.dim{ opacity:0.45; }

  .transition-screen{ min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; }
  .transition-screen .tsub{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; }
  .transition-screen .tnext{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:0.04em; }
  .transition-dot{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }

  .result-hero{ text-align:center; padding:6px 0 22px; }
  .result-hero .pct{ font-family:'Space Grotesk', sans-serif; font-size:56px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .result-hero .frac{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); margin-top:8px; }
  .result-hero .msg{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600; margin-top:10px; }
  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  table.results-table{ width:100%; border-collapse:collapse; font-size:12px; }
  table.results-table th, table.results-table td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  table.results-table th{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); }
  .tag-pre{ background:var(--accent-soft); color:var(--ink-soft); padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }
  .tag-post{ background:var(--english-soft); color:#8E2E15; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }

  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .reviewer-intro{ color:var(--ink-soft); font-size:12.5px; line-height:1.55; margin:-4px 0 14px; }
  .reviewer-week-tabs{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:14px; }
  .reviewer-week-tab{ border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:12px; padding:12px 10px; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; line-height:1.3; text-align:center; }
  .reviewer-week-tab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
  .reviewer-reading{ background:#FBF8F0; border:1px solid #E8E0D0; color:#343747; border-radius:16px; padding:20px 18px; margin-bottom:16px; font-size:15px; line-height:1.8; letter-spacing:.008em; box-shadow:0 5px 18px -16px rgba(50,45,35,.45); }
  .reviewer-reading h3{ color:#292B39; font-family:'Space Grotesk',sans-serif; font-size:20px; line-height:1.25; margin:0 0 10px; }
  .reviewer-reading .reading-lead{ color:#626579; font-size:14px; line-height:1.6; margin:0 0 16px; }
  .reviewer-reading .reading-body{ white-space:pre-wrap; font-size:14px; line-height:1.75; }
  .reviewer-list{ margin:0 0 16px; padding-left:18px; font-size:13.5px; line-height:1.6; color:var(--ink); }
  .reviewer-list li{ margin-bottom:6px; }
  .reviewer-list.check{ list-style:none; padding-left:0; }
  .reviewer-list.check li{ position:relative; padding-left:22px; }
  .reviewer-list.check li:before{ content:"\2610"; position:absolute; left:0; top:-1px; color:var(--english); font-size:15px; }
  .reviewer-terms{ margin:0 0 16px; font-size:13.5px; line-height:1.55; }
  .reviewer-terms dt{ font-weight:700; color:var(--ink); margin-top:8px; }
  .reviewer-terms dd{ margin:2px 0 0; padding-left:0; color:var(--ink-soft); }
  .reviewer-example{ border:1.5px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:13.5px; line-height:1.6; }
  .reviewer-example b{ display:block; margin-bottom:6px; }
  .study-label{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin:8px 0 6px; }
  .formula-card{ background:#F1EBDD; border:1.5px solid #D8C9AA; border-radius:13px; padding:14px; margin:0 0 18px; }
  .formula-card .formula-label{ color:#756345; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-bottom:7px; }
  .formula-card .formula-text{ color:#27283A; font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; line-height:1.65; white-space:pre-wrap; }
  .formula-card .formula-meaning{ color:#5E594E; font-size:13px; line-height:1.55; margin-top:8px; }
  .reviewer-reading .reading-tip{ border-left:3px solid var(--english); background:#FBF1EE; color:#6B3A2C; border-radius:0 10px 10px 0; padding:10px 12px; margin-top:18px; font-size:13.5px; line-height:1.6; }
  html[data-theme="dark"] .reviewer-reading{ background:#20231F; border-color:#454637; color:#E8E3D5; box-shadow:none; }
  html[data-theme="dark"] .reviewer-reading h3{ color:#FFF8E7; }
  html[data-theme="dark"] .reviewer-reading .reading-lead{ color:#C5C0B1; }
  html[data-theme="dark"] .formula-card{ background:#343226; border-color:#62583B; }
  html[data-theme="dark"] .formula-card .formula-label{ color:#D7C38C; }
  html[data-theme="dark"] .formula-card .formula-text{ color:#FFF4D2; }
  html[data-theme="dark"] .formula-card .formula-meaning{ color:#D6CFBA; }
  html[data-theme="dark"] .reviewer-reading .reading-tip{ background:#353522; color:#E8E3D5; }
  .learning-panel{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .learning-panel .lp-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .learning-panel .lp-sub{ color:var(--ink-soft); font-size:12px; line-height:1.45; margin-bottom:12px; }
  .mastery-row{ margin:10px 0; }
  .mastery-row .mr-top{ display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:5px; }
  .mastery-row .mr-top span:last-child{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:10.5px; }
  .mastery-track{ height:7px; border-radius:5px; background:var(--surface); overflow:hidden; }
  .mastery-track i{ display:block; height:100%; border-radius:5px; background:var(--accent); }

  .tab-row{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn{ flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; padding:8px 12px; border-radius:100px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink-soft); }
  .tab-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }

  .review-item{ border:1.5px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  .review-item .ri-q{ font-weight:600; font-size:14px; margin-bottom:10px; }
  .review-item .ri-c{ padding:9px 12px; border-radius:10px; font-size:13px; margin-bottom:6px; background:var(--paper); }
  .review-item .ri-c.correct{ background:#E4F5F1; color:#0E5C52; font-weight:600; }
  .review-item .ri-c.wrong{ background:#FCE7E1; color:#8E2E15; font-weight:600; }

  .assign-box{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .assign-box .al-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); }
  .assign-box .al-row:last-child{ border-bottom:none; }
  .assign-box .al-label{ color:var(--ink-soft); }
  .assign-box .al-value{ font-weight:600; }
  .saved-class-section{ margin-top:20px; }
  .saved-class-card{ width:100%; text-align:left; }
  .saved-class-card .cmeta{ line-height:1.5; }

  .float-pt{ position:fixed; pointer-events:none; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; animation:floatUp .8s ease forwards; z-index:50; }
  @keyframes floatUp{ 0%{ opacity:1; transform:translateY(0);} 100%{ opacity:0; transform:translateY(-38px);} }
  .fade-in{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  html[data-theme="dark"] .choice.correct,
  html[data-theme="dark"] .review-item .ri-c.correct{ background:#173B37; color:#8BE6D5; }
  html[data-theme="dark"] .choice.wrong,
  html[data-theme="dark"] .review-item .ri-c.wrong{ background:#48251F; color:#FFB3A3; }
  html[data-theme="dark"] .tag-pre{ color:#FFD27A; }
  html[data-theme="dark"] .subject-chip.english,
  html[data-theme="dark"] .tag-post{ color:#FFB09B; }

  footer.credit{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:18px; font-family:'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="wrap">

2. AUDIENCE AWARENESS: SPECIALIST VS. GENERAL

• Specialist Audience: Readers or listeners who already understand the subject or field (e.g., fellow STEM classmates, scientists, panels). They expect precise technical terminology, rigorous evidence, and discipline-specific conventions.
• General Audience: Non-specialists or the broader public who do not have background knowledge in the field. They require plain language, concise definitions for every technical term, visual aids, and relatable examples.
• Audience Awareness: The conscious habit of tailoring your explanations, sentence complexity, and examples to meet the reader's needs rather than showing off jargon.

• Informative Purpose: Explains ideas, processes, or findings clearly, accurately, and objectively without taking a personal side (e.g., research summaries, abstracts, informative articles).

Content refers to the ideas, facts, details, and observations included in a text:

• In technical texts, content must be accurate, specific, and actionable so readers can perform tasks or make informed decisions.

2. STRUCTURE: STANDARD ACADEMIC & TECHNICAL ORGANIZATION

Structure refers to the organization and order of the parts of a text:
• Abstract: A concise overview positioned at the start of a research report that briefly summarizes the study's purpose, methods, findings, and conclusion.
• Introduction: Establishes context, introduces the topic, and clearly states the purpose or central thesis.
• IMRaD Format (Introduction, Methods, Results, Discussion): The standard structure expected by scientific disciplines for lab reports and empirical research.
• Numbered Sequential Steps: The required structure for technical manuals, recipes, protocols, and guides because procedures must be executed in exact chronological order.
• Headings and Subheadings: Visual navigational signposts that help readers locate information quickly and follow the author's logic.
• Adapting Structure: Good communicators rearrange structure to suit their readers — such as placing key recommendations first for busy managers or decision-makers.

3. LANGUAGE & REGISTER

Language choices encompass vocabulary, tone, syntax, and register:
• Register: The level of formality of language.
• Academic Register: Formal, objective, and precise. Avoid slang, emojis, casual text abbreviations ("lol", "super cool"), and emotional outbursts.
• Hedging (Cautious Language): Academic writers use words such as "suggests," "indicates," "may," or "appears to" to make honest, defensible claims rather than exaggerated absolute assertions ("proves beyond any doubt").
• Active Voice: Technical communication often favors active voice ("The team tested the sample" rather than "The sample was tested by the team") because it is direct, energetic, and clear about who took the action.
• Logical Transitions: Connective words such as "however" (contrast), "therefore" (cause/result), "furthermore" (addition), and "consequently" create cohesive links between sentences and paragraphs.

Technical writing demands exactness. Vague wording causes errors and misinterpretations:
• Vague: "Heat it a bit until it gets warm-ish."

• Shorter, digestible sentences.

• Deliberate vocal pacing, pauses for emphasis, and active engagement with the audience.

Multimodal texts combine words with visual, numerical, or auditory elements:

const WEEK_KEYS = TERM_WEEKS.map(w=>w.key);
function weekMeta(key){
  return TERM_WEEKS.find(w=>w.key === key) || null;
}
function weekLabel(key){
  const w = weekMeta(key);
  return w ? w.label : "Week";
}
function weekSkill(key){
  const w = weekMeta(key);
  return w ? (w.label + " \u00b7 " + w.topic) : "Effective Communication";
}
function weekLabels(keys){
  return (keys || []).filter(k=>weekMeta(k)).map(weekLabel).join(", ");
}
function validWeeks(keys){
  const list = (keys || []).filter(k=>WEEK_KEYS.includes(k));
  return list.length ? list : WEEK_KEYS.slice();
}
function weekPool(testType, key){
  const bank = ((TERM_BANK.second || {})[testType] || {}).english || {};
  return bank[key] || [];
}
function flattenPool(value){
  if(Array.isArray(value)) return value;
  if(value && typeof value === "object") return WEEK_KEYS.concat(Object.keys(value))
    .filter((k,i,arr)=>arr.indexOf(k) === i)
    .flatMap(k=>Array.isArray(value[k]) ? value[k] : []);
  return [];
}
function prepareItem(item, weekKey){
  const correctText = item.c[item.a];
  const shuffledChoices = shuffle(item.c);
  const rawQ = item.q || "";
  const isScenario = item.isScenario || rawQ.startsWith("SCENARIO:");
  const qtext = rawQ.startsWith("SCENARIO:") ? rawQ.replace("SCENARIO: ","") : rawQ;
  return {
    subject: SUBJECT,
    week: weekKey || null,
    weekLabel: weekKey ? weekLabel(weekKey) : "",
    q: qtext,
    skill: weekKey ? weekSkill(weekKey) : (item.skill || inferSkill(SUBJECT, qtext)),
    isScenario,
    c: shuffledChoices,
    a: shuffledChoices.indexOf(correctText)
  };
}
function buildQueueFromPools(pools, total){
  const counts = distributeCount(total, pools.length);
  let queue = [];
  pools.forEach((pool, i)=>{
    const picked = shuffle(pool.items).slice(0, Math.min(counts[i], pool.items.length));
    picked.forEach(item=>queue.push(prepareItem(item, pool.key)));
  });
  return shuffle(queue);
}

function buildPracticeQueue(weeks, testType){
  const keys = validWeeks(weeks);
  const pools = keys.map(key=>({key, items: weekPool(testType, key)}));
  const totalAvailable = pools.reduce((sum, p) => sum + p.items.length, 0);
  const target = Math.min(PRACTICE_TOTAL, totalAvailable);
  return buildQueueFromPools(pools, target);
}
function buildAssignedQueue(assignment, testType){
  const keys = validWeeks(assignment.weeks);
  const total = Math.min(Math.max(assignment.numQuestions || 20, 1), MAX_QUESTIONS);
  let pools;
  if(assignment.questionSource === "custom"){
    const custom = (((assignment.customQuestions || {}).second || {})[testType] || {})[SUBJECT];
    pools = (custom && !Array.isArray(custom))
      ? keys.map(key=>({key, items: flattenPool(custom[key])}))
      : [{key: null, items: flattenPool(custom)}];
  } else {
    pools = keys.map(key=>({key, items: weekPool(testType, key)}));
  }
  pools = pools.filter(p=>p.items.length);
  if(!pools.length) return [];
  const totalAvailable = pools.reduce((sum, p) => sum + p.items.length, 0);
  const target = Math.min(total, totalAvailable);
  return buildQueueFromPools(pools, target);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function distributeCount(total, n){
  if(n <= 0) return [];
  const base = Math.floor(total / n);
  let rem = total - base * n;
  const arr = [];
  for(let i = 0; i < n; i++) arr.push(base + (i < rem ? 1 : 0));
  return shuffle(arr);
}
function inferSkill(subject, question){
  const q = String(question || "").toLowerCase();
  if(/audience|general audience|specialist|reader|viewer/.test(q)) return "Audience Awareness";
  if(/purpose|informative|persuasive|instructional|aims to/.test(q)) return "Purpose & Intent";
  if(/context|setting|time limit|venue|occasion/.test(q)) return "Contextual Understanding";
  if(/structure|abstract|imrad|steps|heading|introduction|transition/.test(q)) return "Text Structure & Organization";
  if(/register|hedging|active voice|formal|tone|objective|slang/.test(q)) return "Academic & Technical Language";
  if(/multimodal|visual|chart|graph|labeled/.test(q)) return "Multimodal Representations";
  return "Effective Communication";
}
function buildSkillBreakdown(answers){
  const map = {};
  (answers || []).forEach(a=>{
    const skill = a.skill || inferSkill(a.subject, a.q);
    if(!map[skill]) map[skill] = {skill, correct:0, total:0};
    map[skill].total++;
    if(a.correct) map[skill].correct++;
  });
  return Object.values(map).map(v=>({...v, pct: Math.round((v.correct/v.total)*100)}));
}
function masteryLabel(pct){
  if(pct >= 85) return "Mastered";
  if(pct >= 70) return "Developing";
  return "Needs practice";
}

function renderQuestion(){
  clearInterval(state.timerId);
  state.locked = false;
  state.timeLeft = state.currentTimerSeconds || PRACTICE_TIMER;

  const item = state.quizQueue[state.qIndex];
  if(!item){
    clearInterval(state.timerId);
    state.screen = "home";
    route();
    return;
  }
  const meta = SUBJECT_META[item.subject];
  bg(meta.soft);

  const score = state.answers.filter(a=>a.correct).length;

  app.innerHTML = `
    <div class="fade-in">
      <div class="quiz-top">
        <div class="subj-pill" style="background:${meta.color}">${state.practiceType.toUpperCase()}</div>
        <div class="score-chip">SCORE ${String(score).padStart(2,'0')}</div>
      </div>
      <div class="track"><div class="track-seg"><i style="width:${(state.qIndex/state.quizQueue.length*100)}%;background:${meta.color}"></i></div></div>
      <div class="qhead">
        <span class="qcount">Q${state.qIndex+1} / ${state.quizQueue.length} &middot; ${item.weekLabel || meta.label}${item.isScenario ? '<span class="qtag">SCENARIO</span>' : ''}</span>
        <div class="timer-ring">
          <svg width="40" height="40">
            <circle cx="20" cy="20" r="16" stroke="var(--border)" stroke-width="4" fill="none"/>
            <circle id="ringProgress" cx="20" cy="20" r="16" stroke="${meta.color}" stroke-width="4" fill="none"
              stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"/>
          </svg>
          <div class="tnum" id="tnum">${state.timeLeft}</div>
        </div>
      </div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <div class="choices" id="choices">
        ${item.c.map((choice,i)=>`
          <button class="choice" data-i="${i}">
            <span class="klabel">${String.fromCharCode(65+i)}</span>
            <span>${escapeHtml(choice)}</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=> lockAnswer(parseInt(btn.dataset.i)));
  });
  runTimer();
}

function runTimer(){
  const ring = document.getElementById("ringProgress");
  const tnum = document.getElementById("tnum");
  const total = state.currentTimerSeconds || PRACTICE_TIMER;
  const circumference = 100.5;
  state.timerId = setInterval(()=>{
    state.timeLeft -= 0.25;
    if(tnum) tnum.textContent = Math.max(0, Math.ceil(state.timeLeft));
    if(ring) ring.style.strokeDashoffset = circumference * (1 - state.timeLeft/total);
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      if(!state.locked) lockAnswer(-1);
    }
  }, 250);
}

function lockAnswer(choiceIndex){
  if(state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);

  const item = state.quizQueue[state.qIndex];
  const isCorrect = choiceIndex === item.a;
  state.answers.push({
    subject:item.subject, week:item.week || null, skill:item.skill || inferSkill(item.subject, item.q), q:item.q, choices:item.c,
    correctIndex:item.a, selectedIndex:choiceIndex, correct:isCorrect
  });

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach((btn,i)=>{
    btn.classList.add("disabled");
    if(i === item.a) btn.classList.add("correct");
    if(i === choiceIndex && !isCorrect) btn.classList.add("wrong");
    if(i !== item.a && i !== choiceIndex) btn.classList.add("dim");
  });

  if(isCorrect){ spawnFloatingPoint("+1", "var(--good)"); }
  else if(choiceIndex >= 0){ document.querySelector(".qtext").parentElement.classList.add("shake"); }

  setTimeout(()=>{
    if(state.qIndex < state.quizQueue.length - 1){
      state.screen = "transition"; route();
    } else {
      state.screen = "results"; route();
    }
  }, 850);
}

function renderTransition(){
  clearInterval(state.timerId);
  const nextItem = state.quizQueue[state.qIndex + 1];
  const meta = SUBJECT_META[nextItem.subject];
  const lastAnswer = state.answers[state.answers.length - 1];
  const feedback = lastAnswer && lastAnswer.correct ? "Correct — well done!" : "Incorrect — remember to review this concept.";
  const feedbackSkill = lastAnswer ? (lastAnswer.skill || inferSkill(lastAnswer.subject, lastAnswer.q)) : "";
  bg(meta.soft);
  app.innerHTML = `
    <div class="fade-in transition-screen">
      <div class="transition-dot" style="background:${meta.color}">${state.qIndex + 2}</div>
      <div class="tsub">${nextItem.weekLabel ? meta.label + " &middot; " + nextItem.weekLabel : meta.label}</div>
      <div class="tnext">${feedback}</div>
      <div class="tnext">${escapeHtml(feedbackSkill)} &middot; NEXT QUESTION...</div>
    </div>
  `;
  setTimeout(()=>{
    state.qIndex++;
    state.screen = "quiz";
    route();
  }, TRANSITION_MS);
}

function spawnFloatingPoint(text, color){
  const el = document.createElement("div");
  el.className = "float-pt"; el.textContent = text; el.style.color = color;
  const rect = app.getBoundingClientRect();
  el.style.left = (rect.right - 70) + "px"; el.style.top = (rect.top + 20) + "px";
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 800);
}

function renderResults(){
  clearInterval(state.timerId);
  bg();
  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.correct).length;
  const pct = Math.round((correct/total)*100);

  let msg = "Keep practicing!";
  if(pct >= 85) msg = "Outstanding mastery!";
  else if(pct >= 70) msg = "Great performance!";
  else if(pct >= 50) msg = "Good effort, keep reviewing!";
  const weeksCovered = WEEK_KEYS.filter(k=>state.answers.some(a=>a.week === k));
  const skillBreakdown = buildSkillBreakdown(state.answers);
  const focusSkills = skillBreakdown.filter(s=>s.pct < 70).map(s=>`${s.skill} (${s.pct}%)`);
  const masteryNote = skillBreakdown.length
    ? `Learning checkpoint: ${skillBreakdown.map(s=>`${s.skill} — ${masteryLabel(s.pct)}`).join(" &middot; ")}${focusSkills.length ? `<br>Focus area: review ${focusSkills.join(", ")} before your next attempt.` : `<br>Solid understanding demonstrated across the competencies tested.`}`
    : "";
  const skillCards = skillBreakdown.map(s=>`<div class="mastery-row">
    <div class="mr-top"><span>${escapeHtml(s.skill)}</span><span>${masteryLabel(s.pct)} &middot; ${s.pct}%</span></div>
    <div class="mastery-track"><i style="width:${Math.max(4,s.pct)}%"></i></div>
  </div>`).join("");

  app.innerHTML = `
    <div class="fade-in">
      <div class="result-hero">
        <div class="pct">${pct}%</div>
        <div class="frac">${correct} OUT OF ${total} CORRECT &middot; ${state.practiceType.toUpperCase()}${weeksCovered.length ? " &middot; " + weekLabels(weeksCovered).toUpperCase() : ""}</div>
        <div class="msg">${msg}</div>
      </div>
      <p class="fine-print">${masteryNote}</p>
      ${skillCards ? `<div class="learning-panel"><div class="lp-title">Skill Mastery Breakdown</div>${skillCards}</div>` : ""}
      <p class="fine-print" id="saveNote">Saving your result...</p>
      <div class="btn-row">
        <button class="primary-btn ghost" id="answersBtn">📝 View Question Review</button>
        <button class="primary-btn ghost" id="reviewBtn">📖 Open Term 2 Reviewer</button>
        <button class="primary-btn" id="backBtn">Back to Home</button>
      </div>
    </div>
  `;

  autoSaveResult({testType: state.practiceType, terms: state.practiceTerms, correct, total, pct});

  document.getElementById("answersBtn").addEventListener("click", ()=>{ state.screen="answerReview"; route(); });
  document.getElementById("reviewBtn").addEventListener("click", ()=>{ goToReviewer("results"); });
  document.getElementById("backBtn").addEventListener("click", ()=>{
    state.practiceType=null; state.practiceWeeks=WEEK_KEYS.slice(); state.activeAssignment=null; state.screen="home"; route();
  });
}

async function autoSaveResult({testType, terms, correct, total, pct}){
  const note = document.getElementById("saveNote");
  if(state.saved){ if(note) note.textContent = "Result saved."; return; }
  try{
    const subjectsCovered = [...new Set(state.answers.map(a=>a.subject))];
    const subjectBreakdown = subjectsCovered.map(s=>({
      subject:s,
      correct: state.answers.filter(a=>a.subject===s && a.correct).length,
      total: state.answers.filter(a=>a.subject===s).length
    }));
    const weeksCovered = WEEK_KEYS.filter(k=>state.answers.some(a=>a.week === k));
    const weekBreakdown = weeksCovered.map(k=>({
      week:k,
      label: weekLabel(k),
      correct: state.answers.filter(a=>a.week===k && a.correct).length,
      total: state.answers.filter(a=>a.week===k).length
    }));
    const skillBreakdown = buildSkillBreakdown(state.answers);
    try{ localStorage.setItem("tq_mastery_" + state.student.email, JSON.stringify(skillBreakdown)); }catch(e){}
    if(db) await db.collection("attempts").add({
      studentEmail: state.student.email, studentName: state.student.name,
      classId: state.activeClassId || null,
      testType, terms: ["second"], term: "second", subjects: subjectsCovered, subjectBreakdown,
      weeks: weeksCovered, weekBreakdown,
      correct, total, pct, skillBreakdown, timestamp: Date.now()
    });
    state.saved = true;
    if(note) note.textContent = "Result saved to your progress history.";
  }catch(err){
    if(note) note.textContent = "Result recorded locally.";
    console.error(err);
  }
}

async function renderStudentClass(){

  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading class...</p></div>`;

    studentEmail: state.student.email, studentName: state.student.name,
    classId: state.activeClassId, timestamp: Date.now()
  }).catch(e=>console.error(e));

  let assignment = null;
  let preUsed = 0, postUsed = 0;
  try{
    const [assignDoc, preSnap, postSnap] = await Promise.all([
      db.collection("assignments").doc(state.activeClassId).get(),
      db.collection("attempts").where("classId","==",state.activeClassId).where("studentEmail","==",state.student.email).where("testType","==","pretest").get(),
      db.collection("attempts").where("classId","==",state.activeClassId).where("studentEmail","==",state.student.email).where("testType","==","posttest").get()
    ]);
    if(assignDoc.exists) assignment = assignDoc.data();
    preUsed = preSnap.size; postUsed = postSnap.size;
  }catch(e){ console.error(e); }

  state.activeAssignment = assignment;
  if(assignment){
    assignment.terms = ["second"];
    assignment.term = "second";
  }
  state.reviewerTerms = ["second"];

  if(!assignment){
    app.innerHTML = `
      <div class="fade-in">
        <div class="navbar">
          <button class="pill-btn outline" id="backBtn">Back</button>
          <div class="who">${escapeHtml(c.teacherName||"")}</div>
        </div>
        <div class="subject-strip">${classSubjects.map(s=>`<div class="subject-chip ${s}">${SUBJECT_META[s].label.toUpperCase()}</div>`).join("")}</div>
        <p class="field-label">${escapeHtml(c.className)}</p>
        <p class="fine-print" style="margin-top:-6px;">Your teacher hasn't set up a test for this class yet. In the meantime, use the reviewer.</p>
        <button class="primary-btn ghost" id="reviewCardBtn">📖 Open Term 2 Reviewer</button>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
    document.getElementById("reviewCardBtn").addEventListener("click", ()=>{ goToReviewer("studentClass"); });

  }

  const now = Date.now();
  const notYetOpen = assignment.scheduleStart && now < assignment.scheduleStart;
  const alreadyClosed = assignment.scheduleEnd && now > assignment.scheduleEnd;
  const withinWindow = !notYetOpen && !alreadyClosed;

  function windowText(){
    if(!assignment.scheduleStart && !assignment.scheduleEnd) return "Open anytime";
    const startTxt = assignment.scheduleStart ? fmtDate(assignment.scheduleStart) : "now";
    const endTxt = assignment.scheduleEnd ? fmtDate(assignment.scheduleEnd) : "no end date";
    return `${startTxt} — ${endTxt}`;
  }

  const preLeft = Math.max(0, (assignment.maxAttempts||1) - preUsed);
  const postLeft = Math.max(0, (assignment.maxAttempts||1) - postUsed);

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(c.teacherName||"")}</div>
      </div>
      <div class="subject-strip"><div class="subject-chip ${SUBJECT}">${SUBJECT_META[SUBJECT].label.toUpperCase()}</div></div>
      <p class="field-label">${escapeHtml(c.className)}</p>
      <div class="assign-box">
        <div class="al-row"><span class="al-label">Term</span><span class="al-value">Second Term</span></div>
        <div class="al-row"><span class="al-label">Coverage</span><span class="al-value">${weekLabels(validWeeks(assignment.weeks))}</span></div>
        <div class="al-row"><span class="al-label">Questions</span><span class="al-value">${assignment.numQuestions||20}</span></div>
        <div class="al-row"><span class="al-label">Timer per question</span><span class="al-value">${assignment.timerSeconds||20}s</span></div>
        <div class="al-row"><span class="al-label">Attempts allowed</span><span class="al-value">${assignment.maxAttempts||1}</span></div>
        <div class="al-row"><span class="al-label">Available</span><span class="al-value">${windowText()}</span></div>
      </div>
      ${notYetOpen ? `<p class="error-note">This test isn't open yet.</p>` : ``}
      ${alreadyClosed ? `<p class="error-note">This test window has closed.</p>` : ``}
      <button class="primary-btn" id="startPreBtn" ${(!withinWindow || preLeft<=0) ? 'disabled':''}>📝 Start Pre-Test (${preLeft} left)</button>
      <button class="primary-btn" id="startPostBtn" style="margin-top:10px;" ${(!withinWindow || postLeft<=0) ? 'disabled':''}>✅ Start Post-Test (${postLeft} left)</button>
      <button class="primary-btn ghost" id="reviewCardBtn" style="margin-top:10px;">📖 Open Reviewer</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
  document.getElementById("reviewCardBtn").addEventListener("click", ()=>{ goToReviewer("studentClass"); });

  const startBtn = (id, testType) => {
    const btn = document.getElementById(id);
    if(btn) btn.addEventListener("click", ()=>{
      state.practiceType = testType;
      state.practiceTerms = ["second"];
      state.practiceSubjects = [SUBJECT];
      state.practiceWeeks = validWeeks(assignment.weeks);
      state.currentTimerSeconds = assignment.timerSeconds || PRACTICE_TIMER;
      state.quizQueue = buildAssignedQueue(assignment, testType);
      if(!state.quizQueue.length){
        console.error("No questions found for", testType, assignment);
        alert("No questions are available for the selected week(s).");
        return;
      }
      state.qIndex = 0; state.answers = []; state.saved = false;
      state.screen = "quiz"; route();
    });
  };
  startBtn("startPreBtn", "pretest");
  startBtn("startPostBtn", "posttest");
}

let teacherTaps = 0, teacherTapTimer = null;

function unlockTeacher(){
  if(sessionStorage.getItem("tq_teacher") === "1"){ openTeacher(); return; }
  const code = prompt("Passcode:");
  if(code === null) return;
  if(code.trim() !== TEACHER_PASSCODE){ alert("Wrong passcode."); return; }
  try{ sessionStorage.setItem("tq_teacher", "1"); }catch(e){}
  openTeacher();
}
function openTeacher(){
  state.teacherQuery = "";
  state.teacherExpanded = null;
  state.screen = "teacher";
  route();
}
function countTeacherTap(){
  teacherTaps++;
  clearTimeout(teacherTapTimer);
  teacherTapTimer = setTimeout(()=>{ teacherTaps = 0; }, 5000);
  if(teacherTaps >= TEACHER_UNLOCK_TAPS){
    teacherTaps = 0;
    clearTimeout(teacherTapTimer);
    unlockTeacher();
  }
}
function registerTeacherUnlock(){
  const zone = document.querySelector(".brand .logo-row") || document.querySelector(".brand");
  if(zone){
    zone.style.cursor = "pointer";
    zone.style.webkitTapHighlightColor = "transparent";
    zone.style.userSelect = "none";
    zone.addEventListener("pointerup", countTeacherTap);
  }
  const footer = document.querySelector("footer.credit");
  if(footer){
    let holdTimer = null;
    const startHold = ()=>{ holdTimer = setTimeout(unlockTeacher, 1500); };
    const cancelHold = ()=>{ clearTimeout(holdTimer); };
    footer.style.userSelect = "none";
    footer.addEventListener("pointerdown", startHold);
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>footer.addEventListener(ev, cancelHold));
  }
  const checkHash = ()=>{
    if(location.hash.toLowerCase() === "#teacher") unlockTeacher();
  };
  window.addEventListener("hashchange", checkHash);
  checkHash();
}

function summarizeStudents(rows){
  const byStudent = {};
  rows.forEach(r=>{
    const key = (r.studentEmail || "unknown").toLowerCase();
    if(!byStudent[key]){
      byStudent[key] = {email: r.studentEmail || "unknown", name: r.studentName || "", attempts: [], weeks: {}};
    }
    const s = byStudent[key];
    if(r.studentName) s.name = r.studentName;
    s.attempts.push(r);
    (r.weekBreakdown || []).forEach(w=>{
      if(!s.weeks[w.week]) s.weeks[w.week] = {correct:0, total:0};
      s.weeks[w.week].correct += w.correct || 0;
      s.weeks[w.week].total += w.total || 0;
    });
  });
  return Object.values(byStudent).map(s=>{
    s.attempts.sort((a,b)=> b.timestamp - a.timestamp);
    const best = type => {
      const list = s.attempts.filter(a=>a.testType === type);
      return list.length ? Math.max(...list.map(a=>a.pct || 0)) : null;
    };
    s.bestPre = best("pretest");
    s.bestPost = best("posttest");
    s.lastAt = s.attempts.length ? s.attempts[0].timestamp : 0;
    return s;
  }).sort((a,b)=> b.lastAt - a.lastAt);
}
function teacherCsv(rows){
  const head = ["Student","Email","Test","Weeks","Correct","Total","Percent","Class","Date"];
  const lines = rows.map(r=>[
    r.studentName || "", r.studentEmail || "", r.testType || "",
    weekLabels(r.weeks || []) || "Weeks 1 & 2",
    r.correct, r.total, r.pct, r.classId || "", fmtDate(r.timestamp)
  ]);
  return [head].concat(lines)
    .map(cols => cols.map(v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`).join(","))
    .join("\n");
}

async function renderTeacherDashboard(){
  bg();
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading student results...</p></div>`;
  let rows = [];
  let loadError = "";
  try{
    const snap = await db.collection("attempts").get();
    snap.forEach(d => rows.push({id: d.id, ...d.data()}));
    rows.sort((a,b)=> b.timestamp - a.timestamp);
  }catch(e){
    console.error(e);
    loadError = "Couldn't load results. Check your connection or Firestore rules.";
  }

  const query = (state.teacherQuery || "").trim().toLowerCase();
  const students = summarizeStudents(rows).filter(s=>
    !query || s.name.toLowerCase().includes(query) || s.email.toLowerCase().includes(query)
  );
  const totalAttempts = rows.length;
  const avg = totalAttempts ? Math.round(rows.reduce((t,r)=>t + (r.pct||0), 0) / totalAttempts) : 0;
  const weekAverage = key => {
    const parts = rows.flatMap(r=>(r.weekBreakdown||[]).filter(w=>w.week === key));
    const total = parts.reduce((t,w)=>t + (w.total||0), 0);
    const correct = parts.reduce((t,w)=>t + (w.correct||0), 0);
    return total ? Math.round(correct/total*100) : null;
  };

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Teacher View &middot; Second Term</div>
      </div>
      ${loadError ? `<p class="error-note">${escapeHtml(loadError)}</p>` : ``}
      <div class="assign-box">
        <div class="al-row"><span class="al-label">Students</span><span class="al-value">${summarizeStudents(rows).length}</span></div>
        <div class="al-row"><span class="al-label">Total Attempts</span><span class="al-value">${totalAttempts}</span></div>
        <div class="al-row"><span class="al-label">Overall Average</span><span class="al-value">${avg}%</span></div>
        ${TERM_WEEKS.map(w=>{
          const pct = weekAverage(w.key);
          return `<div class="al-row"><span class="al-label">${w.label} Average</span><span class="al-value">${pct === null ? "&mdash;" : pct + "%"}</span></div>`;
        }).join("")}
      </div>
      <input type="text" id="teacherSearch" placeholder="Search name or email" value="${escapeHtml(state.teacherQuery || "")}">
      ${students.length === 0 ? `<p class="empty-note">No results found.</p>` : `
        <div style="overflow-x:auto;">
          <table class="results-table">
            <thead><tr><th>Student</th><th>Attempts</th><th>Best Pre</th><th>Best Post</th><th>Last Attempt</th></tr></thead>
            <tbody>
              ${students.map(s=>`
                <tr class="teacher-row" data-email="${escapeHtml(s.email)}">
                  <td>${escapeHtml(s.name || s.email)}<br><span class="fine-print">${escapeHtml(s.email)}</span></td>
                  <td>${s.attempts.length}</td>
                  <td>${s.bestPre === null ? "&mdash;" : s.bestPre + "%"}</td>
                  <td>${s.bestPost === null ? "&mdash;" : s.bestPost + "%"}</td>
                  <td>${fmtDate(s.lastAt)}</td>
                </tr>
                ${state.teacherExpanded === s.email ? `
                  <tr><td colspan="5">
                    <div class="fine-print" style="text-align:left;">
                      ${TERM_WEEKS.map(w=>{
                        const v = s.weeks[w.key];
                        const pct = v && v.total ? Math.round(v.correct/v.total*100) : null;
                        return `<b>${w.label}:</b> ${pct === null ? "no data" : pct + "% (" + v.correct + "/" + v.total + ")"}`;
                      }).join(" &middot; ")}
                    </div>
                    ${s.attempts.map(a=>`<div class="fine-print" style="text-align:left;">${a.testType === "pretest" ? "PRE" : "POST"} &middot; ${(a.weeks && a.weeks.length) ? weekLabels(a.weeks) : "Weeks 1 & 2"} &middot; ${a.correct}/${a.total} (${a.pct}%) &middot; ${fmtDate(a.timestamp)}${a.id ? ` &middot; <a href="#" class="delete-attempt" data-id="${escapeHtml(a.id)}">delete</a>` : ``}</div>`).join("")}
                  </td></tr>
                ` : ``}
              `).join("")}
            </tbody>
          </table>
          <p class="fine-print" style="text-align:left;">Tap a student to view their weekly breakdown.</p>
        </div>
      `}
      <button class="primary-btn ghost" id="exportBtn" style="margin-top:6px;">Download CSV</button>
      <button class="primary-btn ghost" id="refreshBtn" style="margin-top:10px;">Refresh</button>
      <button class="primary-btn ghost" id="lockBtn" style="margin-top:10px;">Lock Teacher View</button>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen = "home"; route(); });
  document.getElementById("refreshBtn").addEventListener("click", ()=>route());
  document.getElementById("lockBtn").addEventListener("click", ()=>{
    try{ sessionStorage.removeItem("tq_teacher"); }catch(e){}
    state.screen = "home"; route();
  });
  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const blob = new Blob([teacherCsv(rows)], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "tap-quiz-term2-results.csv";
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  });
  const search = document.getElementById("teacherSearch");
  if(search){
    search.addEventListener("input", ()=>{
      state.teacherQuery = search.value;
      clearTimeout(state.teacherSearchTimer);
      state.teacherSearchTimer = setTimeout(()=>route(), 300);
    });
  }
  document.querySelectorAll(".delete-attempt").forEach(link=>{
    link.addEventListener("click", async (e)=>{
      e.preventDefault();
      e.stopPropagation();
      if(!confirm("Delete this attempt permanently?")) return;
      try{
        await db.collection("attempts").doc(link.dataset.id).delete();
      }catch(err){
        console.error(err);
        alert("Couldn't delete attempt. Check your Firestore rules.");
      }
      route();
    });
  });
  document.querySelectorAll(".teacher-row").forEach(row=>{
    row.style.cursor = "pointer";
    row.addEventListener("click", ()=>{
      const email = row.dataset.email;
      state.teacherExpanded = state.teacherExpanded === email ? null : email;
      route();
    });
  });
}

initTheme();
registerTeacherUnlock();
route();
</script>
</body>
</html>
