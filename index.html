<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap-Quiz for Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  try{
    if(window.localStorage.getItem("tq_theme") === "dark"){
      document.documentElement.dataset.theme = "dark";
    }
  }catch(e){}
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F3F1FB; --surface:#FFFFFF; --ink:#211C4E; --ink-soft:#5A5480; --border:#DDD7F2;
    --math:#F0A202; --math-soft:#FCEACB;
    --english:#E4572E; --english-soft:#FBE1D9; --accent:var(--ink); --accent-soft:#E7E3F8;
    --good:#1B998B; --bad:#E4572E; --glow-2:#ECE3FB; --button-bg:#211C4E; --button-ink:#FFFFFF;
    --radius:18px; --shadow:0 12px 30px -14px rgba(33,28,78,0.35);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#11131F; --surface:#1B1E2B; --ink:#F5F2FF; --ink-soft:#B6AFD0; --border:#3B3658;
    --accent:var(--ink); --accent-soft:#2A2644; --glow-2:#2A2441;
    --math-soft:#493818; --english-soft:#45221D; --button-bg:#EEEAFE; --button-ink:#17142B;
    --shadow:0 12px 30px -14px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, var(--glow-2) 0%, transparent 40%), var(--paper);
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:28px 16px 60px; transition:background 0.5s ease;
  }
  .wrap{ width:100%; max-width:560px; }
  .brand{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .brand .logo-row{ display:flex; align-items:center; gap:10px; }
  .brand img.logo{ width:46px; height:46px; border-radius:12px; object-fit:cover; box-shadow:var(--shadow); }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:clamp(19px,5vw,24px); font-weight:700; letter-spacing:-0.02em; margin:0; line-height:1.05; }
  .brand h1 span{ color:var(--english); }
  .brand .tag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:0.03em; text-align:right; line-height:1.4; }
  .brand-actions{ display:flex; align-items:center; gap:10px; }
  .theme-toggle{ border:1.5px solid var(--border); background:var(--surface); color:var(--ink); border-radius:100px; padding:8px 10px; cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .theme-toggle:hover{ border-color:var(--accent); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; min-height:120px; }

  .navbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .navbar .who{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .navbar .who b{ color:var(--ink); }
  .pill-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--ink); border:none; border-radius:100px; padding:8px 12px; cursor:pointer; }
  .pill-btn.outline{ background:transparent; border:1.5px solid var(--border); }

  .subject-strip{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .subject-chip{ flex:1; min-width:90px; padding:10px 8px; border-radius:12px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.03em; cursor:pointer; border:1.5px solid transparent; }
  .subject-chip.math{ background:var(--math-soft); color:#7A5300; }
  .subject-chip.english{ background:var(--english-soft); color:#8E2E15; }
  .subject-chip.selected{ border-color:currentColor; }

  .field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:0 0 8px 2px; }

  input[type="text"], input[type="email"]{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
    outline:none; margin-bottom:16px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .checkbox-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .checkbox-item{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--paper); }
  .checkbox-item.checked{ border-color:var(--accent); background:var(--accent-soft); }
  .checkbox-item input{ width:auto; margin:0; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .mode-btn{ cursor:pointer; border:1.5px solid var(--border); background:var(--paper); border-radius:14px; padding:16px 10px; text-align:left; transition:all .15s ease; }
  .mode-btn:hover{ border-color:var(--accent); }
  .mode-btn .mtitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; display:block; margin-bottom:4px; }
  .mode-btn .msub{ font-size:11.5px; color:var(--ink-soft); line-height:1.35; display:block; }
  .mode-btn.locked{ opacity:0.45; cursor:not-allowed; }

  .primary-btn{ width:100%; border:none; cursor:pointer; background:var(--button-bg); color:var(--button-ink); font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.01em; padding:15px 18px; border-radius:14px; transition:transform .12s ease, opacity .15s ease; margin-bottom:0; }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }

  .fine-print{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.5; }
  .link-btn{ background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .error-note{ font-size:12.5px; color:var(--bad); margin:-8px 0 14px; }

  .hero{ text-align:center; padding:6px 4px 20px; }
  .hero .kicker{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:10px; }
  .hero h2{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; line-height:1.25; margin:0 0 12px; }
  .hero p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 20px; }
  .feature-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; text-align:left; }
  .feature-item{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-soft); }
  .feature-item b{ color:var(--ink); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }

  .home-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .home-card{ border:1.5px solid var(--border); border-radius:16px; padding:18px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; display:flex; align-items:center; gap:14px; }
  .home-card:hover{ border-color:var(--accent); }
  .home-card .hicon{ font-size:22px; }
  .home-card .htitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:2px; }
  .home-card .hsub{ font-size:12px; color:var(--ink-soft); }

  .class-card{ border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; }
  .class-card:hover{ border-color:var(--accent); }
  .class-card .ctitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .class-card .cmeta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }

  .quiz-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .subj-pill{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.04em; padding:7px 12px; border-radius:100px; color:#fff; }
  .score-chip{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.03em; background:var(--button-bg); color:var(--button-ink); padding:7px 12px; border-radius:100px; }
  .track{ display:flex; gap:4px; margin-bottom:20px; }
  .track-seg{ flex:1; height:6px; border-radius:4px; background:var(--border); overflow:hidden; }
  .track-seg i{ display:block; height:100%; border-radius:4px; }
  .qhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .qcount{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .qtag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600; letter-spacing:0.03em; padding:3px 8px; border-radius:100px; background:var(--accent-soft); color:var(--ink); margin-left:8px; vertical-align:middle; }
  .timer-ring{ position:relative; width:40px; height:40px; }
  .timer-ring svg{ transform:rotate(-90deg); }
  .timer-ring .tnum{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; }
  .qtext{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:600; line-height:1.4; margin:4px 0 20px; min-height:52px; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{ display:flex; align-items:center; gap:12px; text-align:left; padding:13px 14px; border-radius:13px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; font-size:14.5px; color:var(--ink); transition:all .12s ease; }
  .choice:hover{ border-color:var(--accent); }
  .choice .klabel{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px; width:22px; height:22px; border-radius:7px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .choice.correct{ background:#E4F5F1; border-color:var(--good); color:#0E5C52; }
  .choice.correct .klabel{ background:var(--good); border-color:var(--good); color:#fff; }
  .choice.wrong{ background:#FCE7E1; border-color:var(--bad); color:#8E2E15; }
  .choice.wrong .klabel{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .choice.disabled{ pointer-events:none; }
  .choice.dim{ opacity:0.45; }

  .transition-screen{ min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; }
  .transition-screen .tsub{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; }
  .transition-screen .tnext{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:0.04em; }
  .transition-dot{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }

  .result-hero{ text-align:center; padding:6px 0 22px; }
  .result-hero .pct{ font-family:'Space Grotesk', sans-serif; font-size:56px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .result-hero .frac{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); margin-top:8px; }
  .result-hero .msg{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600; margin-top:10px; }
  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  table.results-table{ width:100%; border-collapse:collapse; font-size:12px; }
  table.results-table th, table.results-table td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  table.results-table th{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); }
  .tag-pre{ background:var(--math-soft); color:#7A5300; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }
  .tag-post{ background:var(--english-soft); color:#8E2E15; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }

  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .reviewer-box{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; white-space:pre-wrap; font-size:13.5px; line-height:1.65; }
  .reviewer-intro{ color:var(--ink-soft); font-size:12.5px; line-height:1.55; margin:-4px 0 14px; }
  .reviewer-week-tabs{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:14px; }
  .reviewer-week-tab{ border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:12px; padding:10px 7px; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; line-height:1.25; }
  .reviewer-week-tab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
  .reviewer-reading{ background:#FBF8F0; border:1px solid #E8E0D0; color:#343747; border-radius:16px; padding:20px 18px; margin-bottom:16px; font-size:16px; line-height:1.85; letter-spacing:.008em; box-shadow:0 5px 18px -16px rgba(50,45,35,.45); }
  .reviewer-reading h3{ color:#292B39; font-family:'Space Grotesk',sans-serif; font-size:20px; line-height:1.25; margin:0 0 10px; }
  .reviewer-reading .reading-lead{ color:#626579; font-size:14px; line-height:1.6; margin:0 0 16px; }
  .reviewer-reading .reading-body{ white-space:pre-wrap; }
  .study-label{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin:4px 0 6px; }
  .formula-card{ background:#F1EBDD; border:1.5px solid #D8C9AA; border-radius:13px; padding:14px; margin:0 0 18px; }
  .formula-card .formula-label{ color:#756345; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin-bottom:7px; }
  .formula-card .formula-text{ color:#27283A; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; line-height:1.65; white-space:pre-wrap; }
  .formula-card .formula-meaning{ color:#5E594E; font-size:13.5px; line-height:1.55; margin-top:8px; }
  .reviewer-reading .reading-tip{ border-left:3px solid var(--math); background:#F3EEDC; color:#514A3D; border-radius:0 10px 10px 0; padding:10px 12px; margin-top:18px; font-size:14px; line-height:1.6; }
  html[data-theme="dark"] .reviewer-reading{ background:#20231F; border-color:#454637; color:#E8E3D5; box-shadow:none; }
  html[data-theme="dark"] .reviewer-reading h3{ color:#FFF8E7; }
  html[data-theme="dark"] .reviewer-reading .reading-lead{ color:#C5C0B1; }
  html[data-theme="dark"] .formula-card{ background:#343226; border-color:#62583B; }
  html[data-theme="dark"] .formula-card .formula-label{ color:#D7C38C; }
  html[data-theme="dark"] .formula-card .formula-text{ color:#FFF4D2; }
  html[data-theme="dark"] .formula-card .formula-meaning{ color:#D6CFBA; }
  html[data-theme="dark"] .reviewer-reading .reading-tip{ background:#353522; color:#E8E3D5; }
  .learning-panel{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .learning-panel .lp-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .learning-panel .lp-sub{ color:var(--ink-soft); font-size:12px; line-height:1.45; margin-bottom:12px; }
  .mastery-row{ margin:10px 0; }
  .mastery-row .mr-top{ display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:5px; }
  .mastery-row .mr-top span:last-child{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:10.5px; }
  .mastery-track{ height:7px; border-radius:5px; background:var(--surface); overflow:hidden; }
  .mastery-track i{ display:block; height:100%; border-radius:5px; background:var(--accent); }

  .tab-row{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn{ flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; padding:8px 12px; border-radius:100px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink-soft); }
  .tab-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }

  .review-item{ border:1.5px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  .review-item .ri-q{ font-weight:600; font-size:14px; margin-bottom:10px; }
  .review-item .ri-c{ padding:9px 12px; border-radius:10px; font-size:13px; margin-bottom:6px; background:var(--paper); }
  .review-item .ri-c.correct{ background:#E4F5F1; color:#0E5C52; font-weight:600; }
  .review-item .ri-c.wrong{ background:#FCE7E1; color:#8E2E15; font-weight:600; }

  .assign-box{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .assign-box .al-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); }
  .assign-box .al-row:last-child{ border-bottom:none; }
  .assign-box .al-label{ color:var(--ink-soft); }
  .assign-box .al-value{ font-weight:600; }
  .saved-class-section{ margin-top:20px; }
  .saved-class-card{ width:100%; text-align:left; }
  .saved-class-card .cmeta{ line-height:1.5; }

  .float-pt{ position:fixed; pointer-events:none; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; animation:floatUp .8s ease forwards; z-index:50; }
  @keyframes floatUp{ 0%{ opacity:1; transform:translateY(0);} 100%{ opacity:0; transform:translateY(-38px);} }
  .fade-in{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  html[data-theme="dark"] .choice.correct,
  html[data-theme="dark"] .review-item .ri-c.correct{ background:#173B37; color:#8BE6D5; }
  html[data-theme="dark"] .choice.wrong,
  html[data-theme="dark"] .review-item .ri-c.wrong{ background:#48251F; color:#FFB3A3; }
  html[data-theme="dark"] .subject-chip.math,
  html[data-theme="dark"] .tag-pre{ color:#FFD27A; }
  html[data-theme="dark"] .subject-chip.english,
  html[data-theme="dark"] .tag-post{ color:#FFB09B; }

  footer.credit{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:18px; font-family:'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="wrap">

  math: `GENERAL MATHEMATICS — QUICK REVIEWER

BUSINESS & FINANCE
• Wage = hourly rate x hours worked. Overtime is usually 1.5x the regular rate.
• Percentage change = (new value - old value) / old value x 100
• VAT in the Philippines is typically 12% added to the selling price.
• Gross pay = regular pay + overtime pay + benefits; net pay = gross pay - deductions.
• Simple interest: I = Prt; maturity value: A = P + I.
• Discount = original price x discount rate; sale price = original price - discount.
• Markup = cost x markup rate; selling price = cost + markup.

SEQUENCES & SERIES
• Arithmetic sequence: a(n) = a1 + (n - 1)d
• Arithmetic series sum: S(n) = n/2 x (a1 + a(n))
• Geometric sequence: a(n) = a1 x r^(n-1)
• Arithmetic nth term: a(n) = a1 + (n - 1)d; arithmetic sum: S(n) = n/2[2a1 + (n - 1)d].
• Geometric sum: S(n) = a1(r^n - 1)/(r - 1), when r ≠ 1.
• A sequence is a list of terms; a series is the sum of terms.
• Fibonacci sequence: each term is the sum of the two preceding terms.

FUNCTIONS & GRAPHS
• A function assigns exactly one output to each input (vertical line test).
• Linear: f(x) = mx + b. Quadratic: f(x) = ax^2 + bx + c (graph is a parabola).
• A rational function is undefined wherever its denominator equals 0.
• Slope: m = (y2 - y1)/(x2 - x1); point-slope form: y - y1 = m(x - x1).
• Composition: (f ∘ g)(x) = f(g(x)); inverse functions undo one another.
• Absolute value graphs have a V-shape; square-root and cube-root graphs have restricted shapes.
• Piecewise functions use different formulas on specified intervals.

MEASUREMENT & TRIGONOMETRY
• SOH-CAH-TOA: sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent.
• Area of a triangle (SAS): Area = 1/2 x a x b x sin(C)
• Rectangle area = lw; triangle area = 1/2bh; circle area = πr²; circumference = 2πr.
• Prism/cylinder volume = base area x height; pyramid/cone volume = 1/3(base area x height).
• Sphere volume = 4/3πr³; sphere surface area = 4πr².
• Pythagorean theorem: a² + b² = c² for a right triangle.
• Convert units by multiplying by a conversion factor equal to 1; keep units in every step.

STATISTICS
• Mean = sum of values / number of values.
• A p-value below your significance level means you reject the null hypothesis.
• Median is the middle value; mode is the most frequent value; range = maximum - minimum.
• Population describes the whole group; sample describes part of the group.
• Standard deviation measures spread around the mean; a larger value means more variability.
• Correlation describes association, but correlation alone does not prove causation.

COMPOUND INTEREST & ANNUITIES
• Compound interest: A = P(1 + r/n)^(nt)
• An annuity is a series of equal payments made at regular intervals.
• Gross pay is total earnings before deductions; net pay is what remains after deductions.
• For a geometric series, the common ratio is the multiplier between consecutive terms.
• Measurement work requires choosing appropriate units, converting consistently, and checking scale.
• Piecewise functions use different rules on different intervals.

LOGIC
• A proposition is a declarative statement that is true or false, never a question or command.
• In financial problems, identify the rate, time period, principal, and payment frequency before calculating.`,

  science: `GENERAL SCIENCE — QUICK REVIEWER

PHYSICS IN DAILY LIFE
• Simple machines (levers, pulleys, inclined planes) reduce the force needed to do work.
• Pascal's Principle: pressure applied to a fluid is transmitted equally in all directions (used in hydraulic systems).
• Archimedes' Principle: an object floats if it displaces a weight of fluid equal to its own weight.
• Avoid overloaded outlets and damaged wiring — both raise the risk of electrical hazards.
• Work: W = Fd; power: P = W/t; efficiency = useful output/input x 100%.
• Pressure: P = F/A. Hydraulic systems transmit pressure through a confined fluid.
• Density: ρ = m/V. An object is more likely to float when its average density is less than the fluid's density.
• Speed = distance/time; velocity includes direction; acceleration = change in velocity/time.
• Kinetic energy: KE = 1/2mv²; gravitational potential energy: PE = mgh.

CHEMISTRY IN EVERYDAY LIFE
• Common reaction types: decomposition, acid + carbonate, acid + metal, and combustion.
• Photosynthesis: 6CO2 + 6H2O + light -> C6H12O6 + 6O2
• Cellular respiration: C6H12O6 + 6O2 -> 6CO2 + 6H2O + energy
• Check DTI, FDA, and DENR guidance before using or disposing of household chemicals.
• Acids have pH below 7; bases have pH above 7; a neutral solution has pH 7.
• Conservation of mass means atoms are rearranged, not created or destroyed, in a reaction.
• Combustion commonly requires fuel and oxygen and releases energy.
• Never mix household cleaners unless the label explicitly says it is safe.

BIOLOGY & ECOSYSTEMS
• Cells convert nutrients into usable energy to sustain life.
• Organ systems work together — e.g. the nervous and endocrine systems regulate body temperature.
• Climate change affects Philippine ecosystems and biodiversity, often through rising heat and shifting rainfall.
• Levels of organization: cell → tissue → organ → organ system → organism.
• Producers capture energy; consumers obtain energy by feeding; decomposers recycle matter.
• Homeostasis is the maintenance of stable internal conditions.
• Photosynthesis stores energy in glucose; cellular respiration releases usable energy from glucose.
• Work is done when a force moves an object; machines trade force for distance or direction.
• Light can be reflected, refracted, or absorbed; sound requires a medium to travel.
• Chemical labels communicate hazards, ingredients, safe handling, and disposal information.
• Energy can be transferred or transformed, but it is conserved.

EARTH & SPACE SCIENCE
• Earth supports life because of its distance from the sun, its atmosphere, and greenhouse gases that regulate temperature.
• The Philippine archipelago was shaped by tectonic and volcanic activity.
• PAGASA monitors weather and hydrometeorological hazards; PHIVOLCS monitors volcanic and seismic activity.
• Weather describes short-term atmospheric conditions; climate describes longer-term patterns.
• Reduce electrical risk by using properly rated equipment and avoiding damaged wires or overloaded outlets.`,

  english: `EFFECTIVE COMMUNICATION — QUICK REVIEWER

THE COMMUNICATION PROCESS
• Key elements: sender, message, channel, receiver, feedback, and context.
• Noise is anything that disrupts the message — physical, language, emotional, or cultural barriers.
• Encoding turns an idea into a message; decoding is the receiver's interpretation.
• Feedback shows whether the message was understood and lets the sender adjust.
• Context includes the situation, relationship, culture, time, place, and purpose.

FOUR CONTEXTS OF COMMUNICATION
• Personal & Interpersonal: everyday conversations, journaling, texts, resolving conflict respectfully.
• Social & Cultural: public forums, advocacy posts, respecting diverse cultural norms and group dynamics.
• Academic & Training: presentations, research reports, proper citations, discipline-specific vocabulary.
• Professional & Work: resumes, emails, meetings — clear, concise, and appropriately formal.
• Intrapersonal communication is communication within oneself, including reflection and goal-setting.
• Intercultural communication requires openness, sensitivity to norms, and avoidance of stereotypes.

VERBAL & NON-VERBAL STRATEGIES
• Politeness markers and turn-taking signals (topic nomination, back-channeling) keep conversations respectful.
• Non-verbal cues — tone, eye contact, posture — strongly affect how a message is received.
• Active listening includes attention, clarification, paraphrasing, and an appropriate response.
• Assertive communication expresses needs respectfully; it is neither passive nor aggressive.
• Tone is the attitude conveyed by language and delivery; it should match audience and purpose.

WRITTEN COMMUNICATION
• Good paragraphs have one main idea supported by clear, relevant details.
• Match tone and formality to your audience and purpose — a text to a friend is not a professional email.
• Academic and technical texts use structure, precise language, evidence, and appropriate terminology.
• Multimodal communication combines modes such as words, images, charts, sound, or video.
• Critical listening and reading involve checking purpose, evidence, assumptions, and meaning.
• Summarizing keeps the central ideas in a shorter form; paraphrasing restates them in your own words.
• Coherence means ideas connect logically; cohesion uses transitions and clear references.
• Revise for purpose, organization, clarity, correctness, inclusivity, and ethical use of sources.

  second: {
     math: "GENERAL MATHEMATICS — SECOND TERM, WEEKS 1–3 REVIEWER\n\nPIECEWISE FUNCTIONS\n• A piecewise function uses different formulas on specified intervals or conditions.\n• Use piecewise rules for practical situations such as fare rates, purchasing discounts, and income-tax brackets.\n• Identify the input interval first, then apply only the rule assigned to that interval.\n• Pay close attention to boundary symbols such as <, ≤, >, and ≥ so the correct rule is used.\n• Write the domain conditions beside each rule and evaluate one interval at a time.\n• Check whether the result is reasonable for the situation and the units used.\n\nDATA AND MEASUREMENT\n• Qualitative data describe categories; quantitative data are numerical.\n• Discrete data are countable; continuous data can take values within a range.\n• Nominal data are labels, ordinal data have an order, interval data have equal differences without a true zero, and ratio data have equal differences with a meaningful zero.\n• Mean = sum of values / number of values. Median is the middle ordered value. Mode is the most frequent value.\n• Range = maximum − minimum. Variability describes how spread out values are; variance and standard deviation quantify spread.\n• The mean is sensitive to outliers, while the median is often more representative of strongly skewed data.\n• Choose measures based on the data type and purpose. Calculators, spreadsheets, Jamovi, and other tools can calculate measures, but the results must still be interpreted.\n• A good interpretation names the measure, describes the pattern, and connects the result to the original context.\n\nTRIGONOMETRY AND TRIANGLES\n• SOH-CAH-TOA: sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent.\n• The Pythagorean theorem is a² + b² = c² for a right triangle.\n• An angle of elevation is measured upward from a horizontal line; an angle of depression is measured downward.\n• Bearings describe direction in navigation and should be read with a clear reference direction, usually clockwise from north.\n• For an oblique triangle, Heron's Formula uses A = √[s(s−a)(s−b)(s−c)], where s = (a+b+c)/2.\n• When two sides and their included angle are known, use A = 1/2 ab sin(C).\n• Draw and label the figure, select the appropriate ratio or formula, keep units consistent, and check whether the answer fits the real situation.\n• In a right triangle, the hypotenuse is opposite the right angle and is always the longest side.\n• Report measured answers with appropriate units and a sensible degree of rounding.",

s logically; transitions and clear references create cohesion.\n• Introductions establish context and purpose, body sections develop ideas with evidence, and conclusions synthesize the main points.\n\nETHICS AND REFLECTION\n• Cite sources and represent another person's words and ideas honestly. Presenting borrowed work as one's own is plagiarism.\n• A reference list helps readers locate the sources used in an academic or technical text.\n• AI assistance and borrowed ideas should be acknowledged or declared according to the required citation practice.\n• Intellectual integrity means not inventing evidence, altering results dishonestly, or hiding the source of information.\n• Give feedback about content, structure, and language in a specific, respectful, useful way.\n• Reflect after academic or technical communication: identify strengths, areas for growth, and ways to improve future performance."

    math: "\n\nDETAILED STUDY NOTES AND PRACTICE GUIDE\n\n1. FUNCTIONS, RELATIONS, AND REPRESENTATIONS\n• A relation pairs inputs with outputs. A relation is a function when every input has exactly one output.\n• The domain is the set of allowed input values; the range is the set of resulting output values.\n• Use the vertical-line test on a graph: if any vertical line touches the graph more than once, the relation is not a function.\n• Function notation f(x) means the output of function f for input x. To evaluate f(3), substitute 3 for every x in the rule.\n• A function may be represented by a table, ordered pairs, mapping diagram, graph, equation, or verbal rule. Check that all representations describe the same input-output relationship.\n• In a piecewise function, identify the condition first. Do not combine formulas from different intervals.\n• At an endpoint, use the inequality symbol exactly as written. A closed dot usually represents an included endpoint; an open dot represents an excluded endpoint.\n• When graphing a piecewise function, show each rule only on its assigned interval and label important endpoints.\n\n2. LINEAR, QUADRATIC, AND RATIONAL FUNCTIONS\n• A linear function has a constant rate of change and can be written as f(x) = mx + b. The slope m measures vertical change divided by horizontal change, and b is the y-intercept.\n• For two points, slope m = (y₂ − y₁)/(x₂ − x₁). A zero denominator means the line is vertical and has undefined slope.\n• A quadratic function has the form f(x) = ax² + bx + c. Its graph is a parabola; a > 0 opens upward and a < 0 opens downward.\n• Vertex form is f(x) = a(x − h)² + k. The vertex is (h,k), and the axis of symmetry is x = h.\n• A rational function is a quotient of polynomials. Its domain excludes values that make the denominator zero.\n• Before simplifying a rational expression, factor the numerator and denominator. A cancelled factor still creates a restriction from the original denominator.\n• To find an x-intercept, set f(x) = 0. To find a y-intercept, evaluate f(0), if 0 is in the domain.\n\n3. OPERATIONS, COMPOSITION, AND INVERSE FUNCTIONS\n• Add, subtract, multiply, or divide functions by combining their outputs. For division, exclude inputs that make the divisor zero.\n• Composition is written (f ∘ g)(x) = f(g(x)); evaluate the inside function first, then use that result as the input of the outside function.\n• To find an inverse, write y = f(x), interchange x and y, then solve for y. An inverse exists as a function when the original function is one-to-one on its domain.\n• The graphs of f and f-inverse are reflections across y = x. The domain and range switch places.\n• Always verify a simplified or inverse result by substituting it back into the original rule.\n\n4. EXPONENTIALS, LOGARITHMS, AND EQUATIONS\n• An exponential function has the form f(x) = abˣ, where a is the initial value and b is the growth or decay factor.\n• If b > 1, the function models growth; if 0 < b < 1, it models decay. The base must be positive and not equal to 1.\n• A logarithm answers the question: what exponent is needed? log_b(x) = y means bʸ = x.\n• Important identities include log_b(MN) = log_b(M) + log_b(N), log_b(M/N) = log_b(M) − log_b(N), and log_b(Mᵖ) = p log_b(M).\n• The argument of a logarithm must be positive. Check this restriction after solving a logarithmic equation.\n• For exponential equations with the same base, equate the exponents. Otherwise, use a logarithm and report a reasonable approximation when needed.\n\n5. SEQUENCES, SERIES, AND ALGEBRAIC PROBLEM SOLVING\n• An arithmetic sequence has a common difference d. Its nth term is aₙ = a₁ + (n − 1)d.\n• A geometric sequence has a common ratio r. Its nth term is aₙ = a₁rⁿ⁻¹.\n• An arithmetic series adds the terms of an arithmetic sequence: Sₙ = n/2[2a₁ + (n − 1)d].\n• When solving equations, perform the same operation on both sides and simplify one step at a time.\n• For inequalities, reverse the inequality sign only when multiplying or dividing by a negative number.\n• For systems of equations, substitution or elimination can be used. Check the ordered pair in both original equations.\n• For powers and radicals, use exponent laws carefully: xᵐxⁿ = xᵐ⁺ⁿ, xᵐ/xⁿ = xᵐ⁻ⁿ, and (xᵐ)ⁿ = xᵐⁿ.\n\n6. DATA, VARIABLES, AND STATISTICAL INTERPRETATION\n• A population is the complete group being studied; a sample is a selected part of that population.\n• A parameter describes a population, while a statistic describes a sample.\n• A representative sample should reflect the important characteristics of the population. Convenience sampling may be quick but can introduce bias.\n• Qualitative variables describe qualities or categories. Quantitative variables are numerical; discrete variables are countable, while continuous variables are measured.\n• Nominal data are labels, ordinal data have meaningful order, interval data have equal intervals but no true zero, and ratio data have equal intervals and a meaningful zero.\n• To find the mean, add all values and divide by the number of values. Put the data in order before finding the median.\n• For an even number of values, the median is the average of the two middle values. The mode is the most frequent value and may be more than one value.\n• Range is maximum minus minimum. Variance and standard deviation describe spread around the mean; a larger standard deviation means more variability.\n• Outliers can pull the mean toward an extreme value. Compare the mean and median before deciding which better represents the center.\n• A statistical conclusion should state the pattern, cite the measure or graph used, and explain what it means in context.\n\n7. TRIGONOMETRY AND TRIANGLE SOLVING\n• In a right triangle, identify the reference angle before naming opposite, adjacent, and hypotenuse.\n• SOH-CAH-TOA connects the angle and side lengths: sine = opposite/hypotenuse, cosine = adjacent/hypotenuse, tangent = opposite/adjacent.\n• Use inverse trigonometric functions to find an angle. Set the calculator to degree mode when the problem uses degrees.\n• The Pythagorean theorem a² + b² = c² applies only to right triangles, with c opposite the right angle.\n• An angle of elevation is measured upward from the horizontal; an angle of depression is measured downward from the horizontal.\n• A bearing is a direction measured from a reference such as north. Draw the compass direction before using a triangle formula.\n• For an oblique triangle, identify the known sides and angles before choosing a formula. Heron's Formula is useful when all three sides are known.\n• Area can be found with A = 1/2 ab sin(C) when two sides and their included angle are known.\n• Round only at the end. Label the final answer with units and check whether the size of the answer is reasonable.\n\n8. GENERAL CHECKLIST FOR SOLVING\n• Read the question twice and identify what is given and what must be found.\n• Write the relevant definition, formula, or condition before substituting values.\n• Keep exact values during the working process whenever possible.\n• Check restrictions, units, signs, endpoints, and whether the final answer fits the original question.\n• If an answer is wrong, locate the first step where the work changed from a valid expression to an invalid one. Correcting that step is more useful than memorizing the final answer.",
    english: "\n\nDETAILED STUDY NOTES AND COMMUNICATION GUIDE\n\n1. THE COMMUNICATION PROCESS\n• Communication involves a sender, message, channel, receiver, feedback, context, and possible noise or barriers.\n• Encoding is turning an idea into words, symbols, images, gestures, or other signs. Decoding is interpreting the received message.\n• A channel is the medium used to deliver a message, such as speech, email, a report, a presentation, or a visual.\n• Feedback shows whether the message was understood. Effective communicators listen for the response and clarify when meaning is uncertain.\n• Physical, language, emotional, cultural, technological, and information-overload barriers can interfere with meaning.\n• Communication is transactional: participants influence one another, and meaning depends on the situation, relationship, purpose, and shared knowledge.\n\n2. AUDIENCE, PURPOSE, AND CONTEXT\n• Before writing or speaking, identify the audience, purpose, subject, occasion, and expected outcome.\n• Informative communication explains or clarifies. Persuasive communication supports a position and encourages a response. Instructional communication guides a process.\n• Match tone, vocabulary, detail, format, and level of formality to the audience. A message to a close friend should not use the same structure as an email to a professor.\n• Audience awareness includes anticipating what readers know, what they need explained, what concerns they may have, and what action they should take.\n• Use precise words instead of vague expressions. Avoid unnecessary jargon unless the audience understands the specialized terms.\n\n3. ACADEMIC AND TECHNICAL TEXTS\n• Academic and technical texts are formal, organized, evidence-based, and written for a clear discipline or task.\n• A thesis states the central claim or controlling idea. It should be specific enough to guide the entire text.\n• An outline arranges the main points and supporting details before drafting. A useful outline prevents repetition and missing ideas.\n• A paragraph usually has a topic sentence, supporting explanation or evidence, and a concluding or linking sentence.\n• Coherence means ideas make sense together. Cohesion is created through transitions, repeated key terms, pronouns with clear references, and logical connections.\n• Common organizational patterns include cause and effect, comparison and contrast, problem and solution, chronological order, classification, and process.\n• An introduction gives context and purpose. Body sections develop the ideas. A conclusion synthesizes the important points without introducing an unrelated main argument.\n\n4. CRITICAL READING, LISTENING, AND VIEWING\n• Identify the main idea, supporting details, purpose, intended audience, tone, and point of view.\n• Separate a claim from the evidence used to support it. Ask whether the evidence is relevant, sufficient, current, and credible.\n• Notice assumptions, emotionally loaded language, missing information, generalizations, and possible bias.\n• Critical listening requires attention to the speaker's words, tone, emphasis, evidence, and implied meaning. Do not confuse confidence with accuracy.\n• When viewing a visual, read the title, labels, legend, units, scale, source, and date before interpreting the pattern.\n• A conclusion from a chart should describe the visible trend and avoid claiming more than the data support.\n\n5. RESEARCH, SOURCES, AND EVIDENCE\n• Reliable sources identify an author or organization, provide evidence, explain methods when relevant, and can be checked against other sources.\n• Primary sources provide original data or firsthand information. Secondary sources interpret, analyze, or summarize information from other sources.\n• Use evidence that directly supports the claim. A quotation should not be included merely because it sounds impressive.\n• Introduce evidence, present it accurately, and explain how it supports the point. Evidence without explanation does not automatically prove a claim.\n• Keep a source record while researching: author, title, date, publisher or site, page or link, and the ideas or quotations used.\n• Cite borrowed words, facts, ideas, images, tables, and data according to the required style. A reference list helps readers locate the sources.\n\n6. SUMMARY, PARAPHRASE, AND SYNTHESIS\n• A summary reduces a longer text to its main idea and most important supporting points without changing the meaning.\n• A paraphrase restates a specific passage in your own sentence structure and wording while preserving the original meaning and citing the source.\n• Changing only a few words or rearranging the order of a source sentence is not an acceptable paraphrase.\n• Synthesis combines ideas from multiple sources to develop a larger conclusion or explanation. It does not simply list one source after another.\n• Compare sources for agreement, disagreement, scope, methods, and limitations before combining their ideas.\n• Read the original source, set it aside while drafting, then compare your version with the original for accuracy and proper attribution.\n\n7. MULTIMODAL AND VISUAL COMMUNICATION\n• Multimodal communication combines modes such as written language, speech, images, color, layout, sound, movement, charts, and diagrams.\n• Choose a chart based on the message: bar charts compare categories, line graphs show change over time, and tables provide exact values.\n• Every visual needs a clear title and labels. Include units, a useful scale, a legend when necessary, and a source when the data are borrowed.\n• Visual design should support meaning. Use consistent alignment, readable text, sufficient contrast, and a limited number of visual elements.\n• Do not distort a graph through a misleading scale, missing labels, inappropriate 3D effects, or selective data.\n• A presenter should explain what the audience should notice instead of reading every word on a slide.\n\n8. INTERACTION, LISTENING, AND FEEDBACK\n• Active listening includes focusing on the speaker, maintaining appropriate eye contact, noticing non-verbal signals, asking clarifying questions, and responding to the actual message.\n• Respectful feedback describes a specific behavior or part of the work, explains its effect, and offers a useful next step.\n• In collaboration, clarify roles, deadlines, decision rules, and responsibilities. Document important agreements so the group has a shared reference.\n• In a discussion or debate, respond to the claim and evidence rather than attacking the person. Acknowledge a valid point before explaining a different view.\n• Non-verbal communication includes facial expression, posture, gestures, eye contact, distance, and vocal features such as pace and emphasis.\n• Professional communication remains respectful even when the participants disagree or feel pressured.\n\n9. GRAMMAR, STYLE, AND EDITING\n• A complete sentence has a subject and a predicate and expresses a complete thought. Avoid fragments and run-on sentences.\n• Make the subject and verb agree: singular subjects take singular verbs, and plural subjects take plural verbs.\n• Use active voice when you want the actor and action to be direct and clear. Use passive voice when the receiver of the action or the process is more important.\n• Use pronouns with clear antecedents. Check that pronouns agree with the nouns they replace in number and person.\n• Use commas to separate items in a series, introductory elements, and independent clauses joined by a coordinating conjunction.\n• A semicolon can join closely related independent clauses. Do not use it between a dependent clause and an independent clause.\n• Revise for clarity, concision, precise vocabulary, transitions, spelling, capitalization, punctuation, and consistent formatting.\n\n10. ETHICS, AI, AND REFLECTION\n• Plagiarism is presenting another person's words, ideas, structure, or work as your own. It can occur even when the wording has been changed if the source is not acknowledged.\n• Do not invent sources, evidence, quotations, data, or research results. Represent uncertainty honestly.\n• Protect confidential information and obtain permission before sharing another person's private communication or work.\n• AI assistance and borrowed ideas should be acknowledged according to the instructor's or institution's required practice. AI output must be checked because it can be inaccurate, biased, or unsupported.\n• Reflect after communicating: identify what was clear, what confused the audience, what evidence was effective, and what you will change next time.\n• A strong final check asks: Is the message accurate, audience-aware, organized, ethical, accessible, and clear enough to achieve its purpose?\"\n+  }\n+};\n+\n+/* Preset question banks (same content as before, unchanged) */

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function distributeCount(total, n){
  const base = Math.floor(total / n);
  let rem = total - base * n;
  const arr = [];
  for(let i = 0; i < n; i++) arr.push(base + (i < rem ? 1 : 0));
  return shuffle(arr);
}
function subjectLabels(subjArr){
  return (subjArr||[]).map(s=>SUBJECT_META[s] ? SUBJECT_META[s].label : s).join(", ");
}
function termLabels(termArr){
  return "Second Term";
}
function inferSkill(subject, question){
  const q = String(question || "").toLowerCase();
  if(subject === "math"){
    if(/piecewise|function|f\(x\)|interval/.test(q)) return "Functions";
    if(/mean|median|mode|range|standard deviation|data|measurement/.test(q)) return "Statistics";
    if(/sin|cos|tan|triangle|bearing|angle|heron/.test(q)) return "Trigonometry";
    return "General Mathematics";
  }
  if(/thesis|outline|research|evidence|paraphrase|plagiarism|citation|technical report|academic/.test(q)) return "Academic & Technical Communication";
  if(/chart|table|diagram|graph|infographic|multimodal/.test(q)) return "Multimodal Communication";
  if(/audience|tone|feedback|collaboration|procedure/.test(q)) return "Communication Strategies";
  return "Effective Communication";
}
function buildSkillBreakdown(answers){
  const map = {};
  (answers || []).forEach(a=>{
    const skill = a.skill || inferSkill(a.subject, a.q);
    if(!map[skill]) map[skill] = {skill, correct:0, total:0};
    map[skill].total++;
    if(a.correct) map[skill].correct++;
  });
  return Object.values(map).map(v=>({...v, pct: Math.round((v.correct/v.total)*100)}));
}
function masteryLabel(pct){
  if(pct >= 85) return "Mastered";
  if(pct >= 70) return "Developing";
  return "Needs practice";
}
function getSavedMastery(){
  try{
    const raw = localStorage.getItem("tq_mastery_" + state.student.email);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function learningPathHtml(){
  const rows = getSavedMastery();
  if(!rows.length){
    return `<div class="learning-panel">
      <div class="lp-title">Your Learning Path</div>
      <div class="lp-sub">Start with a Pre-Test to find your baseline. Your results will turn into a skill-by-skill study plan.</div>
      <button class="primary-btn ghost" id="pathStartBtn">Find My Starting Point</button>
    </div>`;
  }
  const focus = rows.filter(s=>s.pct < 85).sort((a,b)=>a.pct-b.pct);
  const next = focus[0];
  const action = next
    ? `Recommended next step: review <b>${escapeHtml(next.skill)}</b>, then practice again before the Post-Test.`
    : "You are showing mastery across the skills recorded so far. You are ready to measure your progress with the Post-Test.";
  return `<div class="learning-panel">
    <div class="lp-title">Your Learning Path</div>
    <div class="lp-sub">${action}</div>
    ${rows.map(s=>`<div class="mastery-row">
      <div class="mr-top"><span>${escapeHtml(s.skill)}</span><span>${masteryLabel(s.pct)} &middot; ${s.pct}%</span></div>
      <div class="mastery-track"><i style="width:${Math.max(4,Math.min(100,s.pct))}%"></i></div>
    </div>`).join("")}
    <button class="primary-btn ghost" id="pathReviewBtn">${next ? "Open Reviewer for Focus" : "View My Progress"}</button>
  </div>`;
}

DETAILED STUDY NOTES AND PRACTICE GUIDE

FUNCTIONS AND REPRESENTATIONS
• A relation pairs inputs with outputs. It is a function when every input has exactly one output.
• The domain is the set of allowed inputs; the range is the set of resulting outputs.
• Use the vertical-line test on a graph: a vertical line touching the graph more than once means the relation is not a function.
• Function notation f(x) names the output for an input. To evaluate f(3), substitute 3 for every x in the rule.
• Tables, ordered pairs, mapping diagrams, graphs, equations, and verbal rules can represent the same function.
• In a piecewise function, identify the condition first and apply only the formula assigned to that interval.
• Pay close attention to endpoint symbols. < and > exclude an endpoint; ≤ and ≥ include it.
• When graphing a piecewise function, graph each rule only on its interval and mark included or excluded endpoints.

LINEAR, QUADRATIC, AND RATIONAL FUNCTIONS
• A linear function has the form f(x) = mx + b. The slope is m and the y-intercept is b.
• For two points, m = (y₂ − y₁)/(x₂ − x₁). A zero denominator gives a vertical line with undefined slope.
• A quadratic function has the form f(x) = ax² + bx + c and creates a parabola. If a > 0 it opens upward; if a < 0 it opens downward.
• Vertex form is f(x) = a(x − h)² + k. The vertex is (h,k) and the axis of symmetry is x = h.
• A rational function is a quotient of polynomials. Its domain excludes values that make the original denominator zero.
• Factor before simplifying rational expressions. A cancelled factor still creates a restriction from the original denominator.
• To find an x-intercept, set f(x) = 0. To find a y-intercept, evaluate f(0) when 0 is in the domain.

FUNCTION OPERATIONS, COMPOSITION, AND INVERSES
• Add, subtract, multiply, or divide functions by combining their outputs. Division also requires checking the divisor's restrictions.
• Composition is (f ∘ g)(x) = f(g(x)); evaluate the inside function first.
• To find an inverse, write y = f(x), interchange x and y, and solve for y.
• An inverse is a function when the original function is one-to-one on its domain. The graphs of a function and its inverse reflect across y = x.
• Domain and range switch places when a function is inverted. Verify an inverse by composing it with the original function.

EXPONENTIALS, LOGARITHMS, AND EQUATIONS
• An exponential function has the form f(x) = abˣ. If b > 1 it models growth; if 0 < b < 1 it models decay.
• A logarithm answers the question: what exponent is needed? log_b(x) = y means bʸ = x.
• Useful rules include log_b(MN) = log_b(M) + log_b(N), log_b(M/N) = log_b(M) − log_b(N), and log_b(Mᵖ) = p log_b(M).
• The argument of a logarithm must be positive. Check this restriction after solving.
• For exponential equations with the same base, equate exponents. Otherwise, use logarithms and round only at the end.

SEQUENCES, SERIES, AND ALGEBRA
• An arithmetic sequence has common difference d: aₙ = a₁ + (n − 1)d.
• A geometric sequence has common ratio r: aₙ = a₁rⁿ⁻¹.
• An arithmetic series uses Sₙ = n/2[2a₁ + (n − 1)d].
• For inequalities, reverse the sign only when multiplying or dividing by a negative number.
• For systems, use substitution or elimination and check the ordered pair in both original equations.
• Keep exact values when possible and show one algebraic step at a time.

DATA AND STATISTICS
• A population is the complete group being studied; a sample is a selected part. A parameter describes a population, while a statistic describes a sample.
• Qualitative variables describe categories. Quantitative variables are numerical; discrete values are countable and continuous values are measured.
• Nominal data are labels, ordinal data have an order, interval data have equal differences without a true zero, and ratio data have a meaningful zero.
• Mean = sum of values ÷ number of values. Put values in order before finding the median.

DETAILED STUDY NOTES AND COMMUNICATION GUIDE

THE COMMUNICATION PROCESS
• Communication includes a sender, message, channel, receiver, feedback, context, and possible noise or barriers.
• Encoding turns an idea into words, symbols, images, gestures, or other signs. Decoding is interpreting the received message.
• A channel is the medium used to deliver a message, such as speech, email, a report, a presentation, or a visual.
• Feedback shows whether the message was understood. Clarify when the response reveals confusion.
• Physical, language, emotional, cultural, technological, and information-overload barriers can interfere with meaning.
• Communication is transactional: participants influence one another, and meaning depends on the situation, relationship, purpose, and shared knowledge.

AUDIENCE, PURPOSE, AND CONTEXT
• Before writing or speaking, identify the audience, purpose, subject, occasion, and expected outcome.
• Informative communication explains. Persuasive communication supports a position and encourages a response. Instructional communication guides a process.
• Match tone, vocabulary, detail, format, and formality to the audience. A message to a close friend should not have the same structure as an email to a professor.
• Audience awareness means anticipating what readers know, what needs explanation, what concerns they may have, and what action they should take.
• Use precise words instead of vague expressions. Avoid unnecessary jargon unless the audience understands the specialized terms.

ACADEMIC AND TECHNICAL TEXTS
• Academic and technical texts are formal, organized, evidence-based, and written for a clear discipline or task.
• A thesis states the central claim or controlling idea. An outline arranges main points and supporting details before drafting.
• A paragraph usually has a topic sentence, supporting explanation or evidence, and a concluding or linking sentence.
• Coherence means ideas make sense together. Cohesion is created through transitions, repeated key terms, clear pronouns, and logical connections.
• Common patterns include cause and effect, comparison and contrast, problem and solution, chronological order, classification, and process.
• An introduction gives context and purpose. Body sections develop ideas. A conclusion synthesizes important points without introducing an unrelated argument.

CRITICAL READING, LISTENING, AND VIEWING
• Identify the main idea, supporting details, purpose, audience, tone, and point of view.
• Separate a claim from the evidence supporting it. Ask whether evidence is relevant, sufficient, current, and credible.
• Notice assumptions, emotionally loaded language, missing information, generalizations, and possible bias.
• Active listening requires attention to words, tone, emphasis, evidence, and implied meaning. Confidence does not guarantee accuracy.
• For a chart or diagram, read the title, labels, legend, units, scale, source, and date before interpreting the pattern.
• A conclusion should describe the visible trend and avoid claiming more than the data support.

RESEARCH, SOURCES, AND EVIDENCE
• Reliable sources identify an author or organization, provide evidence, explain methods when relevant, and can be checked against other sources.
• Primary sources provide original or firsthand information. Secondary sources interpret, analyze, or summarize other sources.

SUMMARY, PARAPHRASE, AND SYNTHESIS
• A summary reduces a longer text to its main idea and most important points without changing the meaning.
• A paraphrase restates a specific passage in your own sentence structure and wording while preserving the meaning and citing the source.
• Changing only a few words or rearranging the source sentence is not an acceptable paraphrase.

MULTIMODAL AND VISUAL COMMUNICATION
• Multimodal communication combines written language, speech, images, color, layout, sound, movement, charts, and diagrams.

• Do not distort a graph with a misleading scale, missing labels, inappropriate 3D effects, or selective data.

INTERACTION, LISTENING, AND FEEDBACK
• Active listening includes focusing on the speaker, appropriate eye contact, noticing non-verbal signals, asking clarifying questions, and responding to the actual message.

• In collaboration, clarify roles, deadlines, decision rules, and responsibilities. Record important agreements.
• In a discussion or debate, respond to the claim and evidence rather than attacking the person.
• Non-verbal communication includes facial expression, posture, gestures, eye contact, distance, pace, and vocal emphasis.
• Professional communication remains respectful even when participants disagree or feel pressured.

GRAMMAR, STYLE, AND EDITING
• A complete sentence has a subject and predicate and expresses a complete thought. Avoid fragments and run-on sentences.
• Make the subject and verb agree. Use pronouns with clear antecedents and correct number and person.

ETHICS, AI, AND REFLECTION

THREE-WEEK GENERAL MATHEMATICS STUDY GUIDE

WEEK 1 — PIECEWISE FUNCTIONS
• A piecewise function uses different rules for different intervals or conditions.
• Read the condition first. The condition tells you which formula to use; do not combine rules from separate intervals.
• Symbols matter: < and > exclude an endpoint, while ≤ and ≥ include it. At a boundary, use the rule whose condition includes that value.
• Example fare model:
  f(x) = 40 for 0 < x ≤ 2
  f(x) = 40 + 12(x − 2) for x > 2

• Practical uses include taxi fares, delivery charges, tiered discounts, and income-tax brackets.

• When sketching a piecewise graph, draw each rule only on its assigned interval. Use a closed dot for an included endpoint and an open dot for an excluded endpoint.
• A reasonable answer should match the situation: a fare should not decrease when extra distance is added, and an amount of money should have the correct currency unit.

WEEK 2 — DATA, MEASUREMENT LEVELS, AND VARIABILITY
• Qualitative data describe categories or qualities. Quantitative data are numerical.
• Discrete data are countable, such as the number of absences. Continuous data are measured and can take values within a range, such as time, height, or temperature.
• Nominal data are labels with no order. Ordinal data have an order. Interval data have equal differences but no meaningful zero. Ratio data have equal differences and a meaningful zero.
• Mean = sum of values ÷ number of values.
• Median is the middle value after arranging the data in order. With an even number of values, average the two middle values.
• Mode is the most frequent value. A data set may have more than one mode or no mode.
• Range = maximum − minimum. Variance and standard deviation describe how far values spread around the mean.

WEEK 3 — TRIGONOMETRY AND TRIANGLES
• In a right triangle, identify the reference angle and label the sides: opposite, adjacent, and hypotenuse. The hypotenuse is opposite the right angle.

  tan θ = opposite ÷ adjacent
• Use an inverse trigonometric function to find an unknown angle. Set the calculator to degree mode when the problem uses degrees.

GENERAL PROBLEM-SOLVING CHECKLIST
• Read the problem twice and identify what is given and what must be found.
• Draw and label a diagram for triangle, elevation, depression, or bearing problems.
• Write the definition or formula before substituting values.
• Keep units consistent and avoid rounding until the final step.
• Check endpoint conditions in piecewise functions and check that the selected formula matches the data given.
• Ask whether the final value is reasonable in the real situation.`;

      pool = terms.flatMap(term => (TERM_BANK[term] || TERM_BANK.second)[testType][subj] || []);
    }
    const picked = shuffle(pool).slice(0, Math.min(counts[i], pool.length));
    picked.forEach(item=>{
      const correctText = item.c[item.a];
      const shuffledChoices = shuffle(item.c);
      const newA = shuffledChoices.indexOf(correctText);
      const rawQ = item.q || "";
      const isScenario = item.isScenario || rawQ.startsWith("SCENARIO:");
      const qtext = rawQ.startsWith("SCENARIO:") ? rawQ.replace("SCENARIO: ","") : rawQ;
      queue.push({subject:subj, q:qtext, skill:item.skill || inferSkill(subj, qtext), isScenario, c:shuffledChoices, a:newA});
    });
  });
  return shuffle(queue);
}

function runTimer(){
  const ring = document.getElementById("ringProgress");
  const tnum = document.getElementById("tnum");
  const total = state.currentTimerSeconds || PRACTICE_TIMER;
  const circumference = 100.5;
  state.timerId = setInterval(()=>{
    state.timeLeft -= 0.25;
    if(tnum) tnum.textContent = Math.max(0, Math.ceil(state.timeLeft));
    if(ring) ring.style.strokeDashoffset = circumference * (1 - state.timeLeft/total);
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      if(!state.locked) lockAnswer(-1);
    }
  }, 250);
}

function lockAnswer(choiceIndex){
  if(state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);

  const item = state.quizQueue[state.qIndex];
  const isCorrect = choiceIndex === item.a;
  state.answers.push({
    subject:item.subject, skill:item.skill || inferSkill(item.subject, item.q), q:item.q, choices:item.c,
    correctIndex:item.a, selectedIndex:choiceIndex, correct:isCorrect
  });

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach((btn,i)=>{
    btn.classList.add("disabled");
    if(i === item.a) btn.classList.add("correct");
    if(i === choiceIndex && !isCorrect) btn.classList.add("wrong");
    if(i !== item.a && i !== choiceIndex) btn.classList.add("dim");
  });

  if(isCorrect){ spawnFloatingPoint("+1", "var(--good)"); }
  else if(choiceIndex >= 0){ document.querySelector(".qtext").parentElement.classList.add("shake"); }

  setTimeout(()=>{
    if(state.qIndex < state.quizQueue.length - 1){
      state.screen = "transition"; route();
    } else {
      state.screen = "results"; route();
    }
  }, 850);
}

function renderTransition(){
  clearInterval(state.timerId);

  const meta = SUBJECT_META[nextItem.subject];
  const lastAnswer = state.answers[state.answers.length - 1];
  const feedback = lastAnswer && lastAnswer.correct ? "Correct — keep building mastery." : "Not yet — review this skill before your next attempt.";
  const feedbackSkill = lastAnswer ? (lastAnswer.skill || inferSkill(lastAnswer.subject, lastAnswer.q)) : "";
  bg(meta.soft);
  app.innerHTML = `
    <div class="fade-in transition-screen">
      <div class="transition-dot" style="background:${meta.color}">${state.qIndex + 2}</div>
      <div class="tsub">${meta.label}</div>

function spawnFloatingPoint(text, color){

  el.style.left = (rect.right - 70) + "px"; el.style.top = (rect.top + 20) + "px";
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 800);
}

async function autoSaveResult({testType, terms, correct, total, pct}){
  const note = document.getElementById("saveNote");
  if(state.saved){ if(note) note.textContent = "Result saved."; return; }
  try{
    const subjectsCovered = [...new Set(state.answers.map(a=>a.subject))];
    const subjectBreakdown = subjectsCovered.map(s=>({
      subject:s,
      correct: state.answers.filter(a=>a.subject===s && a.correct).length,
      total: state.answers.filter(a=>a.subject===s).length
    }));
    const skillBreakdown = buildSkillBreakdown(state.answers);
    try{ localStorage.setItem("tq_mastery_" + state.student.email, JSON.stringify(skillBreakdown)); }catch(e){}
    await db.collection("attempts").add({
      studentEmail: state.student.email, studentName: state.student.name,
        classId: state.activeClassId || null,
        testType, terms: ["second"], term: "second", subjects: subjectsCovered, subjectBreakdown,
      correct, total, pct, skillBreakdown, timestamp: Date.now()
    });
    state.saved = true;
    if(note) note.textContent = "Result saved to your progress history.";
  }catch(err){
    if(note) note.textContent = "Couldn't save automatically, check your connection.";
    console.error(err);
  }
}

function renderAnswerReview(){
  bg();
  logSelfAssessment("answerReview");
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Your Answers</div>
      </div>
      ${state.answers.map((a,i)=>`
        <div class="review-item">
          <div class="ri-q">Q${i+1}. ${escapeHtml(a.q)}</div>
          <div class="fine-print" style="text-align:left; margin:0 0 8px;">Skill: ${escapeHtml(a.skill || inferSkill(a.subject, a.q))}</div>
          ${a.choices.map((ch,ci)=>{
            let cls = "";
            if(ci === a.correctIndex) cls = "correct";
            else if(ci === a.selectedIndex) cls = "wrong";
            return `<div class="ri-c ${cls}">${String.fromCharCode(65+ci)}. ${escapeHtml(ch)}${ci===a.correctIndex?' ✓':''}${ci===a.selectedIndex && ci!==a.correctIndex?' ✗ (your answer)':''}</div>`;
          }).join("")}
        </div>
      `).join("")}
      <button class="primary-btn ghost" id="backBtn2" style="margin-top:6px;">Back to Results</button>
    </div>
  `;
  const goBack = ()=>{ state.screen="results"; route(); };
  document.getElementById("backBtn").addEventListener("click", goBack);
  document.getElementById("backBtn2").addEventListener("click", goBack);
}

async function renderMyProgress(){
  bg();
  logSelfAssessment("myProgress");
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading your history...</p></div>`;
  let rows = [];
  try{
    const snap = await db.collection("attempts").where("studentEmail","==",state.student.email).get();
    snap.forEach(d => rows.push(d.data()));
    rows.sort((a,b)=> b.timestamp - a.timestamp);
  }catch(e){ console.error(e); }

  const tableRows = rows.map(r=>{
     const tag = r.testType==="pretest" ? `<span class="tag-pre">PRE</span>` : `<span class="tag-post">POST</span>`;
     return `<tr><td>${tag}</td><td>Second Term</td><td>${subjectLabels(r.subjects)}</td><td>${r.correct}/${r.total}</td><td>${r.pct}%</td><td>${fmtDate(r.timestamp)}</td></tr>`;
  }).join("");
  const masteryMap = {};
  rows.forEach(r=>(r.skillBreakdown || []).forEach(s=>{
    if(!masteryMap[s.skill]) masteryMap[s.skill] = {correct:0,total:0};
    masteryMap[s.skill].correct += s.correct || 0;
    masteryMap[s.skill].total += s.total || 0;
  }));
  const masteryRows = Object.entries(masteryMap).map(([skill,v])=>{
    const pct = v.total ? Math.round(v.correct/v.total*100) : 0;
    return `${skill}: ${masteryLabel(pct)} (${pct}%)`;
  });

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">My Progress</div>
      </div>
      ${rows.length === 0 ? `<p class="empty-note">No attempts yet, try a Pre-Test or Post-Test practice.</p>` : `
        <div style="overflow-x:auto;">
          <table class="results-table">
            <thead><tr><th>Test</th><th>Term</th><th>Subject(s)</th><th>Score</th><th>%</th><th>Date</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
           ${masteryRows.length ? `<p class="fine-print" style="text-align:left; margin-bottom:0;">Mastery snapshot: ${masteryRows.join(" &middot; ")}</p>` : ``}
        </div>
      `}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
}

function renderJoinClass(){
  bg();
  const joinedClasses = getJoinedClasses();
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Join a Class</div>
      </div>
      <p class="fine-print" style="margin-top:0; margin-bottom:14px;">Enter the class code your teacher gave you.</p>
      <input type="text" id="joinCodeInput" placeholder="Enter class code">
      ${state.joinError ? `<p class="error-note">${escapeHtml(state.joinError)}</p>` : ``}
      <button class="primary-btn" id="joinBtn">Join Class</button>
      ${joinedClasses.length ? `
        <div class="saved-class-section">
          <p class="field-label">Open a Joined Class</p>
          ${joinedClasses.map((c,i)=>`
            <button class="class-card saved-class-card" data-saved-class="${i}">
              <div class="ctitle">${escapeHtml(c.className || "Class")}</div>
              <div class="cmeta">${escapeHtml(c.teacherName || "Teacher")} · Code ${escapeHtml(c.joinCode || "saved")}</div>
            </button>
          `).join("")}
        </div>
      ` : ""}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
  document.querySelectorAll(".saved-class-card").forEach(btn=>{
    btn.addEventListener("click", ()=>openSavedClass(joinedClasses[parseInt(btn.dataset.savedClass, 10)]));
  });
  document.getElementById("joinBtn").addEventListener("click", async ()=>{
    const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
    state.joinError = "";
    if(!code){ state.joinError = "Please enter a class code."; renderJoinClass(); return; }
    const btn = document.getElementById("joinBtn");
    btn.disabled = true; btn.textContent = "Joining...";
    try{
      const snap = await db.collection("classes").where("joinCode","==",code).limit(1).get();
      if(snap.empty){ state.joinError = "No class found with that code."; renderJoinClass(); return; }
      const classDoc = snap.docs[0];
      state.activeClassId = classDoc.id;
      state.activeClass = {id: classDoc.id, ...classDoc.data()};
      state.activeAssignment = null;
      saveJoinedClass(state.activeClass);
      db.collection("enrollments").add({
        studentEmail: state.student.email, studentName: state.student.name,
        classId: classDoc.id, joinedAt: Date.now()
      }).catch(e=>console.error(e));
      state.screen = "studentClass"; route();
    }catch(err){ state.joinError = err.message; renderJoinClass(); }
  });
}

async function renderStudentClass(){
  bg();
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading class...</p></div>`;
  const c = state.activeClass;
  const classSubjects = (c.subjects || []).filter(s=>ORDER.includes(s));

  db.collection("classViews").add({
    studentEmail: state.student.email, studentName: state.student.name,
    classId: state.activeClassId, timestamp: Date.now()
  }).catch(e=>console.error(e));

  let assignment = null;
  let preUsed = 0, postUsed = 0;
  try{
    const [assignDoc, preSnap, postSnap] = await Promise.all([
      db.collection("assignments").doc(state.activeClassId).get(),
      db.collection("attempts").where("classId","==",state.activeClassId).where("studentEmail","==",state.student.email).where("testType","==","pretest").get(),
      db.collection("attempts").where("classId","==",state.activeClassId).where("studentEmail","==",state.student.email).where("testType","==","posttest").get()
    ]);
    if(assignDoc.exists) assignment = assignDoc.data();
    preUsed = preSnap.size; postUsed = postSnap.size;
  }catch(e){ console.error(e); }

  state.activeAssignment = assignment;
  if(assignment){
    assignment.terms = ["second"];
    assignment.term = "second";
  }
  state.reviewerTerms = ["second"];

  if(!assignment){
    app.innerHTML = `
      <div class="fade-in">
        <div class="navbar">
          <button class="pill-btn outline" id="backBtn">Back</button>
          <div class="who">${escapeHtml(c.teacherName||"")}</div>
        </div>
        <div class="subject-strip">${classSubjects.map(s=>`<div class="subject-chip ${s}">${SUBJECT_META[s].label.toUpperCase()}</div>`).join("")}</div>
        <p class="field-label">${escapeHtml(c.className)}</p>
        <p class="fine-print" style="margin-top:-6px;">Your teacher hasn't set up a test for this class yet. Check back later, or use the reviewer in the meantime.</p>
        <button class="primary-btn ghost" id="reviewCardBtn">📖 Open Reviewer</button>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
    document.getElementById("reviewCardBtn").addEventListener("click", ()=>{ goToReviewer("studentClass"); });
    return;
  }

  const now = Date.now();
  const notYetOpen = assignment.scheduleStart && now < assignment.scheduleStart;
  const alreadyClosed = assignment.scheduleEnd && now > assignment.scheduleEnd;
  const withinWindow = !notYetOpen && !alreadyClosed;

  function windowText(){
    if(!assignment.scheduleStart && !assignment.scheduleEnd) return "Open anytime";
    const startTxt = assignment.scheduleStart ? fmtDate(assignment.scheduleStart) : "now";
    const endTxt = assignment.scheduleEnd ? fmtDate(assignment.scheduleEnd) : "no end date";
    return `${startTxt} — ${endTxt}`;
  }

  const preLeft = Math.max(0, (assignment.maxAttempts||1) - preUsed);
  const postLeft = Math.max(0, (assignment.maxAttempts||1) - postUsed);

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(c.teacherName||"")}</div>
      </div>
      <div class="subject-strip">${((assignment.subjects||classSubjects||[]).filter(s=>ORDER.includes(s))).map(s=>`<div class="subject-chip ${s}">${SUBJECT_META[s].label.toUpperCase()}</div>`).join("")}</div>
      <p class="field-label">${escapeHtml(c.className)}</p>
      <div class="assign-box">
         <div class="al-row"><span class="al-label">Term</span><span class="al-value">Second Term</span></div>
        <div class="al-row"><span class="al-label">Questions</span><span class="al-value">${assignment.numQuestions||20}</span></div>
        <div class="al-row"><span class="al-label">Timer per question</span><span class="al-value">${assignment.timerSeconds||20}s</span></div>
        <div class="al-row"><span class="al-label">Attempts allowed</span><span class="al-value">${assignment.maxAttempts||1}</span></div>
        <div class="al-row"><span class="al-label">Available</span><span class="al-value">${windowText()}</span></div>
      </div>
      ${notYetOpen ? `<p class="error-note">This test isn't open yet.</p>` : ``}
      ${alreadyClosed ? `<p class="error-note">This test window has closed.</p>` : ``}
      <button class="primary-btn" id="startPreBtn" ${(!withinWindow || preLeft<=0) ? 'disabled':''}>📝 Start Pre-Test (${preLeft} left)</button>
      <button class="primary-btn" id="startPostBtn" style="margin-top:10px;" ${(!withinWindow || postLeft<=0) ? 'disabled':''}>✅ Start Post-Test (${postLeft} left)</button>
      <button class="primary-btn ghost" id="reviewCardBtn" style="margin-top:10px;">📖 Open Reviewer</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
  document.getElementById("reviewCardBtn").addEventListener("click", ()=>{ goToReviewer("studentClass"); });

  const startBtn = (id, testType) => {
    const btn = document.getElementById(id);
    if(btn) btn.addEventListener("click", ()=>{
      state.practiceType = testType;
        state.practiceTerms = ["second"];
      state.practiceSubjects = (assignment.subjects || classSubjects || []).filter(s=>ORDER.includes(s));
      state.currentTimerSeconds = assignment.timerSeconds || PRACTICE_TIMER;
      state.quizQueue = buildAssignedQueue(assignment, testType);
      if(!state.quizQueue.length){
        console.error("No questions found for", testType, assignment);
        alert("No questions are available for the selected term and subject(s).");
        return;
      }
      state.qIndex = 0; state.answers = []; state.saved = false;
      state.screen = "quiz"; route();
    });
};
  startBtn("startPreBtn", "pretest");
  startBtn("startPostBtn", "posttest");
}

initTheme();
route();
</script>
