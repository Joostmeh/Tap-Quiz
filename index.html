<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap-Quiz for Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F3F1FB; --surface:#FFFFFF; --ink:#211C4E; --ink-soft:#5A5480; --border:#DDD7F2;
    --math:#F0A202; --math-soft:#FCEACB; --science:#1B998B; --science-soft:#D6EFEA;
    --english:#E4572E; --english-soft:#FBE1D9; --accent:var(--ink); --accent-soft:#E7E3F8;
    --good:#1B998B; --bad:#E4572E; --radius:18px; --shadow:0 12px 30px -14px rgba(33,28,78,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 45%), radial-gradient(circle at 110% 10%, #ECE3FB 0%, transparent 40%), var(--paper);
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:28px 16px 60px; transition:background 0.5s ease;
  }
  .wrap{ width:100%; max-width:560px; }
  .brand{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .brand .logo-row{ display:flex; align-items:center; gap:10px; }
  .brand img.logo{ width:46px; height:46px; border-radius:12px; object-fit:cover; box-shadow:var(--shadow); }
  .brand h1{ font-family:'Space Grotesk', sans-serif; font-size:clamp(19px,5vw,24px); font-weight:700; letter-spacing:-0.02em; margin:0; line-height:1.05; }
  .brand h1 span{ color:var(--english); }
  .brand .tag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:0.03em; text-align:right; line-height:1.4; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; min-height:120px; }

  .navbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .navbar .who{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
  .navbar .who b{ color:var(--ink); }
  .pill-btn{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--ink); border:none; border-radius:100px; padding:8px 12px; cursor:pointer; }
  .pill-btn.outline{ background:transparent; border:1.5px solid var(--border); }

  .subject-strip{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .subject-chip{ flex:1; min-width:90px; padding:10px 8px; border-radius:12px; text-align:center; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.03em; cursor:pointer; border:1.5px solid transparent; }
  .subject-chip.math{ background:var(--math-soft); color:#7A5300; }
  .subject-chip.science{ background:var(--science-soft); color:#0E5C52; }
  .subject-chip.english{ background:var(--english-soft); color:#8E2E15; }
  .subject-chip.selected{ border-color:currentColor; }

  .field-label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:0 0 8px 2px; }

  input[type="text"], input[type="email"]{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-size:15px; color:var(--ink);
    outline:none; margin-bottom:16px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .checkbox-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .checkbox-item{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--paper); }
  .checkbox-item.checked{ border-color:var(--accent); background:var(--accent-soft); }
  .checkbox-item input{ width:auto; margin:0; }

  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .mode-btn{ cursor:pointer; border:1.5px solid var(--border); background:var(--paper); border-radius:14px; padding:16px 10px; text-align:left; transition:all .15s ease; }
  .mode-btn:hover{ border-color:var(--accent); }
  .mode-btn .mtitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; display:block; margin-bottom:4px; }
  .mode-btn .msub{ font-size:11.5px; color:var(--ink-soft); line-height:1.35; display:block; }
  .mode-btn.locked{ opacity:0.45; cursor:not-allowed; }

  .primary-btn{ width:100%; border:none; cursor:pointer; background:var(--ink); color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.01em; padding:15px 18px; border-radius:14px; transition:transform .12s ease, opacity .15s ease; margin-bottom:0; }
  .primary-btn:active{ transform:scale(0.98); }
  .primary-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .primary-btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }

  .fine-print{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.5; }
  .link-btn{ background:none; border:none; color:var(--ink); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  .error-note{ font-size:12.5px; color:var(--bad); margin:-8px 0 14px; }

  .hero{ text-align:center; padding:6px 4px 20px; }
  .hero .kicker{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:10px; }
  .hero h2{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; line-height:1.25; margin:0 0 12px; }
  .hero p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 20px; }
  .feature-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; text-align:left; }
  .feature-item{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-soft); }
  .feature-item b{ color:var(--ink); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }

  .home-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .home-card{ border:1.5px solid var(--border); border-radius:16px; padding:18px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; display:flex; align-items:center; gap:14px; }
  .home-card:hover{ border-color:var(--accent); }
  .home-card .hicon{ font-size:22px; }
  .home-card .htitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:2px; }
  .home-card .hsub{ font-size:12px; color:var(--ink-soft); }

  .class-card{ border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; background:var(--paper); transition:border-color .15s ease; }
  .class-card:hover{ border-color:var(--accent); }
  .class-card .ctitle{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .class-card .cmeta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }

  .quiz-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .subj-pill{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.04em; padding:7px 12px; border-radius:100px; color:#fff; }
  .score-chip{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.03em; background:var(--ink); color:#fff; padding:7px 12px; border-radius:100px; }
  .track{ display:flex; gap:4px; margin-bottom:20px; }
  .track-seg{ flex:1; height:6px; border-radius:4px; background:var(--border); overflow:hidden; }
  .track-seg i{ display:block; height:100%; border-radius:4px; }
  .qhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .qcount{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); }
  .qtag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600; letter-spacing:0.03em; padding:3px 8px; border-radius:100px; background:var(--accent-soft); color:var(--ink); margin-left:8px; vertical-align:middle; }
  .timer-ring{ position:relative; width:40px; height:40px; }
  .timer-ring svg{ transform:rotate(-90deg); }
  .timer-ring .tnum{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; }
  .qtext{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:600; line-height:1.4; margin:4px 0 20px; min-height:52px; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{ display:flex; align-items:center; gap:12px; text-align:left; padding:13px 14px; border-radius:13px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; font-size:14.5px; color:var(--ink); transition:all .12s ease; }
  .choice:hover{ border-color:var(--accent); }
  .choice .klabel{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px; width:22px; height:22px; border-radius:7px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .choice.correct{ background:#E4F5F1; border-color:var(--good); color:#0E5C52; }
  .choice.correct .klabel{ background:var(--good); border-color:var(--good); color:#fff; }
  .choice.wrong{ background:#FCE7E1; border-color:var(--bad); color:#8E2E15; }
  .choice.wrong .klabel{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .choice.disabled{ pointer-events:none; }
  .choice.dim{ opacity:0.45; }

  .transition-screen{ min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; }
  .transition-screen .tsub{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; }
  .transition-screen .tnext{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:0.04em; }
  .transition-dot{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }

  .result-hero{ text-align:center; padding:6px 0 22px; }
  .result-hero .pct{ font-family:'Space Grotesk', sans-serif; font-size:56px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .result-hero .frac{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); margin-top:8px; }
  .result-hero .msg{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600; margin-top:10px; }
  .btn-row{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  table.results-table{ width:100%; border-collapse:collapse; font-size:12px; }
  table.results-table th, table.results-table td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  table.results-table th{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); }
  .tag-pre{ background:var(--math-soft); color:#7A5300; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }
  .tag-post{ background:var(--science-soft); color:#0E5C52; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; }

  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }
  .reviewer-box{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; white-space:pre-wrap; font-size:13.5px; line-height:1.65; }

  .tab-row{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn{ flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; padding:8px 12px; border-radius:100px; border:1.5px solid var(--border); background:var(--paper); cursor:pointer; color:var(--ink-soft); }
  .tab-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }

  .review-item{ border:1.5px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  .review-item .ri-q{ font-weight:600; font-size:14px; margin-bottom:10px; }
  .review-item .ri-c{ padding:9px 12px; border-radius:10px; font-size:13px; margin-bottom:6px; background:var(--paper); }
  .review-item .ri-c.correct{ background:#E4F5F1; color:#0E5C52; font-weight:600; }
  .review-item .ri-c.wrong{ background:#FCE7E1; color:#8E2E15; font-weight:600; }

  .assign-box{ background:var(--paper); border:1.5px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .assign-box .al-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); }
  .assign-box .al-row:last-child{ border-bottom:none; }
  .assign-box .al-label{ color:var(--ink-soft); }
  .assign-box .al-value{ font-weight:600; }

  .float-pt{ position:fixed; pointer-events:none; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; animation:floatUp .8s ease forwards; z-index:50; }
  @keyframes floatUp{ 0%{ opacity:1; transform:translateY(0);} 100%{ opacity:0; transform:translateY(-38px);} }
  .fade-in{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  footer.credit{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:18px; font-family:'IBM Plex Mono', monospace; }
</style>
</head>

  math: `GENERAL MATHEMATICS — QUICK REVIEWER

BUSINESS & FINANCE
• Wage = hourly rate x hours worked. Overtime is usually 1.5x the regular rate.
• Percentage change = (new value - old value) / old value x 100
• VAT in the Philippines is typically 12% added to the selling price.
• Gross pay = regular pay + overtime pay + benefits; net pay = gross pay - deductions.
• Simple interest: I = Prt; maturity value: A = P + I.
• Discount = original price x discount rate; sale price = original price - discount.
• Markup = cost x markup rate; selling price = cost + markup.

SEQUENCES & SERIES
• Arithmetic sequence: a(n) = a1 + (n - 1)d
• Arithmetic series sum: S(n) = n/2 x (a1 + a(n))
• Geometric sequence: a(n) = a1 x r^(n-1)
• Arithmetic nth term: a(n) = a1 + (n - 1)d; arithmetic sum: S(n) = n/2[2a1 + (n - 1)d].
• Geometric sum: S(n) = a1(r^n - 1)/(r - 1), when r ≠ 1.
• A sequence is a list of terms; a series is the sum of terms.
• Fibonacci sequence: each term is the sum of the two preceding terms.

FUNCTIONS & GRAPHS
• A function assigns exactly one output to each input (vertical line test).
• Linear: f(x) = mx + b. Quadratic: f(x) = ax^2 + bx + c (graph is a parabola).
• A rational function is undefined wherever its denominator equals 0.
• Slope: m = (y2 - y1)/(x2 - x1); point-slope form: y - y1 = m(x - x1).
• Composition: (f ∘ g)(x) = f(g(x)); inverse functions undo one another.
• Absolute value graphs have a V-shape; square-root and cube-root graphs have restricted shapes.
• Piecewise functions use different formulas on specified intervals.

MEASUREMENT & TRIGONOMETRY
• SOH-CAH-TOA: sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent.
• Area of a triangle (SAS): Area = 1/2 x a x b x sin(C)
• Rectangle area = lw; triangle area = 1/2bh; circle area = πr²; circumference = 2πr.
• Prism/cylinder volume = base area x height; pyramid/cone volume = 1/3(base area x height).
• Sphere volume = 4/3πr³; sphere surface area = 4πr².
• Pythagorean theorem: a² + b² = c² for a right triangle.
• Convert units by multiplying by a conversion factor equal to 1; keep units in every step.

STATISTICS
• Mean = sum of values / number of values.
• A p-value below your significance level means you reject the null hypothesis.
• Median is the middle value; mode is the most frequent value; range = maximum - minimum.
• Population describes the whole group; sample describes part of the group.
• Standard deviation measures spread around the mean; a larger value means more variability.
• Correlation describes association, but correlation alone does not prove causation.

COMPOUND INTEREST & ANNUITIES
• Compound interest: A = P(1 + r/n)^(nt)
• An annuity is a series of equal payments made at regular intervals.
• Gross pay is total earnings before deductions; net pay is what remains after deductions.
• For a geometric series, the common ratio is the multiplier between consecutive terms.
• Measurement work requires choosing appropriate units, converting consistently, and checking scale.
• Piecewise functions use different rules on different intervals.

LOGIC
• A proposition is a declarative statement that is true or false, never a question or command.
• In financial problems, identify the rate, time period, principal, and payment frequency before calculating.`,

  science: `GENERAL SCIENCE — QUICK REVIEWER

PHYSICS IN DAILY LIFE
• Simple machines (levers, pulleys, inclined planes) reduce the force needed to do work.
• Pascal's Principle: pressure applied to a fluid is transmitted equally in all directions (used in hydraulic systems).
• Archimedes' Principle: an object floats if it displaces a weight of fluid equal to its own weight.
• Avoid overloaded outlets and damaged wiring — both raise the risk of electrical hazards.
• Work: W = Fd; power: P = W/t; efficiency = useful output/input x 100%.
• Pressure: P = F/A. Hydraulic systems transmit pressure through a confined fluid.
• Density: ρ = m/V. An object is more likely to float when its average density is less than the fluid's density.
• Speed = distance/time; velocity includes direction; acceleration = change in velocity/time.
• Kinetic energy: KE = 1/2mv²; gravitational potential energy: PE = mgh.

CHEMISTRY IN EVERYDAY LIFE
• Common reaction types: decomposition, acid + carbonate, acid + metal, and combustion.
• Photosynthesis: 6CO2 + 6H2O + light -> C6H12O6 + 6O2
• Cellular respiration: C6H12O6 + 6O2 -> 6CO2 + 6H2O + energy
• Check DTI, FDA, and DENR guidance before using or disposing of household chemicals.
• Acids have pH below 7; bases have pH above 7; a neutral solution has pH 7.
• Conservation of mass means atoms are rearranged, not created or destroyed, in a reaction.
• Combustion commonly requires fuel and oxygen and releases energy.
• Never mix household cleaners unless the label explicitly says it is safe.

BIOLOGY & ECOSYSTEMS
• Cells convert nutrients into usable energy to sustain life.
• Organ systems work together — e.g. the nervous and endocrine systems regulate body temperature.
• Climate change affects Philippine ecosystems and biodiversity, often through rising heat and shifting rainfall.
• Levels of organization: cell → tissue → organ → organ system → organism.
• Producers capture energy; consumers obtain energy by feeding; decomposers recycle matter.
• Homeostasis is the maintenance of stable internal conditions.
• Photosynthesis stores energy in glucose; cellular respiration releases usable energy from glucose.
• Work is done when a force moves an object; machines trade force for distance or direction.
• Light can be reflected, refracted, or absorbed; sound requires a medium to travel.
• Chemical labels communicate hazards, ingredients, safe handling, and disposal information.
• Energy can be transferred or transformed, but it is conserved.

EARTH & SPACE SCIENCE
• Earth supports life because of its distance from the sun, its atmosphere, and greenhouse gases that regulate temperature.
• The Philippine archipelago was shaped by tectonic and volcanic activity.
• PAGASA monitors weather and hydrometeorological hazards; PHIVOLCS monitors volcanic and seismic activity.
• Weather describes short-term atmospheric conditions; climate describes longer-term patterns.
• Reduce electrical risk by using properly rated equipment and avoiding damaged wires or overloaded outlets.`,

  english: `EFFECTIVE COMMUNICATION — QUICK REVIEWER

THE COMMUNICATION PROCESS
• Key elements: sender, message, channel, receiver, feedback, and context.
• Noise is anything that disrupts the message — physical, language, emotional, or cultural barriers.
• Encoding turns an idea into a message; decoding is the receiver's interpretation.
• Feedback shows whether the message was understood and lets the sender adjust.
• Context includes the situation, relationship, culture, time, place, and purpose.

FOUR CONTEXTS OF COMMUNICATION
• Personal & Interpersonal: everyday conversations, journaling, texts, resolving conflict respectfully.
• Social & Cultural: public forums, advocacy posts, respecting diverse cultural norms and group dynamics.
• Academic & Training: presentations, research reports, proper citations, discipline-specific vocabulary.
• Professional & Work: resumes, emails, meetings — clear, concise, and appropriately formal.
• Intrapersonal communication is communication within oneself, including reflection and goal-setting.
• Intercultural communication requires openness, sensitivity to norms, and avoidance of stereotypes.

VERBAL & NON-VERBAL STRATEGIES
• Politeness markers and turn-taking signals (topic nomination, back-channeling) keep conversations respectful.
• Non-verbal cues — tone, eye contact, posture — strongly affect how a message is received.
• Active listening includes attention, clarification, paraphrasing, and an appropriate response.
• Assertive communication expresses needs respectfully; it is neither passive nor aggressive.
• Tone is the attitude conveyed by language and delivery; it should match audience and purpose.

WRITTEN COMMUNICATION
• Good paragraphs have one main idea supported by clear, relevant details.
• Match tone and formality to your audience and purpose — a text to a friend is not a professional email.
• Academic and technical texts use structure, precise language, evidence, and appropriate terminology.
• Multimodal communication combines modes such as words, images, charts, sound, or video.
• Critical listening and reading involve checking purpose, evidence, assumptions, and meaning.
• Summarizing keeps the central ideas in a shorter form; paraphrasing restates them in your own words.
• Coherence means ideas connect logically; cohesion uses transitions and clear references.
• Revise for purpose, organization, clarity, correctness, inclusivity, and ethical use of sources.

  second: {
     math: "GENERAL MATHEMATICS — SECOND TERM, WEEKS 1–3 REVIEWER\n\nPIECEWISE FUNCTIONS\n• A piecewise function uses different formulas on specified intervals or conditions.\n• Use piecewise rules for practical situations such as fare rates, purchasing discounts, and income-tax brackets.\n• Identify the input interval first, then apply only the rule assigned to that interval.\n• Pay close attention to boundary symbols such as <, ≤, >, and ≥ so the correct rule is used.\n• Write the domain conditions beside each rule and evaluate one interval at a time.\n• Check whether the result is reasonable for the situation and the units used.\n\nDATA AND MEASUREMENT\n• Qualitative data describe categories; quantitative data are numerical.\n• Discrete data are countable; continuous data can take values within a range.\n• Nominal data are labels, ordinal data have an order, interval data have equal differences without a true zero, and ratio data have equal differences with a meaningful zero.\n• Mean = sum of values / number of values. Median is the middle ordered value. Mode is the most frequent value.\n• Range = maximum − minimum. Variability describes how spread out values are; variance and standard deviation quantify spread.\n• The mean is sensitive to outliers, while the median is often more representative of strongly skewed data.\n• Choose measures based on the data type and purpose. Calculators, spreadsheets, Jamovi, and other tools can calculate measures, but the results must still be interpreted.\n• A good interpretation names the measure, describes the pattern, and connects the result to the original context.\n\nTRIGONOMETRY AND TRIANGLES\n• SOH-CAH-TOA: sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent.\n• The Pythagorean theorem is a² + b² = c² for a right triangle.\n• An angle of elevation is measured upward from a horizontal line; an angle of depression is measured downward.\n• Bearings describe direction in navigation and should be read with a clear reference direction, usually clockwise from north.\n• For an oblique triangle, Heron's Formula uses A = √[s(s−a)(s−b)(s−c)], where s = (a+b+c)/2.\n• When two sides and their included angle are known, use A = 1/2 ab sin(C).\n• Draw and label the figure, select the appropriate ratio or formula, keep units consistent, and check whether the answer fits the real situation.\n• In a right triangle, the hypotenuse is opposite the right angle and is always the longest side.\n• Report measured answers with appropriate units and a sensible degree of rounding.",
     science: "GENERAL SCIENCE — SECOND TERM, WEEKS 1–3 REVIEWER\n\nCHEMICAL REACTIONS IN EVERYDAY LIFE\n• Decomposition breaks one compound into simpler substances and can be represented as AB → A + B.\n• Acids reacting with carbonates commonly produce a salt, water, and carbon dioxide.\n• Acids reacting with metals commonly produce a salt and hydrogen gas.\n• Combustion usually involves fuel and oxygen and releases energy; burning is a common example.\n• Baking, cleaning, burning, photosynthesis, respiration, and metabolism involve chemical reactions.\n• Photosynthesis: 6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂.\n• Cellular respiration: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy.\n• Metabolism is the collection of chemical reactions in cells that builds, breaks down, and transforms substances needed for life.\n• The law of conservation of mass means atoms are rearranged, not created or destroyed. Equations should represent the same number of each type of atom on both sides.\n• Evidence of a reaction may include gas formation, an unexpected temperature change, a color change, or formation of a new substance.\n• Chemical equations should be balanced with coefficients without changing the chemical formulas of the substances.\n\nSOLUTIONS IN THE ENVIRONMENT\n• A solution is a homogeneous mixture. The solute is dissolved in the solvent; in saltwater, salt is the solute and water is the solvent.\n• Concentration describes how much solute is present relative to the amount of solution or solvent. A dilute solution has relatively little solute; a concentrated solution has more.\n• A saturated solution contains as much dissolved solute as it can hold under given conditions.\n• Household, industrial, and environmental solutions should be identified, handled, stored, and disposed of safely.\n• Keep labels, use appropriate protective equipment, provide ventilation when required, and never mix cleaners unless the label says it is safe.\n• Test investigations carefully: vary the intended factor, control other conditions, measure results, and record evidence.\n• In a plant investigation, salt concentration can be the independent variable and plant growth can be the dependent variable; a control group provides a comparison.\n• Saltwater and wastewater can change conditions in local ecosystems, stress organisms, and contaminate water sources.\n• Recommendations for reducing environmental harm should be based on evidence about a solution's composition and effects. Follow product labels and relevant DTI, FDA, and DENR guidance.",
     english: "EFFECTIVE COMMUNICATION — COMPLETE SECOND TERM REVIEWER\n\nACADEMIC AND TECHNICAL TEXTS\n• Academic and technical communication is formal, structured, discipline-specific, and shaped by audience, purpose, and context.\n• Use critical listening, reading, and viewing to identify main ideas, evidence, assumptions, intent, and meaning.\n• Interpret charts, tables, figures, diagrams, and other multimodal forms by checking titles, labels, units, scales, patterns, trends, and supporting evidence.\n• Use context, word parts, references, and subject knowledge to understand unfamiliar specialized vocabulary; verify important meanings with reliable sources.\n• Distinguish an author's claim from the evidence used to support it and notice possible bias or unsupported assumptions.\n\nINTERACTION AND COLLABORATION\n• Match language, tone, and structure to the academic or training situation.\n• Follow spoken, written, and multimodal procedures accurately to achieve the intended outcome.\n• Participate constructively by asking relevant questions, providing respectful feedback, and responding appropriately.\n• Academic and technical collaboration works best when members share knowledge, divide responsibilities, listen to different viewpoints, and work toward a common goal.\n• In a discussion or debate, support a point with relevant reasons and evidence rather than attacking a person.\n\nCLEAR ACADEMIC EXPRESSION\n• A thesis states the central claim or controlling idea; an outline organizes ideas before drafting.\n• Academic texts, presentations, research reports, and essays need clear organization, precise language, appropriate terminology, and evidence.\n• Use diagrams, graphs, charts, infographics, and other visual aids to explain concepts when they improve understanding; label visuals so they can be interpreted accurately.\n• Condense information into a summary, synopsis, paraphrase, outline, chart, or diagram without changing its meaning.\n• Coherence connects ideas logically; transitions and clear references create cohesion.\n• Introductions establish context and purpose, body sections develop ideas with evidence, and conclusions synthesize the main points.\n\nETHICS AND REFLECTION\n• Cite sources and represent another person's words and ideas honestly. Presenting borrowed work as one's own is plagiarism.\n• A reference list helps readers locate the sources used in an academic or technical text.\n• AI assistance and borrowed ideas should be acknowledged or declared according to the required citation practice.\n• Intellectual integrity means not inventing evidence, altering results dishonestly, or hiding the source of information.\n• Give feedback about content, structure, and language in a specific, respectful, useful way.\n• Reflect after academic or technical communication: identify strengths, areas for growth, and ways to improve future performance."

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function distributeCount(total, n){
  const base = Math.floor(total / n);
  let rem = total - base * n;
  const arr = [];
  for(let i = 0; i < n; i++) arr.push(base + (i < rem ? 1 : 0));
  return shuffle(arr);
}
function subjectLabels(subjArr){
  return (subjArr||[]).map(s=>SUBJECT_META[s] ? SUBJECT_META[s].label : s).join(", ");

function buildPracticeQueue(subjects, testType, terms){
  const counts = distributeCount(PRACTICE_TOTAL, subjects.length);
  let queue = [];
  subjects.forEach((subj, i)=>{
    const pool = (terms || ["second"]).flatMap(term => (TERM_BANK[term] || TERM_BANK.second)[testType][subj] || []);
    const picked = shuffle(pool).slice(0, Math.min(counts[i], pool.length));
    picked.forEach(item=>{
      const correctText = item.c[item.a];
      const shuffledChoices = shuffle(item.c);
      const newA = shuffledChoices.indexOf(correctText);
      const isScenario = item.q.startsWith("SCENARIO:");
      queue.push({subject:subj, q:isScenario ? item.q.replace("SCENARIO: ","") : item.q, isScenario, c:shuffledChoices, a:newA});
    });
  });
  return shuffle(queue);
}
function buildAssignedQueue(assignment, testType){
  const subjects = (assignment.subjects && assignment.subjects.length) ? assignment.subjects : ORDER;
  const total = Math.min(Math.max(assignment.numQuestions || 20, 1), MAX_QUESTIONS);
  const counts = distributeCount(total, subjects.length);
  let queue = [];
  subjects.forEach((subj, i)=>{
    let pool;
    if(assignment.questionSource === "custom"){
      const terms = ["second"];
      pool = terms.flatMap(term => (((assignment.customQuestions || {})[term] || {})[testType] || {})[subj] || []);
    } else {
      const terms = ["second"];
      pool = terms.flatMap(term => (TERM_BANK[term] || TERM_BANK.second)[testType][subj] || []);
    }
    const picked = shuffle(pool).slice(0, Math.min(counts[i], pool.length));
    picked.forEach(item=>{
      const correctText = item.c[item.a];
      const shuffledChoices = shuffle(item.c);
      const newA = shuffledChoices.indexOf(correctText);
      const rawQ = item.q || "";
      const isScenario = item.isScenario || rawQ.startsWith("SCENARIO:");
      const qtext = rawQ.startsWith("SCENARIO:") ? rawQ.replace("SCENARIO: ","") : rawQ;
      queue.push({subject:subj, q:qtext, isScenario, c:shuffledChoices, a:newA});
    });
  });
  return shuffle(queue);
}

          <div class="hicon">📖</div>
          <div><div class="htitle">Reviewers</div><div class="hsub">Formulas and key concepts, by subject</div></div>
        </div>
        <div class="home-card" id="progressCard">
          <div class="hicon">📈</div>
          <div><div class="htitle">My Progress</div><div class="hsub">See your past attempts and scores</div></div>
        </div>
        <div class="home-card" id="joinCard">
          <div class="hicon">🏫</div>
          <div><div class="htitle">Join a Class</div><div class="hsub">Have a class code from your teacher? Enter it here</div></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("switchBtn").addEventListener("click", ()=>{
    window.localStorage.removeItem("tq_student");
    state.student = null;
    state.screen = "getStarted";
    route();
  });
  document.getElementById("preCard").addEventListener("click", ()=>{ state.practiceType="pretest"; state.practiceSubjects=[]; state.activeAssignment=null; state.currentTimerSeconds=PRACTICE_TIMER; state.screen="practiceSetup"; route(); });
  document.getElementById("postCard").addEventListener("click", ()=>{ state.practiceType="posttest"; state.practiceSubjects=[]; state.activeAssignment=null; state.currentTimerSeconds=PRACTICE_TIMER; state.screen="practiceSetup"; route(); });
  document.getElementById("reviewCard").addEventListener("click", ()=>{ goToReviewer("home"); });
  document.getElementById("progressCard").addEventListener("click", ()=>{ state.screen="myProgress"; route(); });
  document.getElementById("joinCard").addEventListener("click", ()=>{ state.joinError=""; state.screen="joinClass"; route(); });
}

function renderPracticeSetup(){
  bg();
  const sel = state.practiceSubjects;
  const label = state.practiceType === "pretest" ? "Pre-Test Practice" : "Post-Test Practice";
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${label}</div>
      </div>
      <p class="fine-print" style="margin-top:0; margin-bottom:14px;">${PRACTICE_TOTAL} questions total, ${PRACTICE_TIMER} seconds each. Pick your subject(s):</p>
      <div class="checkbox-row" id="subjChecks">
        ${ORDER.map(s=>`
          <label class="checkbox-item ${sel.includes(s)?'checked':''}" data-subj="${s}">
            <input type="checkbox" value="${s}" ${sel.includes(s)?'checked':''}>
            <span>${SUBJECT_META[s].label}</span>
          </label>
        `).join("")}
      </div>
      ${state.practiceError ? `<p class="error-note">${escapeHtml(state.practiceError)}</p>` : ``}
      <button class="primary-btn" id="startBtn">Start ${label}</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
  state.practiceTerms = ["second"];
  document.querySelectorAll("#subjChecks .checkbox-item").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      const v = el.dataset.subj;
      const idx = state.practiceSubjects.indexOf(v);
      if(idx >= 0) state.practiceSubjects.splice(idx,1); else state.practiceSubjects.push(v);
      renderPracticeSetup();
    });
  });
  document.getElementById("startBtn").addEventListener("click", ()=>{
    if(state.practiceSubjects.length === 0){ state.practiceError = "Pick at least one subject."; renderPracticeSetup(); return; }
    state.practiceError = "";
    state.currentTimerSeconds = PRACTICE_TIMER;
    state.practiceTerms = ["second"];
    state.quizQueue = buildPracticeQueue(state.practiceSubjects, state.practiceType, state.practiceTerms);
    state.qIndex = 0; state.answers = []; state.saved = false;
    state.screen = "quiz"; route();
  });
}

function goToReviewer(returnScreen){
  state.reviewerReturnScreen = returnScreen;
  if(state.activeClassId){
    db.collection("reviewerViews").add({
      studentEmail: state.student.email, studentName: state.student.name,
      classId: state.activeClassId, subject: state.reviewerSubject, timestamp: Date.now()
    }).catch(e=>console.error(e));
  }
  state.screen = "reviewer";
  route();
}

function logSelfAssessment(kind){
  if(state.activeClassId){
    db.collection("selfAssessmentViews").add({
      studentEmail: state.student.email, studentName: state.student.name,
      classId: state.activeClassId, kind, timestamp: Date.now()
    }).catch(e=>console.error(e));
  }
}

function renderReviewer(){
  bg();
  const subj = state.reviewerSubject;
  const terms = ["second"];
  const content = terms.map(term=>{
    const custom = state.activeClassId && state.activeAssignment && state.activeAssignment.customReviewer &&
      state.activeAssignment.customReviewer[term] && state.activeAssignment.customReviewer[term][subj];
    return custom || (REVIEWER_BY_TERM[term] || REVIEWER_BY_TERM.second)[subj];
  }).filter(Boolean).join("\n\n");
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Reviewer</div>
      </div>
      <div class="tab-row">
        ${ORDER.map(s=>`<button class="tab-btn ${s===subj?'active':''}" data-subj="${s}">${SUBJECT_META[s].label}</button>`).join("")}
      </div>
      <div class="reviewer-box">${escapeHtml(content)}</div>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen = state.reviewerReturnScreen; route(); });
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.reviewerSubject = btn.dataset.subj; renderReviewer(); });
  });
}

function renderQuestion(){
  clearInterval(state.timerId);
  state.locked = false;
  state.timeLeft = state.currentTimerSeconds || PRACTICE_TIMER;

  const item = state.quizQueue[state.qIndex];
  if(!item){
    clearInterval(state.timerId);
    console.error("Quiz queue is empty or question index is invalid.", state.quizQueue, state.qIndex);
    state.screen = "home";
    route();
    return;
  }
  const meta = SUBJECT_META[item.subject];
  bg(meta.soft);

  const score = state.answers.filter(a=>a.correct).length;

  app.innerHTML = `
    <div class="fade-in">
      <div class="quiz-top">
        <div class="subj-pill" style="background:${meta.color}">${state.practiceType.toUpperCase()}</div>
        <div class="score-chip">SCORE ${String(score).padStart(2,'0')}</div>
      </div>
      <div class="track"><div class="track-seg"><i style="width:${(state.qIndex/state.quizQueue.length*100)}%;background:${meta.color}"></i></div></div>
      <div class="qhead">
        <span class="qcount">Q${state.qIndex+1} / ${state.quizQueue.length} &middot; ${meta.label}${item.isScenario ? '<span class="qtag">SCENARIO</span>' : ''}</span>
        <div class="timer-ring">
          <svg width="40" height="40">
            <circle cx="20" cy="20" r="16" stroke="var(--border)" stroke-width="4" fill="none"/>
            <circle id="ringProgress" cx="20" cy="20" r="16" stroke="${meta.color}" stroke-width="4" fill="none"
              stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"/>
          </svg>
          <div class="tnum" id="tnum">${state.timeLeft}</div>
        </div>
      </div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <div class="choices" id="choices">
        ${item.c.map((choice,i)=>`
          <button class="choice" data-i="${i}">
            <span class="klabel">${String.fromCharCode(65+i)}</span>
            <span>${escapeHtml(choice)}</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=> lockAnswer(parseInt(btn.dataset.i)));
  });
  runTimer();
}

function runTimer(){
  const ring = document.getElementById("ringProgress");
  const tnum = document.getElementById("tnum");
  const total = state.currentTimerSeconds || PRACTICE_TIMER;
  const circumference = 100.5;
  state.timerId = setInterval(()=>{
    state.timeLeft -= 0.25;
    if(tnum) tnum.textContent = Math.max(0, Math.ceil(state.timeLeft));
    if(ring) ring.style.strokeDashoffset = circumference * (1 - state.timeLeft/total);
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      if(!state.locked) lockAnswer(-1);
    }
  }, 250);
}

function lockAnswer(choiceIndex){
  if(state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);

  const item = state.quizQueue[state.qIndex];
  const isCorrect = choiceIndex === item.a;
  state.answers.push({
    subject:item.subject, q:item.q, choices:item.c,
    correctIndex:item.a, selectedIndex:choiceIndex, correct:isCorrect
  });

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach((btn,i)=>{
    btn.classList.add("disabled");
    if(i === item.a) btn.classList.add("correct");
    if(i === choiceIndex && !isCorrect) btn.classList.add("wrong");
    if(i !== item.a && i !== choiceIndex) btn.classList.add("dim");
  });

  if(isCorrect){ spawnFloatingPoint("+1", "var(--good)"); }
  else if(choiceIndex >= 0){ document.querySelector(".qtext").parentElement.classList.add("shake"); }

  setTimeout(()=>{
    if(state.qIndex < state.quizQueue.length - 1){
      state.screen = "transition"; route();
    } else {
      state.screen = "results"; route();
    }
  }, 850);
}

function renderTransition(){
  clearInterval(state.timerId);
  const nextItem = state.quizQueue[state.qIndex + 1];
  const meta = SUBJECT_META[nextItem.subject];
  bg(meta.soft);
  app.innerHTML = `
    <div class="fade-in transition-screen">
      <div class="transition-dot" style="background:${meta.color}">${state.qIndex + 2}</div>
      <div class="tsub">${meta.label}</div>
      <div class="tnext">GET READY...</div>
    </div>
  `;
  setTimeout(()=>{
    state.qIndex++;
    state.screen = "quiz";
    route();
  }, TRANSITION_MS);
}

function spawnFloatingPoint(text, color){
  const el = document.createElement("div");
  el.className = "float-pt"; el.textContent = text; el.style.color = color;
  const rect = app.getBoundingClientRect();
  el.style.left = (rect.right - 70) + "px"; el.style.top = (rect.top + 20) + "px";
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 800);
}

function renderResults(){
  clearInterval(state.timerId);
  bg();
  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.correct).length;
  const pct = Math.round((correct/total)*100);

  let msg = "Keep going!";
  if(pct >= 85) msg = "Outstanding work!";
  else if(pct >= 70) msg = "Great job!";
  else if(pct >= 50) msg = "Good effort!";

  app.innerHTML = `
    <div class="fade-in">
      <div class="result-hero">
        <div class="pct">${pct}%</div>
        <div class="frac">${correct} OUT OF ${total} CORRECT &middot; ${state.practiceType.toUpperCase()}</div>
        <div class="msg">${msg}</div>
      </div>
      <p class="fine-print" id="saveNote">Saving your result...</p>
      <div class="btn-row">
        <button class="primary-btn ghost" id="answersBtn">📝 View My Answers</button>
        <button class="primary-btn ghost" id="reviewBtn">📖 Open Reviewer</button>
        <button class="primary-btn" id="backBtn">Back to Home</button>
      </div>
    </div>
  `;

  autoSaveResult({testType: state.practiceType, terms: state.practiceTerms, correct, total, pct});

  document.getElementById("answersBtn").addEventListener("click", ()=>{ state.screen="answerReview"; route(); });
  document.getElementById("reviewBtn").addEventListener("click", ()=>{ goToReviewer("results"); });
  document.getElementById("backBtn").addEventListener("click", ()=>{
    state.practiceType=null; state.practiceSubjects=[]; state.activeAssignment=null; state.screen="home"; route();
  });
}

async function autoSaveResult({testType, terms, correct, total, pct}){
  const note = document.getElementById("saveNote");
  if(state.saved){ if(note) note.textContent = "Result saved."; return; }
  try{
    const subjectsCovered = [...new Set(state.answers.map(a=>a.subject))];
    const subjectBreakdown = subjectsCovered.map(s=>({
      subject:s,
      correct: state.answers.filter(a=>a.subject===s && a.correct).length,
      total: state.answers.filter(a=>a.subject===s).length
    }));
    await db.collection("attempts").add({
      studentEmail: state.student.email, studentName: state.student.name,
        classId: state.activeClassId || null,
        testType, terms: ["second"], term: "second", subjects: subjectsCovered, subjectBreakdown,
      correct, total, pct, timestamp: Date.now()
    });
    state.saved = true;
    if(note) note.textContent = "Result saved to your progress history.";
  }catch(err){
    if(note) note.textContent = "Couldn't save automatically, check your connection.";
    console.error(err);
  }
}

function renderAnswerReview(){
  bg();
  logSelfAssessment("answerReview");
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Your Answers</div>
      </div>
      ${state.answers.map((a,i)=>`
        <div class="review-item">
          <div class="ri-q">Q${i+1}. ${escapeHtml(a.q)}</div>
          ${a.choices.map((ch,ci)=>{
            let cls = "";
            if(ci === a.correctIndex) cls = "correct";
            else if(ci === a.selectedIndex) cls = "wrong";
            return `<div class="ri-c ${cls}">${String.fromCharCode(65+ci)}. ${escapeHtml(ch)}${ci===a.correctIndex?' ✓':''}${ci===a.selectedIndex && ci!==a.correctIndex?' ✗ (your answer)':''}</div>`;
          }).join("")}
        </div>
      `).join("")}
      <button class="primary-btn ghost" id="backBtn2" style="margin-top:6px;">Back to Results</button>
    </div>
  `;
  const goBack = ()=>{ state.screen="results"; route(); };
  document.getElementById("backBtn").addEventListener("click", goBack);
  document.getElementById("backBtn2").addEventListener("click", goBack);
}

async function renderMyProgress(){
  bg();
  logSelfAssessment("myProgress");
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading your history...</p></div>`;
  let rows = [];
  try{
    const snap = await db.collection("attempts").where("studentEmail","==",state.student.email).get();
    snap.forEach(d => rows.push(d.data()));
    rows.sort((a,b)=> b.timestamp - a.timestamp);
  }catch(e){ console.error(e); }

  const tableRows = rows.map(r=>{
     const tag = r.testType==="pretest" ? `<span class="tag-pre">PRE</span>` : `<span class="tag-post">POST</span>`;
     return `<tr><td>${tag}</td><td>Second Term</td><td>${subjectLabels(r.subjects)}</td><td>${r.correct}/${r.total}</td><td>${r.pct}%</td><td>${fmtDate(r.timestamp)}</td></tr>`;
  }).join("");

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">My Progress</div>
      </div>
      ${rows.length === 0 ? `<p class="empty-note">No attempts yet, try a Pre-Test or Post-Test practice.</p>` : `
        <div style="overflow-x:auto;">
          <table class="results-table">
            <thead><tr><th>Test</th><th>Term</th><th>Subject(s)</th><th>Score</th><th>%</th><th>Date</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      `}
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
}

function renderJoinClass(){
  bg();
  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">Join a Class</div>
      </div>
      <p class="fine-print" style="margin-top:0; margin-bottom:14px;">Enter the class code your teacher gave you.</p>
      <input type="text" id="joinCodeInput" placeholder="Enter class code">
      ${state.joinError ? `<p class="error-note">${escapeHtml(state.joinError)}</p>` : ``}
      <button class="primary-btn" id="joinBtn">Join Class</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
  document.getElementById("joinBtn").addEventListener("click", async ()=>{
    const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
    state.joinError = "";
    if(!code){ state.joinError = "Please enter a class code."; renderJoinClass(); return; }
    const btn = document.getElementById("joinBtn");
    btn.disabled = true; btn.textContent = "Joining...";
    try{
      const snap = await db.collection("classes").where("joinCode","==",code).limit(1).get();
      if(snap.empty){ state.joinError = "No class found with that code."; renderJoinClass(); return; }
      const classDoc = snap.docs[0];
      state.activeClassId = classDoc.id;
      state.activeClass = {id: classDoc.id, ...classDoc.data()};
      state.activeAssignment = null;
      db.collection("enrollments").add({
        studentEmail: state.student.email, studentName: state.student.name,
        classId: classDoc.id, joinedAt: Date.now()
      }).catch(e=>console.error(e));
      state.screen = "studentClass"; route();
    }catch(err){ state.joinError = err.message; renderJoinClass(); }
  });
}

async function renderStudentClass(){
  bg();
  app.innerHTML = `<div class="fade-in"><p class="empty-note">Loading class...</p></div>`;
  const c = state.activeClass;

  db.collection("classViews").add({
    studentEmail: state.student.email, studentName: state.student.name,
    classId: state.activeClassId, timestamp: Date.now()
  }).catch(e=>console.error(e));

  let assignment = null;
  let preUsed = 0, postUsed = 0;
  try{
    const [assignDoc, preSnap, postSnap] = await Promise.all([
      db.collection("assignments").doc(state.activeClassId).get(),
      db.collection("attempts").where("classId","==",state.activeClassId).where("studentEmail","==",state.student.email).where("testType","==","pretest").get(),
      db.collection("attempts").where("classId","==",state.activeClassId).where("studentEmail","==",state.student.email).where("testType","==","posttest").get()
    ]);
    if(assignDoc.exists) assignment = assignDoc.data();
    preUsed = preSnap.size; postUsed = postSnap.size;
  }catch(e){ console.error(e); }

  state.activeAssignment = assignment;
  if(assignment){
    assignment.terms = ["second"];
    assignment.term = "second";
  }
  state.reviewerTerms = ["second"];

  if(!assignment){
    app.innerHTML = `
      <div class="fade-in">
        <div class="navbar">
          <button class="pill-btn outline" id="backBtn">Back</button>
          <div class="who">${escapeHtml(c.teacherName||"")}</div>
        </div>
        <div class="subject-strip">${(c.subjects||[]).map(s=>`<div class="subject-chip ${s}">${SUBJECT_META[s].label.toUpperCase()}</div>`).join("")}</div>
        <p class="field-label">${escapeHtml(c.className)}</p>
        <p class="fine-print" style="margin-top:-6px;">Your teacher hasn't set up a test for this class yet. Check back later, or use the reviewer in the meantime.</p>
        <button class="primary-btn ghost" id="reviewCardBtn">📖 Open Reviewer</button>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
    document.getElementById("reviewCardBtn").addEventListener("click", ()=>{ goToReviewer("studentClass"); });
    return;
  }

  const now = Date.now();
  const notYetOpen = assignment.scheduleStart && now < assignment.scheduleStart;
  const alreadyClosed = assignment.scheduleEnd && now > assignment.scheduleEnd;
  const withinWindow = !notYetOpen && !alreadyClosed;

  function windowText(){
    if(!assignment.scheduleStart && !assignment.scheduleEnd) return "Open anytime";
    const startTxt = assignment.scheduleStart ? fmtDate(assignment.scheduleStart) : "now";
    const endTxt = assignment.scheduleEnd ? fmtDate(assignment.scheduleEnd) : "no end date";
    return `${startTxt} — ${endTxt}`;
  }

  const preLeft = Math.max(0, (assignment.maxAttempts||1) - preUsed);
  const postLeft = Math.max(0, (assignment.maxAttempts||1) - postUsed);

  app.innerHTML = `
    <div class="fade-in">
      <div class="navbar">
        <button class="pill-btn outline" id="backBtn">Back</button>
        <div class="who">${escapeHtml(c.teacherName||"")}</div>
      </div>
      <div class="subject-strip">${(assignment.subjects||c.subjects||[]).map(s=>`<div class="subject-chip ${s}">${SUBJECT_META[s].label.toUpperCase()}</div>`).join("")}</div>
      <p class="field-label">${escapeHtml(c.className)}</p>
      <div class="assign-box">
         <div class="al-row"><span class="al-label">Term</span><span class="al-value">Second Term</span></div>
        <div class="al-row"><span class="al-label">Questions</span><span class="al-value">${assignment.numQuestions||20}</span></div>
        <div class="al-row"><span class="al-label">Timer per question</span><span class="al-value">${assignment.timerSeconds||20}s</span></div>
        <div class="al-row"><span class="al-label">Attempts allowed</span><span class="al-value">${assignment.maxAttempts||1}</span></div>
        <div class="al-row"><span class="al-label">Available</span><span class="al-value">${windowText()}</span></div>
      </div>
      ${notYetOpen ? `<p class="error-note">This test isn't open yet.</p>` : ``}
      ${alreadyClosed ? `<p class="error-note">This test window has closed.</p>` : ``}
      <button class="primary-btn" id="startPreBtn" ${(!withinWindow || preLeft<=0) ? 'disabled':''}>📝 Start Pre-Test (${preLeft} left)</button>
      <button class="primary-btn" id="startPostBtn" style="margin-top:10px;" ${(!withinWindow || postLeft<=0) ? 'disabled':''}>✅ Start Post-Test (${postLeft} left)</button>
      <button class="primary-btn ghost" id="reviewCardBtn" style="margin-top:10px;">📖 Open Reviewer</button>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; route(); });
  document.getElementById("reviewCardBtn").addEventListener("click", ()=>{ goToReviewer("studentClass"); });

  const startBtn = (id, testType) => {
    const btn = document.getElementById(id);
    if(btn) btn.addEventListener("click", ()=>{
      state.practiceType = testType;
        state.practiceTerms = ["second"];
      state.practiceSubjects = assignment.subjects || c.subjects || [];
      state.currentTimerSeconds = assignment.timerSeconds || PRACTICE_TIMER;
      state.quizQueue = buildAssignedQueue(assignment, testType);
      if(!state.quizQueue.length){
        console.error("No questions found for", testType, assignment);
        alert("No questions are available for the selected term and subject(s).");
        return;
      }
      state.qIndex = 0; state.answers = []; state.saved = false;
      state.screen = "quiz"; route();
    });
};
  startBtn("startPreBtn", "pretest");
  startBtn("startPostBtn", "posttest");
}

route();
</script>
